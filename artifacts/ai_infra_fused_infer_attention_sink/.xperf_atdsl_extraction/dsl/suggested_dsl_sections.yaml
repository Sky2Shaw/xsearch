- name: shape_layout.contract
  purpose: Normalize query/layout families, attentionOut layouts, softmaxLse layouts, and varlen prefix rules into stable Stage-2 fields.
  fields:
  - path: shape_layout.query_layout_families
    meaning: Canonical B/S1/N/D and T/N/D axis mappings for BSH, BSND, BNSD, NSD, TND, and NTD.
    evidence: op_host/ai_infra_fused_infer_attention_sink_infershape.cpp:120-296
    confidence: high
  - path: shape_layout.attention_out_layouts
    meaning: Output rank and axis order for BSH, BSND, BNSD, NBSD, TND, NTD, and NSD.
    evidence: op_host/ai_infra_fused_infer_attention_sink_infershape.cpp:200-256
    confidence: high
  - path: shape_layout.softmax_lse_layouts
    meaning: T,N,1 versus B,N,S1,1 LSE layouts and the TND-family prefixBS1 offset rule.
    evidence: op_kernel/fia_block_vec_nonquant_mla_sink.h:751-774
    confidence: high
- name: sparse.policy
  purpose: Capture sparseMode, pre/next token, sink, and invalid-row semantics as reusable validators instead of scattered helper logic.
  fields:
  - path: sparse.policy.mode
    meaning: LEFT_UP_CAUSAL, ALL_MASK, BAND, and DEFAULT_MASK behavior families.
    evidence: op_host/fia_tiling_nonquant_sink.cpp:591-639
    confidence: high
  - path: sparse.policy.invalid_row_rule
    meaning: Host invalid-row detection and kernel-side correction/export preconditions.
    evidence: op_host/fia_tiling_nonquant_sink.cpp:461-475
    confidence: high
  - path: sparse.policy.fd_pre_next_token_rule
    meaning: FlashDecode preTokensPerBatch and nextTokensPerBatch reconstruction from sparseMode, sinkNumber, and actual sequence lengths.
    evidence: op_kernel/fia_block_vec_flashdecode_sink.h:390-438
    confidence: high
- name: flash_decode.metadata_bridge
  purpose: Make the split-core producer, host fdRes bridge, and kernel FD consumers explicit even though the planner implementation remains external.
  fields:
  - path: flash_decode.fdparams.used_vec_num
    meaning: AIV bound for active FD merge cores.
    evidence: op_kernel/fia_kernel_nonquant_sink.h:731-761
    confidence: high
  - path: flash_decode.fdparams.metadata_arrays
    meaning: AIC/AIV arrays copied by SetSplitOutput and reconstructed by FlashDecode.
    evidence: reports/external_dependencies.yaml
    confidence: high
  - path: flash_decode.fdparams.bridge_status
    meaning: External producer note plus verified host-writer and kernel-consumer surfaces.
    evidence: dsl/flash_decode_metadata_bridge.yaml
    confidence: high
- name: workspace.mla_tail
  purpose: Separate host-budget-only MLA tail regions from explicit GM bindings and record any UB or alias bridge.
  fields:
  - path: workspace.mla.tail_regions[].binding_status
    meaning: Alias, local-UB bridge, or host-budget-only stub classification.
    evidence: auxiliary/workspace_cross_reference.yaml
    confidence: high
  - path: workspace.mla.tail_regions[].kernel_binding_evidence
    meaning: Direct SetGlobalBuffer or alias evidence for each tail region.
    evidence: dsl/mla_workspace_tail_contract.yaml
    confidence: high
  - path: workspace.mla.tail_regions[].validation_note
    meaning: Guardrail text that blocks lowering a budget stub as a standalone GM tensor.
    evidence: dsl/mla_workspace_tail_contract.yaml
    confidence: high
- name: scalar.offset_rules
  purpose: Turn prefix sums, preload-slot addressing, padded headDim strides, and FD partial-output offsets into reusable lowering rules.
  fields:
