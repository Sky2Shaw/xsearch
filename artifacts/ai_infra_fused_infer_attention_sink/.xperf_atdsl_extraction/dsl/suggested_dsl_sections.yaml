- name: workspace.layout
  purpose: Encode normal, MLA nUpdate, and FD workspace sizes and offsets.
  fields:
  - path: workspace.normal.mm1_vec1_mm2_vec2
    meaning: Preload-scaled normal workspace regions.
    evidence: op_host/fia_tiling_nonquant_sink.cpp:517-530
    confidence: high
  - path: workspace.mla.nupdate_softmax_sum
    meaning: Extra MLA int32 nUpdate and softmax sum regions.
    evidence: op_host/fia_tiling_nonquant_mla_sink.cpp:491-508
