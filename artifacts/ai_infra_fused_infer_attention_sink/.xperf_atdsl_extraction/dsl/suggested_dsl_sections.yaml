  - path: flash_decode.merge.weight_formula
    meaning: ColMax, RowSub, Exp, sum-weight, divide normalization.
    evidence: op_kernel/fia_block_vec_flashdecode_sink.h:258-290
    confidence: high
  - path: flash_decode.merge.output_layouts
    meaning: BSH/BNSD/NBSD/TND/NTD output copy choices.
    evidence: op_kernel/fia_block_vec_flashdecode_sink.h:292-349
