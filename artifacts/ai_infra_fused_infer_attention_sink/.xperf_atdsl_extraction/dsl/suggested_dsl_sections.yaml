  - path: scalar.offset_rules.mla_mm2_reload_slot
    meaning: Preload-slot ring offset for MLA Vec2 mm2Res reloads.
    evidence: op_kernel/fia_block_vec_nonquant_mla_sink.h:1120-1163
    confidence: high
  - path: scalar.offset_rules.mla_nupdate_atomic_base
    meaning: Atomic target base offset for MLA nUpdate apply.
    evidence: op_kernel/fia_block_vec_nonquant_mla_sink.h:657-717
