shape_layout_contract:
  canonical_axes:
    - axis: B
      meaning: batch index
    - axis: S1
      meaning: query sequence rows
    - axis: S2
      meaning: key/value sequence rows
    - axis: N
      meaning: query head count
    - axis: G
      meaning: per-head group span used by grouped-query layouts
    - axis: D
      meaning: value head dimension
    - axis: T
      meaning: flattened token rows for varlen TND-family layouts
  query_layout_families:
    dense_family:
      layouts:
        - BSH
        - BSND
        - BNSD
        - NSD
      source_evidence_ids:
        - SE-SHAPE-LAYOUT-CONTRACT
        - SE-TEST-INFER-SHAPE-LAYOUTS
      axis_mappings:
        BSH: [B, S1, N*D]
        BSND: [B, S1, N, D]
        BNSD: [B, N, S1, D]
        NSD: [N, S1, D]
    varlen_family:
      layouts:
        - TND
        - NTD
      source_evidence_ids:
        - SE-SHAPE-LAYOUT-CONTRACT
        - SE-TEST-INFER-SHAPE-LAYOUTS
      axis_mappings:
        TND: [T, N, D]
        NTD: [N, T, D]
  attention_out_layouts:
    layouts:
      - name: BSH
        output_shape: [B, S1, N*valueD]
      - name: BSND
        output_shape: [B, S1, N, valueD]
      - name: BNSD
        output_shape: [B, N, S1, valueD]
      - name: NBSD
        output_shape: [N, B, S1, valueD]
      - name: TND
        output_shape: [T, N, valueD]
      - name: NTD
        output_shape: [N, T, valueD]
      - name: NSD
        output_shape: [N, S1, valueD]
    source_evidence_ids:
      - SE-SHAPE-LAYOUT-CONTRACT
      - SE-FD-OUTPUT-LAYOUTS
      - SE-TEST-INFER-SHAPE-LAYOUTS
  softmax_lse_layouts:
    tnd_family:
      layouts:
        - TND
        - NTD
        - TND_NTD
        - NTD_TND
      output_shape: [T, N, 1]
      source_evidence_ids:
        - SE-SHAPE-LAYOUT-CONTRACT
        - SE-MLA-LSE-LAYOUT-COPY
        - SE-TEST-INFER-SHAPE-LAYOUTS
    dense_family:
      layouts:
        - BSH
        - BSND
        - BNSD
      output_shape: [B, N, S1, 1]
      source_evidence_ids:
        - SE-SHAPE-LAYOUT-CONTRACT
        - SE-MLA-LSE-LAYOUT-COPY
        - SE-TEST-INFER-SHAPE-LAYOUTS
  varlen_rules:
    - name: tnd_query_prefix
      rule: actualSeqLengthsGmQ contributes prefixBS1 when TND-family kernels export softmaxLse or final attention rows.
      source_evidence_ids:
        - SE-SHAPE-LAYOUT-CONTRACT
        - SE-MLA-LSE-LAYOUT-COPY
    - name: query_value_dim_coupling
      rule: attentionOut keeps the query-side B/S1/N topology but replaces D with the value-side valueD.
      source_evidence_ids:
        - SE-SHAPE-LAYOUT-CONTRACT
  validation_rules:
    constraints:
      - C-SHAPE-LAYOUT-CONTRACT
    risks:
      - R-SHAPE-LAYOUT-CONTRACT-DRIFT
common_backed_shape_layout_semantics:
  supplement_sources:
    - common_supplement/shape_layout_extraction.yaml
    - common_supplement/common_dependency_inventory.yaml
  source_evidence_ids:
    - SE-COMMON-FIA-TILING-SHAPE-CPP
    - SE-COMMON-FIA-TILING-SHAPE-H
    - SE-COMMON-FIA-TILING-INFO-H
  common_axis_map:
    BSH: [B, S, H]
    BSND: [B, S, N, D]
    BNSD: [B, N, S, D]
    NZ: [Bn, N, D1, Bs, D0]
    TND: [T, N, D]
    NBSD: [N, B, S, D]
    NTD: [N, T, D]
    BS2: [B, S2]
    S1S2: [S1, S2]
    BnBsH: [Bn, Bs, H]
    BnNBsD: [Bn, N, Bs, D]
    BnBsND: [Bn, Bs, N, D]
    BNS1S2: [B, N, S1, S2]
    INS1S2: [CONST, N, S1, S2]
    BNS11: [B, N, S1, CONST]
    TN1: [T, N, CONST]
    BS1S2: [B, S1, S2]
    B1S1S2: [B, CONST, S1, S2]
    IS1S2: [CONST, S1, S2]
    I1S1S2: [CONST, CONST, S1, S2]
  derived_dimensions:
    H: N * D
    D_derivation:
      - direct D axis when present
      - H / N when H exists, N is nonzero, and H is divisible by N
      - D1 * D0 for NZ-style storage axes
  nz_layout_contract:
    axis_order: [Bn, N, D1, Bs, D0]
    expected_shape: [Bn, N, D / D0, Bs, D0]
    d0_default: 16
    d_from_storage_axes: D1 * D0
  shape_compare_modes:
    enum_values:
      EQUAL: 0
      GREATER: 1
      GREATER_EQUAL: 2
      LESS: 3
      LESS_EQUAL: 4
      NOT_EQUAL: 5
      IGNORE_INPUT: 6
    default_compare_type: EQUAL
    ignore_input_behavior: valid compare function that always passes, although serialization falls through to UNKNOWN.
  stage2_import_note: Stage-2 shape DSL should carry ordered axes, derived dimensions, NZ packing, and per-axis compare modes as first-class validation fields.
