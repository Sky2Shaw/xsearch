  - id: OC-MLA-MM2-NUPDATE-BARRIER
    title: MLA MM2 waits for nUpdate before first fixpipe
    pattern: ProcessMm2 waits syncV1NupdateC2 and uses atomic add for non-first S-inner loops.
    evidence:
    - op_kernel/fia_block_cube_nonquant_mla_sink.h:1034-1057
