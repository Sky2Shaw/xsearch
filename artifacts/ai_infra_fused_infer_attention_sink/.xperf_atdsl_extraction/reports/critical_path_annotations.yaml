    line_range:
      start: 958
      end: 1112
    why_critical: GQA QK stage produces scores for the shared Vec1 owner and owns Q/K L1 reuse.
    sync_edges:
    - sets syncC1V1
    deep_annotation: annotations/functions/deep/0035_op_kernel_fia_block_cube_nonquant_gqa_sink.h__FiaBlockCubeNonQuantGqa_FIAT_Config_ComputeMm1.yaml
