  possible_dsl_fields:
  - path: memory_copy.int4_divisor
    meaning: HALF_SIZE_DIVISOR = 2 adjustment for int4b_t dValue.
  - path: memory_copy.stride_limit
    meaning: ND_MATRIX_STRIDE_LIMIT = 65536 decomposition threshold.
  lowering_hint: Lower int4 divisor and stride-limit check as preconditions to the copy loop; omitting either produces wrong addresses or hardware errors.
  source_evidence:
  - id: SE-COMMON-ND2NZ-INT4-DIVISOR
    role: HALF_SIZE_DIVISOR adjustment in Nd2NzParams for int4b_t.
