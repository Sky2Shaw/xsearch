optimization_cards:
# =============================================================================
# Section 1: Pipeline & Scheduler
#   编排元数据: pipeline.execution_order
#   涵盖算子级调度重叠、Host 侧任务划分与 metadata 生成。
# =============================================================================

# -----------------------------------------------------------------------------
# 1.1 RunInfo Ring Overlap
# -----------------------------------------------------------------------------
- id: OC-RUNINFO-THREE-STAGE-RING
  canonical_name: pipeline.runinfo_three_stage_ring
  aliases:
  - runinfo_ring
  - mm1_vec1_mm2_vec2_overlap
  title: RunInfo ring overlaps MM1, Vec1/MM2, and Vec2
  applies_to:
    variants:
    - nonquant
    - gqa
    - mla
    owners:
    - FiaKernelNonQuant<FIAT>
    - FiaKernelNonQuantMla<FIAT, CubeBlockType, VecBlockType, FdBlockType>
    stages:
    - gqa.mm1
    - gqa.vec1
    - gqa.mm2
    - gqa.vec2.output
    - mla.mm1
    - mla.vec1
    - mla.mm2
    - mla.vec2.output
  pattern_summary: ExecuteTask uses a three-entry RunInfo cache where the current slot drives MM1, the older slot drives Vec1 and MM2, and the previous slot drives Vec2 before being invalidated.
  optimization_intent: Overlap AIC/AIV stages across loops while keeping stage ordering and ring-slot ownership explicit.
  preconditions:
  - FIA_PRELOAD_TASK_CACHE_SIZE remains at least three slots.
  - preLoadNum and workspace ring depth are compatible with the scheduler overlap pattern.
  tunable_knobs:
  - preLoadNum
  - s2BaseSize
  constraints:
  - C-EVENT-ORDER-RUNINFO
  risks:
  - R-RUNINFO-STAGE-REORDER-DEADLOCK
  - R-SPLITKV-PARTIAL-COLLISION
  possible_dsl_fields:
  - path: pipeline.scheduler.runinfo_ring
    meaning: Mapping from loop-relative cache slot to stage responsibility.
  - path: pipeline.scheduler.invalid_after_vec2
    meaning: Slot invalidation happens after Vec2 finishes, not after MM2.
  lowering_hint: Emit the scheduler overlap as explicit slot roles instead of prose; stage graph builders need concrete loop-relative edges.
  source_evidence:
  - id: SE-RUNINFO-THREE-STAGE-RING-NONQUANT
    role: Nonquant/GQA ExecuteTask overlap pattern.
  - id: SE-RUNINFO-THREE-STAGE-RING-MLA
    role: MLA ExecuteTask overlap pattern.
  confidence: high

# -----------------------------------------------------------------------------
# 1.2 Host Split-Core Planning
# -----------------------------------------------------------------------------
- id: OC-COMMON-SPLIT-CORE-BALANCING
  canonical_name: common.split_core.discrete_cost_balancing
  aliases:
  - common_split_core_cost
  - fa_fd_tolerance_balancing
  title: Common split-core balances discrete M/S2 block costs
  applies_to:
    variants:
    - nonquant
    - gqa
    - mla
    - flash_decode
    owners:
    - split_core common host planner
    stages:
    - host.split_core
  pattern_summary: The common planner scores blocks as 6*ceil(M/16)+10*ceil(S2/64), searches bounded core counts, applies FA/FD tolerance ratios of 2, and emits per-core ranges plus FD metadata.
  optimization_intent: Expose split-core balancing as structured DSL cost/search policy instead of opaque host output arrays.
  preconditions:
  - Host CreateSplitInput has populated BaseInfo and SplitParam.
  - supportFD, sparseMode, sinkNumber, and keySinkNumber are carried through from tiling metadata.
  tunable_knobs:
  - mBaseSize
  - s2BaseSize
  - gS1BaseSizeOfFd
  constraints:
  - C-COMMON-SPLIT-CORE-COST-RANGE
  risks:
  - R-COMMON-SPLIT-CORE-MODEL-OMITTED
  possible_dsl_fields:
  - path: split_core.cost_model.block_cost_formula
    meaning: Discrete aligned M/S2 formula used for block and tail scoring.
  - path: split_core.assignment_phases
    meaning: Ordered batch, row, block, and force assignment phases with supportFD gates.
  lowering_hint: Lower the common planner as a costed range-assignment contract; preserving only bN2End/gS1End/s2End loses planner semantics.
  source_evidence:
  - id: SE-COMMON-SPLIT-CORE-CPP
    role: Common split-core implementation.
  - id: SE-COMMON-SPLIT-CORE-H
    role: Common split-core structs and tolerance constants.
  confidence: high

- id: OC-COMMON-SPARSE-SINK-S2-RANGE
  canonical_name: common.split_core.sparse_sink_s2_range_shaping
  aliases:
  - common_sparse_s2_range
  - key_sink_split_core
  title: Sparse and sink metadata shape common S2 ranges
  applies_to:
    variants:
    - nonquant
    - gqa
    - mla
    - flash_decode
    owners:
    - split_core common host planner
    stages:
    - host.split_core
  pattern_summary: Common split-core derives S2 token bounds from sparse mode, pre/next tokens, BAND shifts, sinkNumber/keySinkNumber selection, and supportFD before block-range assignment and FD metadata recording.
  optimization_intent: Keep sparse/sink range shaping explicit so Stage-2 planners do not rebalance against impossible S2 blocks.
  preconditions:
  - sparseMode and mask/sink metadata are valid for the selected tiling path.
  - keySinkNumber is considered when supportFD is true.
  tunable_knobs:
  - s2BaseSize
  - splitKVFlag
  constraints:
  - C-COMMON-SPLIT-CORE-COST-RANGE
  - C-SPARSE-POLICY-CONTRACT
  risks:
  - R-COMMON-SPLIT-CORE-MODEL-OMITTED
  - R-SPARSE-POLICY-DESYNC
  possible_dsl_fields:
  - path: split_core.sparse_s2_range
    meaning: Right-open S2 block range produced after token-window clipping and sink gap handling.
  - path: split_core.sink_selection
    meaning: supportFD-aware choice between sinkNumber and keySinkNumber.
  lowering_hint: Run sparse/sink shaping before cost and block-count modeling; doing it after assignment changes per-core work.
  source_evidence:
  - id: SE-COMMON-SPLIT-CORE-CPP
    role: S2 range, BAND, sink, and key-sink behavior.
  confidence: high

- id: OC-COMMON-FD-METADATA-MERGE-BEHAVIOR
  canonical_name: common.split_core.fd_metadata_and_merge_partitioning
  aliases:
  - common_fd_metadata
  - splitfd_vector_balancing
  title: Common split-core FD metadata drives merge partitioning
  applies_to:
    variants:
    - flash_decode
    owners:
    - split_core common host planner
    - FiaBlockVecFlashDecode<FIAT>
    stages:
    - host.split_core
    - flash_decode.merge
  pattern_summary: Common RecordFDInfo emits FD head and S2/GS1 split metadata only for qualifying split rows, then SplitFD balances FD vector work using the FD tolerance ratio.
  optimization_intent: Keep FD merge partitioning aligned with host split-core metadata and vector merge boundaries.
  preconditions:
  - supportFD is true.
  - curKvSplitPart exceeds one for rows requiring FD metadata.
  tunable_knobs:
  - gS1BaseSizeOfFd
  - splitKVFlag
  constraints:
  - C-COMMON-SPLIT-CORE-COST-RANGE
  - C-FD-METADATA
  risks:
  - R-COMMON-FD-METADATA-MISMATCH
  - R-FD-METADATA-DESYNC
  possible_dsl_fields:
  - path: flash_decode.fd_metadata.record_conditions
    meaning: Common conditions that decide whether a split row emits FD metadata.
  - path: flash_decode.fd_metadata.vector_boundaries
    meaning: SplitFD vector boundary selection using FD_TOLERANCE_RATIO.
  lowering_hint: Lower FD metadata generation together with FD merge scheduling; separating them can produce valid arrays with wrong vector ownership.
  source_evidence:
  - id: SE-COMMON-SPLIT-CORE-CPP
    role: RecordFDInfo and SplitFD behavior.
  - id: SE-COMMON-SPLIT-CORE-H
    role: FlashDecodeResult and SplitResult fields.
  confidence: high

# =============================================================================
# Section 2: MM1 Stage (Q x K Attention Score)
#   编排元数据: mm1.stage
#   涵盖 Q/K L1 加载策略、MM1 tiling、矩阵计算及 MM1->Vec1 桥接。
# =============================================================================

# -----------------------------------------------------------------------------
# 2.1 MM1 L1 Memory & Q-Tile Reuse
# -----------------------------------------------------------------------------
- id: OC-GQA-MM1-Q-L1-SNAPSHOT-REUSE
  canonical_name: gqa.mm1.q_l1_snapshot_reuse
  aliases:
  - gqa_q_l1_reuse
  - qL1Snapshot_reuse
  title: GQA MM1 reuses Q L1 tiles across K slices
  applies_to:
    variants:
    - gqa
    owners:
    - FiaBlockCubeNonQuantGqa<FIAT,Config>
    stages:
    - gqa.mm1
  pattern_summary: ComputeMm1 caches Q tiles in qL1Snapshot while streaming K from GM into kpL1Tensor per nL1 slice. Q reuse is keyed by batch/head/gS1 coordinate (qCoord) and guarded by canFullLoadQ. When the full Q set fits in L1_Q_BUFCNT, subsequent nL1 iterations skip CopyQToL1 and reuse the cached snapshot buffers.
  optimization_intent: Reduce Q reload traffic across the S2-inner loop by keeping Q L1 resident while K is streamed.
  preconditions:
  - GQA MM1 is active and the current M slice set can fully load into L1_Q_BUFCNT (canFullLoadQ).
  - Q reuse key (qCoord) matches the current batch/head/gS1 coordinate.
  - Q_EVENT lifetime is managed so cached Q buffers are not overwritten by concurrent MM1 or Vec1 stages.
  tunable_knobs:
  - s2BaseSize
  - preLoadNum
  constraints:
  - C-GQA-MM2-SYNC
  risks:
  - R-GQA-V-L1-LIFETIME
  possible_dsl_fields:
  - path: memory.l1.gqa.q_snapshot_signature
    meaning: Coordinate key (batch/head/gS1) and reuse scope for Q L1 caching across K slices.
  - path: memory.l1.gqa.q_snapshot_bufcnt
    meaning: Number of Q L1 buffers cached in the snapshot and first buffer ID for ring addressing.
  lowering_hint: Lower as an owner-qualified GQA MM1 policy; do not fold into the generic MM1 stage. Preserve the canFullLoadQ guard to avoid incorrect reuse when M tiling exceeds L1 capacity.
  source_evidence:
  - id: SE-GQA-Q-L1-SNAPSHOT
    role: Q snapshot initialization, reuse check, and buffer cycling inside GQA ComputeMm1.
  confidence: high

# -----------------------------------------------------------------------------
# 2.1b K-Tile L1 Double-Buffer Ping-Pong
# -----------------------------------------------------------------------------
- id: OC-GQA-MM1-KP-L1-DOUBLE-BUFFER-PINGPONG
  canonical_name: gqa.mm1.kp_l1_double_buffer_pingpong
  aliases:
  - gqa_kp_l1_pingpong
  - k_tile_l1_double_buffer
  title: GQA MM1 streams K-tiles through L1 double-buffer ping-pong
  applies_to:
    variants:
    - gqa
    - nonquant
    owners:
    - FiaBlockCubeNonQuantGqa<FIAT,Config>
    - FiaBlockCubeNonQuant<FIAT>
    stages:
    - gqa.mm1
    - nonquant.mm1
  pattern_summary: ComputeMm1 cycles K-tiles through L1_KP_BUFCNT buffers (2 or 3) via kpOrSinkL1BufId. MTE2 copies K to L1 while MTE1 consumes the previous K-tile. WaitFlag/SetFlag on KP_EVENT0 coordinate producer-consumer overlap. When a K-tile is skipped by sparse bounds, SetFlag is still issued to prevent event counter deadlock.
  optimization_intent: Overlap K GM-to-L1 copy with MMAD compute while preserving event ordering correctness on sparse skip paths.
  preconditions:
  - MM1 is active and K-tile size (N_SPLIT_SIZE=128) fits in L1_KP_BUFCNT buffers.
  - KP_EVENT0 event IDs are not shared with Q_EVENT0 or other stages in the same loop.
  - Sparse skip logic must preserve SetFlag to prevent deadlock.
  tunable_knobs:
  - s2BaseSize
  - preLoadNum
  constraints:
  - C-EVENT-ORDER-RUNINFO
  risks:
  - R-RUNINFO-STAGE-REORDER-DEADLOCK
  possible_dsl_fields:
  - path: memory.l1.kp_buffer_count
    meaning: Number of K-tile L1 buffers for double/triple-buffer ping-pong.
  - path: memory.l1.kp_event_id_base
    meaning: Base event ID for K-tile producer-consumer synchronization.
  lowering_hint: Lower K-tile ping-pong as a distinct buffer policy from Q-snapshot reuse; the two policies coexist in MM1 but use different event families.
  source_evidence:
  - id: SE-GQA-KP-L1-PINGPONG
    role: K-tile buffer cycling and MTE2-MTE1 overlap in GQA ComputeMm1.
  - id: SE-GQA-KP-L1-EVENT-CYCLE
    role: KP_EVENT0 SetFlag/WaitFlag around CopyKToL1 and MMAD consumption.
  confidence: high

# -----------------------------------------------------------------------------
# 2.2 GM Copy Lowering
# -----------------------------------------------------------------------------
- id: OC-COMMON-GM-COPY-LOWERING
  canonical_name: common.memory_copy.gm_format_offset_and_nd_to_nz
  aliases:
  - common_gm_copy_lowering
  - nd_to_nz_copy_contract
  title: Common GM copy helpers lower layouts through format categories
  applies_to:
    variants:
    - nonquant
    - gqa
    - mla
    owners:
    - common memory_copy helpers
    stages:
    - copy.query_gm_to_l1
    - copy.kv_gm_to_l1
    - copy.post_quant_gm_to_ub
  pattern_summary: Layout and page-attention state select GmFormat, FormatCategory selects offsets, and query/KV copies lower ND-like GM layouts into NZ L1 tiles with explicit strides and fallback paths.
  optimization_intent: Make address generation and ND/NZ lowering reusable while preventing ad hoc layout-specific offset formulas.
  preconditions:
  - FIA layout and page-attention mode are known before copy lowering.
  - D extent, source stride, and destination NZ C0 stride are available.
  tunable_knobs:
  - headDimAlign
  constraints:
  - C-COMMON-GM-FORMAT-OFFSET-COPY
  risks:
  - R-COMMON-GM-OFFSET-COPY-MISLOWERED
  possible_dsl_fields:
  - path: memory_copy.gm_format
    meaning: Common enum selected from layout and page-attention state.
  - path: memory_copy.offset_category
    meaning: Stable FormatCategory dispatch key for offset calculation.
  - path: memory_copy.nd_to_nz_params
    meaning: Row count, column count, source stride, and NZ destination stride for lowering.
  lowering_hint: Lower copy helpers through FormatCategory first, then specialize ND-to-NZ or direct DataCopy behavior by selected format.
  source_evidence:
  - id: SE-COMMON-MEMORY-COPY-H
    role: Common GM format, offset, and copy helper definitions.
  confidence: high

# -----------------------------------------------------------------------------
# 2.3 MM1 to Vec1 Bridge
# -----------------------------------------------------------------------------
- id: OC-MM1-VEC1-SOFTMAX-PIPELINE-BRIDGE
  canonical_name: mm1_vec1.softmax_pipeline_bridge
  aliases:
  - mm1_vec1_bridge
  - dealbmm1res_pipeline
  title: DealBmm1ResBaseBlock bridges MM1 output to Vec1 softmax pipeline
  applies_to:
    variants:
    - nonquant
    - gqa
    - mla
    owners:
    - FiaBlockVecNonQuant<FIAT>
    - FiaBlockVecNonQuantMla<FIAT>
    stages:
    - mm1.output
    - vec1.input
    - vec1.softmax
  pattern_summary: MM1 results are read from mm1ResGm into UB, passed through ElewiseCompute (scale/bias), then SoftmaxFlashV2Compute (online row-max/row-sum update), then Cast to KV_T, and finally written to vec1ResGm for MM2 consumption. A sink-sparse skip path copies the previous loop's softmax state and emits zeroed output without invoking the full softmax pipeline.
  optimization_intent: Keep the MM1->Vec1 dataflow as a single contiguous pipeline so lowering does not fragment the UB-to-UB stages or lose the sink-skip fast path.
  preconditions:
  - MM1 has completed for the current preload slot and mm1ResGm contains valid QxK scores.
  - ElewiseCompute parameters (scale, bias, mask) are consistent with the tiling path.
  - Sink skip detection (IsSkipCal) agrees with host maskParams.
  tunable_knobs:
  - s2BaseSize
  - preLoadNum
  constraints:
  - C-VEC-UB-ALIGNMENT
  - C-INVALID-ROW-LSE-CORRECTION
  risks:
  - R-UB-ALIGNMENT-DRIFT
  - R-INVALID-ROW-SEMANTIC-DRIFT
  possible_dsl_fields:
  - path: pipeline.mm1_vec1_bridge.elewise_params
    meaning: Scale, bias, and mask parameters applied between MM1 output and softmax input.
  - path: pipeline.mm1_vec1_bridge.sink_skip_path
    meaning: Fast path that bypasses ElewiseCompute and SoftmaxFlashV2Compute for sink-skipped rows.
  lowering_hint: Lower the full pipeline as one stage contract; splitting ElewiseCompute from SoftmaxFlashV2Compute loses the sink-skip semantics and UB layout assumptions.
  source_evidence:
  - id: SE-MM1-VEC1-BRIDGE-PIPELINE
    role: DealBmm1ResBaseBlock full pipeline from mm1ResGm read to vec1ResGm write.
  - id: SE-MM1-VEC1-SINK-SKIP
    role: Sink skip path that copies softmax state and zeros output.
  confidence: high

# -----------------------------------------------------------------------------
# 2.4 Sparse Skip & Event Deadlock Guard
# -----------------------------------------------------------------------------
- id: OC-MM1-SPARSE-SKIP-L1-EVENT-DEADLOCK-GUARD
  canonical_name: mm1.sparse_skip.l1_event_deadlock_guard
  aliases:
  - mm1_sparse_skip_guard
  - isSkipCal_event_preserve
  title: MM1 sparse skip preserves event ordering to prevent deadlock
  applies_to:
    variants:
    - gqa
    - nonquant
    owners:
    - FiaBlockCubeNonQuantGqa<FIAT,Config>
    - FiaBlockCubeNonQuant<FIAT>
    stages:
    - gqa.mm1
    - nonquant.mm1
  pattern_summary: ComputeMm1 performs two-level sparse skip checks via IsSkipCal. When the entire mSize or a per-mL1 block misses the current nL1 tile, the inner MMAD loops are skipped. Crucially, SetFlag<KP_EVENT0> is still issued before continue to prevent the K-tile producer-consumer event counter from desyncing and deadlocking the pipeline.
  optimization_intent: Preserve correctness on sparse attention paths without sacrificing the K-tile double-buffer overlap.
  preconditions:
  - keySinkNumber > 0 and sparse mode is active for the current batch.
  - IsSkipCal agrees with host maskParams on token-window bounds.
  - KP_EVENT0 counter must advance monotonically across skipped and non-skipped iterations.
  tunable_knobs:
  - s2BaseSize
  constraints:
  - C-EVENT-ORDER-RUNINFO
  risks:
  - R-RUNINFO-STAGE-REORDER-DEADLOCK
  possible_dsl_fields:
  - path: mm1.sparse_skip.levels
    meaning: Two-level skip (whole-mSize vs per-mL1) with preserved event advance.
  - path: mm1.sparse_skip.event_preserve
    meaning: SetFlag must be issued even on skip paths to prevent deadlock.
  lowering_hint: Lower sparse skip as a conditional branch that always advances the event counter; omitting the SetFlag on skip paths introduces deadlock.
  source_evidence:
  - id: SE-MM1-SPARSE-SKIP-SETFLAG
    role: SetFlag on KP_EVENT0 before continue in sparse skip branch.
  - id: SE-MM1-SPARSE-SKIP-ISCAL
    role: Two-level IsSkipCal calls inside ComputeMm1.
  confidence: high

# -----------------------------------------------------------------------------
# 2.5 MM1 Output Fixpipe & Atomic-Add Accumulation
# -----------------------------------------------------------------------------
- id: OC-MM1-OUTPUT-FIXPIPE-ATOMIC-ADD-ACCUMULATION
  canonical_name: mm1.output.fixpipe_atomic_add_accumulation
  aliases:
  - mm1_atomic_add
  - k_split_accumulation
  title: MM1 output accumulates across K-split iterations via atomic add
  applies_to:
    variants:
    - nonquant
    - gqa
    owners:
    - FiaBlockCubeNonQuant<FIAT>
    - FiaBlockCubeNonQuantGqa<FIAT,Config>
    stages:
    - nonquant.mm1
    - gqa.mm1
  pattern_summary: DealMm1SingleMKN uses FixpipeCToGM with conditional SetAtomicAdd<MM_OUT_T>() when kStart != 0. This means the score matrix S is accumulated across K-split iterations (kSize split into K_SPLIT_SIZE chunks) via atomic add on the GM destination mm1ResGm. The dstStride is actualSingleProcessSInnerSizeAlign.
  optimization_intent: Reduce GM write bandwidth by accumulating partial MM1 results in-place rather than materializing full intermediate buffers.
  preconditions:
  - K dimension is larger than K_SPLIT_SIZE and requires splitting.
  - mm1ResGm has been initialized and the atomic-add destination stride matches the tiling alignment.
  - Data type width and alignment permit atomic-add on the target GM region.
  tunable_knobs:
  - headDimAlign
  constraints:
  - C-VEC-UB-ALIGNMENT
  risks:
  - R-SPLITKV-PARTIAL-COLLISION
  possible_dsl_fields:
  - path: mm1.output.atomic_add_condition
    meaning: kStart != 0 triggers atomic-add accumulation instead of overwrite.
  - path: mm1.output.dst_stride
    meaning: actualSingleProcessSInnerSizeAlign determines inter-row stride in mm1ResGm.
  lowering_hint: Lower the K-split loop with atomic-add as one accumulation contract; changing to separate buffers loses the in-place bandwidth benefit.
  source_evidence:
  - id: SE-MM1-OUTPUT-ATOMIC-ADD
    role: SetAtomicAdd conditional on kStart in DealMm1SingleMKN.
  - id: SE-MM1-K-SPLIT-FIXPIPE
    role: FixpipeCToGM with dstStride alignment across K-split chunks.
  confidence: high

# =============================================================================
# Section 3: Vec1 / Softmax Stage (Online Softmax & P-tile Generation)
#   编排元数据: vec1.stage
#   涵盖 online-softmax 数值管线、MLA nUpdate 侧通道、invalid-row 处理。
# =============================================================================

# -----------------------------------------------------------------------------
# 3.1 Online Softmax Core (FlashV2)
# -----------------------------------------------------------------------------
- id: OC-VEC1-ONLINE-SOFTMAX-FLASHV2
  canonical_name: vec1.online_softmax_flashv2
  aliases:
  - online_softmax
  - softmax_flashv2
  - vec1_softmax_pipeline
  title: Vec1 online softmax updates row-max and row-sum per S-inner loop
  applies_to:
    variants:
    - nonquant
    - gqa
    - mla
    owners:
    - FiaBlockVecNonQuant<FIAT>
    - FiaBlockVecNonQuantMla<FIAT>
    stages:
    - vec1.softmax
  pattern_summary: SoftmaxFlashV2Compute implements online softmax over MM1 output tiles. On the first S-inner loop it starts from default max/sum state; on subsequent loops it loads the previous loop's state from the preload-slot ring, updates row-max and row-sum via SoftmaxFlashV2, and writes the new state back into the ring. BRC (broadcast) mode doubles the row count for certain data types. The output P-tile (after Cast) is written to vec1ResGm for MM2 consumption.
  optimization_intent: Preserve numerical stability of online softmax across S2 splits while minimizing GM round-trips for intermediate max/sum state.
  preconditions:
  - MM1 output is available in UB for the current loop and tile.
  - preLoadNum ring depth is sufficient to hold softmax state across overlapping loop iterations.
  - SOFTMAX_TMP_BUFFER_SIZE and baseOffset computation remain consistent between writer and reader.
  tunable_knobs:
  - preLoadNum
  - s2BaseSize
  constraints:
  - C-VEC-UB-ALIGNMENT
  - C-INVALID-ROW-LSE-CORRECTION
  risks:
  - R-UB-ALIGNMENT-DRIFT
  - R-INVALID-ROW-SEMANTIC-DRIFT
  possible_dsl_fields:
  - path: vec1.softmax.online_state.max_ub
    meaning: Row-wise max tensor ring indexed by preload slot.
  - path: vec1.softmax.online_state.sum_ub
    meaning: Row-wise sum tensor ring indexed by preload slot.
  - path: vec1.softmax.online_state.exp_ub
    meaning: Row-wise exp tensor ring for P-tile generation.
  - path: vec1.softmax.first_loop_default
    meaning: First S-inner loop uses default max/sum instead of previous slot state.
  lowering_hint: Lower the online state as a preload-slot ring, not independent anonymous buffers; the ring index math must match the RunInfo overlap schedule.
  source_evidence:
  - id: SE-VEC1-SOFTMAX-FLASHV2
    role: SoftmaxFlashV2Compute online update logic and preload slot indexing.
  - id: SE-VEC1-SOFTMAX-FIRST-LOOP
    role: isFirstSInnerLoop branch and default state initialization.
  confidence: high

# -----------------------------------------------------------------------------
# 3.1b Softmax Tiling & BRC Config Selection
# -----------------------------------------------------------------------------
- id: OC-SOFTMAX-TILING-BRC
  canonical_name: vec1.softmax.tiling_and_brc_selection
  aliases:
  - softmax_tiling
  - softmax_brc_config
  title: SoftmaxFlashV2 tiling is computed per block with BRC/non-BRC config split
  applies_to:
    variants:
    - nonquant
    - gqa
    - mla
    owners:
    - FiaBlockVecNonQuant<FIAT>
    - FiaBlockVecNonQuantMla<FIAT>
    stages:
    - vec1.softmax
  pattern_summary: SoftmaxFlashV2Compute invokes SoftMaxFlashV2TilingFunc per base block using srcShape, compute type sizes, and tmp buffer capacity. The template selects between FIA_SOFTMAX_FLASHV2_CFG (with BRC) and FIA_SOFTMAX_FLASHV2_CFG_WITHOUT_BRC based on the compile-time SOFTMAX_WITH_BRC flag. The same tiling pattern appears in both GQA and MLA vector paths with slightly different tmp buffer size constants.
  optimization_intent: Expose tiling and BRC selection as DSL parameters so Stage-2 can validate buffer capacity and choose the correct vector instruction sequence.
  preconditions:
  - MM1 output UB dimensions (dealRowCount, columnCount, actualColumnCount) are known.
  - SOFTMAX_TMP_BUFFER_SIZE / SOFTMAX_TMP_BUFFER_OFFSET is sufficient for the selected tiling.
  - COMPUTE_T width matches the tiling function expectations.
  tunable_knobs:
  - s2BaseSize
  constraints:
  - C-VEC-UB-ALIGNMENT
  risks:
  - R-UB-ALIGNMENT-DRIFT
  possible_dsl_fields:
  - path: vec1.softmax.tiling_func
    meaning: Per-block tiling computation with buffer-capacity validation.
  - path: vec1.softmax.brc_config
    meaning: Compile-time flag selecting BRC or non-BRC SoftmaxFlashV2 template.
