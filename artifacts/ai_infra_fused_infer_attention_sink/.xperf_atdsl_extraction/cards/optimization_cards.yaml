# -----------------------------------------------------------------------------
# 9.1 Matmul unitFlag K-Loop Behavior
# -----------------------------------------------------------------------------
- id: OC-COMMON-MATMUL-UNITFLAG-K-LOOP
  canonical_name: common.matmul.unitflag_k_loop_behavior
  aliases:
  - matmul_unitflag
  - mmad_unitflag
  title: Matmul unitFlag controls outer-loop-last accumulation in K-split
  applies_to:
    variants:
    - nonquant
    - gqa
    - mla
    owners:
    - common matmul helpers
    stages:
    - cube.matmul
  pattern_summary: "Matmul unitFlag has three modes. DISABLE (0): no unitFlag in MmadParams. ENABLE (2): set on every k-loop iteration. EN_OUTER_LAST (3): ENABLE on all but the last k-loop, then EN_OUTER_LAST on the final iteration. This is a hardware micro-optimization that affects accumulation behavior in the outer-loop-last k-iteration."
  optimization_intent: Preserve correct accumulation semantics across K-split iterations while exposing the hardware unitFlag optimization to Stage-2 lowering.
  preconditions:
  - CFG::ENABLE_UNIFLAG is true at compile time.
  - K dimension is split into multiple iterations.
  - The matmul stage uses common buffer policy and MMAD interface.
  tunable_knobs:
  - nBufferMBaseSize
  constraints:
  - C-COMMON-MATMUL-UNITFLAG
  - C-COMMON-BUFFER-EVENT-LEGALITY
  risks:
  - R-COMMON-BUFFER-EVENT-SCHEDULING-ILLEGAL
  possible_dsl_fields:
  - path: matmul.unitflag.mode
    meaning: DISABLE/ENABLE/EN_OUTER_LAST selection for K-split accumulation.
  - path: matmul.unitflag.final_k_loop
    meaning: Final K-loop uses EN_OUTER_LAST (3) instead of ENABLE (2).
  lowering_hint: Lower unitFlag together with K-split loop structure; changing unitFlag without updating loop bound produces wrong accumulation.
  source_evidence:
  - id: SE-COMMON-MATMUL-UNITFLAG
    role: MMParam::unitFlag and MmadParams.unitFlag assignment.
  - id: SE-COMMON-MATMUL-K-LOOP
    role: K-loop iteration with isLastK conditional unitFlag.
  confidence: high

# -----------------------------------------------------------------------------
# 9.2 Vector Repeat-Stride Threshold & PIPE_V Barriers
# -----------------------------------------------------------------------------
- id: OC-COMMON-VECTOR-REPEAT-STRIDE-THRESHOLD
  canonical_name: common.vector.repeat_stride_threshold_and_pipe_v_barriers
  aliases:
  - vector_repeat_stride
  - repeat_stride_2048
  title: Vector ops use repeat-stride below 2048 elements and PIPE_V barriers
  applies_to:
    variants:
    - nonquant
    - gqa
    - mla
    owners:
    - common vector helpers
    stages:
    - vec1.softmax
    - vec2.output
  pattern_summary: REPEATE_STRIDE_UP_BOUND = 256 (datablock spacing). When columnCount < 256 * FP32_BLOCK_ELEMENT_NUM (=2048 elements), vector ops use repeat-based instructions with dstRepStride = columnCount / blockNum. Otherwise they fall back to per-row scalar loops. PIPE_V barriers are inserted after partial tail-adds and between tree-reduction halving steps to prevent data hazards.
  optimization_intent: Maximize vector instruction efficiency for narrow columns while keeping correctness fences for wide-column split reductions.
  preconditions:
  - Column count is known before vector lowering.
  - FP32_BLOCK_ELEMENT_NUM is a compile-time constant.
  - PIPE_V barrier placement matches the reduction tree structure.
  tunable_knobs:
  - headDimAlign
  constraints:
  - C-COMMON-VECTOR-REPEAT-AND-INVALID-ROWS
  risks:
  - R-COMMON-INVALID-ROW-HANDLING-LOST
  possible_dsl_fields:
  - path: vector.repeat_stride.threshold
    meaning: 2048-element boundary between repeat-based and scalar-loop lowering.
  - path: vector.repeat_stride.dst_rep_stride
    meaning: columnCount / blockNum for repeat-based vector ops.
  - path: vector.pipe_v.barrier_placement
    meaning: Barrier positions relative to reduction tree steps.
  lowering_hint: Lower the threshold check before loop generation; hardcoding the 2048 boundary or omitting PIPE_V barriers changes reduction correctness on wide columns.
  source_evidence:
  - id: SE-COMMON-VECTOR-REPEAT-STRIDE
    role: REPEATE_STRIDE_UP_BOUND and dstRepStride calculation.
  - id: SE-COMMON-VECTOR-PIPE-V-BARRIER
    role: PIPE_V barrier placement in RowSum, RowMax, and long-column split paths.
  confidence: high

