- id: OC-RUNINFO-THREE-STAGE-RING
  canonical_name: pipeline.runinfo_three_stage_ring
  aliases:
  - runinfo_ring
  - mm1_vec1_mm2_vec2_overlap
  title: RunInfo ring overlaps MM1, Vec1/MM2, and Vec2
  applies_to:
    variants:
    - nonquant
    - gqa
    - mla
    owners:
    - FiaKernelNonQuant<FIAT>
    - FiaKernelNonQuantMla<FIAT, CubeBlockType, VecBlockType, FdBlockType>
    stages:
    - gqa.mm1
    - gqa.vec1
    - gqa.mm2
    - gqa.vec2.output
    - mla.mm1
    - mla.vec1
    - mla.mm2
    - mla.vec2.output
  pattern_summary: ExecuteTask uses a three-entry RunInfo cache where the current slot drives MM1, the older slot drives Vec1 and MM2, and the previous slot drives Vec2 before being invalidated.
  optimization_intent: Overlap AIC/AIV stages across loops while keeping stage ordering and ring-slot ownership explicit.
  preconditions:
  - FIA_PRELOAD_TASK_CACHE_SIZE remains at least three slots.
  - preLoadNum and workspace ring depth are compatible with the scheduler overlap pattern.
  tunable_knobs:
  - preLoadNum
  - s2BaseSize
  constraints:
  - C-EVENT-ORDER-RUNINFO
  risks:
  - R-RUNINFO-STAGE-REORDER-DEADLOCK
  - R-SPLITKV-PARTIAL-COLLISION
  possible_dsl_fields:
  - path: pipeline.scheduler.runinfo_ring
    meaning: Mapping from loop-relative cache slot to stage responsibility.
  - path: pipeline.scheduler.invalid_after_vec2
    meaning: Slot invalidation happens after Vec2 finishes, not after MM2.
  lowering_hint: Emit the scheduler overlap as explicit slot roles instead of prose; stage graph builders need concrete loop-relative edges.
  source_evidence:
  - id: SE-RUNINFO-THREE-STAGE-RING-NONQUANT
    role: Nonquant/GQA ExecuteTask overlap pattern.
  - id: SE-RUNINFO-THREE-STAGE-RING-MLA
    role: MLA ExecuteTask overlap pattern.
  confidence: high
