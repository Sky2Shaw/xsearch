  pattern_summary: Matrix2x2BufferPolicy is a 4-buffer policy arranged as a 2x2 matrix (M0K0, M0K1, M1K0, M1K1). Address allocation is row-first, but usage is column-first. SetMExtent dynamically sets mSize to 1 or 2. Provides AllocNext, ReuseNext, FreeNext, PeekNextK cursors for simultaneous double-buffering in M and K dimensions.
  optimization_intent: Reduce L1 footprint by aliasing Q/P and K/V buffers across MM1 and MM2 while preserving 2D cursor correctness.
  preconditions:
  - Buffer space is sufficient for 2x2 matrix layout.
  - Cross-core sync mode is selected consistently for AIC/AIV roles.
