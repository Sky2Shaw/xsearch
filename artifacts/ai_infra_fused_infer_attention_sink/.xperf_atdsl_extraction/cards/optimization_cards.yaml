# -----------------------------------------------------------------------------
# 3.4 M-Partition Strategy (nBuffer to vecDealM)
# -----------------------------------------------------------------------------
- id: OC-VEC1-M-PARTITION-SPLIT
  canonical_name: vec1.m_partition_nbuffer_to_vecdeal
  aliases:
  - vec1_m_partition
  - nbuffer_vec_deal_split
  title: Vec1 partitions nBufferDealM into vecDealM with CV1:1 tail handling
  applies_to:
    variants:
    - nonquant
    - gqa
    - mla
    owners:
    - FiaBlockVecNonQuant<FIAT>
    - FiaBlockVecNonQuantMla<FIAT>
    stages:
    - vec1.partition
  pattern_summary: SetMSplitInfo splits nBufferDealM between two vector units. If nBufferDealM <= 16, vecDealM = nBufferDealM. Otherwise vecDealM = ceil(ceil(nBufferDealM/16)/2)*16. For subBlockNum==1 (CV1:1), vecDealM = nBufferDealM with an additional cap of 128 for MLA. Odd blockIdx takes the tail portion (vecDealM = nBufferDealM - vecDealM).
  optimization_intent: Balance vector work across units while keeping tile sizes aligned to hardware vector-width boundaries.
  preconditions:
  - nBufferMBaseSize has been computed by host tiling.
  - subBlockNum (vector unit count) is known at compile time or runtime.
  - blockIdx parity determines head/tail assignment.
  tunable_knobs:
  - nBufferMBaseSize
  constraints:
  - C-VEC-UB-ALIGNMENT
  risks:
  - R-UB-ALIGNMENT-DRIFT
  possible_dsl_fields:
  - path: vec1.partition.formula
    meaning: vecDealM = min(nBufferDealM, ceil(ceil(nBufferDealM/16)/2)*16).
  - path: vec1.partition.cv1_1_cap
    meaning: MLA caps vecDealM to 128 when subBlockNum==1.
  - path: vec1.partition.tail_assignment
    meaning: Odd blockIdx receives the tail remainder.
  lowering_hint: Lower the partition formula as a structured rule; hardcoding the 16-element boundary or omitting the CV1:1 cap produces misaligned vector tiles.
  source_evidence:
  - id: SE-VEC1-M-PARTITION-FORMULA
    role: SetMSplitInfo vecDealM computation and blockIdx parity logic.
  - id: SE-VEC1-NBUFFER-VEC-DEAL
    role: nBufferDealM to vecDealM split in GQA and MLA paths.
  confidence: high

