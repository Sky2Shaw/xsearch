    - vec1.sink
  pattern_summary: When keySinkNumber > 0 and IsSkipCal says a block is skipped, DealBmm1ResBaseBlock copies the previous loop's softmaxMaxUb/softmaxSumUb forward, sets softmaxExpUb to 1, and zero-fills vec1ResUb without invoking the full ElewiseCompute+Softmax pipeline. Vec1SinkSoftmaxProc handles sink-value invalid rows by injecting minValue into the softmax denominator. In Vec2, DealInvalidMaskRows uses negativeIntScalar to zero out invalid rows in the final attention output.
  optimization_intent: Preserve online-softmax state across sink-skipped blocks while keeping invalid-row zeroing semantics correct.
  preconditions:
  - keySinkNumber > 0 and sink tensor is resident in GM.
  - The previous loop's softmax state is valid and available in the preload-slot ring.
  - Invalid-row mask agrees with host maskParams.
  tunable_knobs:
  - s2BaseSize
  constraints:
  - C-INVALID-ROW-LSE-CORRECTION
  risks:
  - R-INVALID-ROW-SEMANTIC-DRIFT
  possible_dsl_fields:
  - path: vec1.sink_skip.state_forward
    meaning: Copy previous loop softmaxMaxUb/sumUb and set expUb to 1 on skip.
  - path: vec1.sink_skip.zero_fill
    meaning: Zero-fill vec1ResUb without invoking ElewiseCompute+Softmax.
  - path: vec1.invalid_row.sink_value
    meaning: minValue injection into softmax denominator for sink invalid rows.
  lowering_hint: Lower sink skip as a fast path that preserves preload-slot ring indexing; the state-forward and zero-fill must be atomic relative to the ring slot.
  source_evidence:
