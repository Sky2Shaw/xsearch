  - preLoadNum
  constraints:
  - C-COMMON-BUFFER-EVENT-LEGALITY
  risks:
  - R-COMMON-BUFFER-EVENT-SCHEDULING-ILLEGAL
  possible_dsl_fields:
  - path: pipeline.buffer_policy.matrix_2x2
    meaning: 4-buffer 2D ping-pong with row-first allocation and column-first usage.
  - path: pipeline.buffer_policy.m_extent
    meaning: Dynamic mSize (1 or 2) controlling matrix row count.
  lowering_hint: Lower Matrix2x2BufferPolicy as a distinct policy kind alongside single/DB/3-buffer/4-buffer; the 2D cursor semantics (amIdx/akIdx, umIdx/ukIdx) must be preserved.
  source_evidence:
  - id: SE-COMMON-BUFFER-MATRIX-2X2
