  pattern_summary: On the last S2 loop, ComputeSoftMaxLse computes log(sum)+max from softmaxSumUb and softmaxMaxUb. If invalid rows exist, AdjustSoftMaxRes replaces their LSE values with 3e+99 before export. In FlashDecode, the merged lseSumUb/lseMaxUb undergo the same computation after stable merge weights are applied. The final LSE is then exported via layout-aware helpers (TND/NTD/BSND/BNSD).
  optimization_intent: Preserve LSE numerical correctness across all paths (GQA/MLA/FD) while keeping invalid-row semantics consistent with host validation.
  preconditions:
  - Vec1 has completed all S-inner loops and final softmax state is in UB.
  - Invalid-row mask is available for the current tile.
  - Layout family matches host infer-shape output.
  tunable_knobs:
  - headDimAlign
  constraints:
  - C-INVALID-ROW-LSE-CORRECTION
  - C-SHAPE-LAYOUT-CONTRACT
  risks:
  - R-INVALID-ROW-SEMANTIC-DRIFT
  - R-SHAPE-LAYOUT-CONTRACT-DRIFT
  possible_dsl_fields:
  - path: lse.generate.compute_formula
    meaning: log(sum) + max computation from final softmax state.
  - path: lse.generate.invalid_row_adjust
    meaning: Replace invalid-row LSE with sentinel value before export.
  - path: lse.generate.fd_merge_path
    meaning: FlashDecode merged state feeds into the same LSE compute path.
  lowering_hint: Lower LSE generation as a unified pipeline across GQA/MLA/FD; the ComputeSoftMaxLse call site must see merged (not partial) state for FD.
  source_evidence:
  - id: SE-LSE-COMPUTE-SOFTMAX
    role: ComputeSoftMaxLse on final softmaxSumUb/maxUb.
  - id: SE-LSE-ADJUST-INVALID
    role: AdjustSoftMaxRes replacing invalid rows with 3e+99.
