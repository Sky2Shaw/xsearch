optimization_cards:
- id: OC-GQA-MM2-L1-V-REUSE
  canonical_name: gqa.mm2.v_l1_snapshot_reuse
  aliases:
  - gqa_v_l1_reuse
  - vL1Snapshot_reuse
  title: GQA MM2 reuses V L1 tiles across M slices
  applies_to:
    variants:
    - gqa
    owners:
    - FiaBlockCubeNonQuantGqa<FIAT,Config>
    stages:
    - gqa.mm2
  pattern_summary: ComputeMm2 caches V tiles in vL1Snapshot while streaming P from the shared Vec1 workspace ring, and only releases V_EVENT when full-load reuse is impossible or the M-slice tail is reached.
  optimization_intent: Reduce V reload traffic without violating the V_EVENT lifetime contract.
  preconditions:
  - GQA cube MM2 is consuming Vec1-generated P tiles.
  - V reuse is keyed by batch/head/S2 coordinate and canFullLoadV remains true for the current KL1 slice set.
  tunable_knobs:
  - s2BaseSize
  - preLoadNum
  constraints:
  - C-GQA-MM2-SYNC
  risks:
  - R-GQA-V-L1-LIFETIME
  possible_dsl_fields:
  - path: memory.l1.gqa.v_snapshot_signature
    meaning: Coordinate key and reuse scope for V L1 caching across M slices.
  - path: pipeline.stage_graph.edges[].sync_signal
    meaning: syncV1C2 and syncC2V2 ordering around the GQA MM2 producer/consumer boundary.
  lowering_hint: Lower as an owner-qualified GQA MM2 policy; do not fold it into the generic MM2 stage or drop the reuse/release guard.
  source_evidence:
  - id: SE-GQA-V-L1-RELEASE
    role: V snapshot reuse and release condition inside GQA ComputeMm2.
  confidence: high
- id: OC-MLA-MM2-NUPDATE-BARRIER
  canonical_name: mla.mm2.first_fixpipe_wait_nupdate
  aliases:
  - mla_mm2_nupdate_barrier
  - syncV1NupdateC2_guard
  title: MLA MM2 waits for nUpdate before first fixpipe
  applies_to:
    variants:
    - mla
    owners:
    - FiaBlockCubeNonQuantMla<FIAT>
    stages:
    - mla.mm2
    - mla.mm2.process
  pattern_summary: MLA MM2 delays the first fixpipe until syncV1NupdateC2 is observed, so the Vec1-side atomic correction into mm2ResInt32Gm is visible before MM2 output is committed.
  optimization_intent: Preserve correctness of MLA online-softmax correction while keeping MM2 and Vec1 overlapped.
  preconditions:
  - MLA path is active and the current tile reaches the first complete K-slice for the first nL1 and mL1 block.
  - ProcessAmlaNupdate has a non-empty M partition and the current S-inner loop is not the first one.
  tunable_knobs:
  - nBufferMBaseSize
  - preLoadNum
  constraints:
  - C-MLA-MM2-NUPDATE
  - C-MLA-NUPDATE-FIRST-LOOP
  risks:
  - R-MLA-NUPDATE-NUMERIC
  - R-MLA-MM2-ATOMIC
  possible_dsl_fields:
  - path: mla.nupdate.mm2_sync
    meaning: Explicit wait edge from Vec1-side nUpdate apply to the first MM2 fixpipe.
  - path: mla.nupdate.atomic_target
    meaning: MM2 int32 alias location that receives the broadcast correction.
  lowering_hint: Keep the wait, atomic add, and first-fixpipe condition in one lowering rule; splitting them loses the correctness fence.
  source_evidence:
  - id: SE-MLA-NUPDATE-BARRIER
    role: MM2 wait condition before the first fixpipe.
  - id: SE-MLA-NUPDATE-ATOMIC-TARGET
    role: Vec1-side atomic add target and row-group broadcast behavior.
  confidence: high
- id: OC-MLA-NUPDATE-SIDECHANNEL
  canonical_name: mla.vec1.nupdate_side_channel
  aliases:
  - mla_nupdate
  - mla_softmax_row_correction
  title: MLA vector stage emits row-wise nUpdate side channel
  applies_to:
    variants:
    - mla
    owners:
    - FiaBlockVecNonQuantMla<FIAT>
    stages:
    - mla.vec1
    - mla.nupdate.compute
    - mla.nupdate.apply
  pattern_summary: AmlaVecCompute derives row-wise nUpdate and aMlaSum from online softmax state, then ProcessAmlaNupdate broadcasts 128-lane int32 corrections and atomically injects them into the MM2 int32 alias.
  optimization_intent: Preserve MLA-specific numeric correction without materializing a separate GM reduction pass.
  preconditions:
  - MLA Vec1 path is active.
  - ProcessAmlaNupdate runs only after the first S-inner loop and only when vecDealM is non-zero.
  - headDim is consumed in 128-lane groups for the int32 broadcast/add path.
  tunable_knobs:
  - nBufferMBaseSize
  - preLoadNum
  constraints:
  - C-MLA-NUPDATE-FIRST-LOOP
  - C-MLA-MM2-NUPDATE
  risks:
  - R-MLA-NUPDATE-NUMERIC
  possible_dsl_fields:
  - path: mla.nupdate.compute_formula
    meaning: Ordered n/cof/eps/clamp/scale sequence used to derive the correction term.
  - path: mla.nupdate.broadcast_group
    meaning: 128-lane int32 broadcast granularity for the atomic apply path.
  - path: mla.nupdate.atomic_target
    meaning: The correction is applied through mm2ResInt32Gm, not through a dedicated MLA-only GM tail buffer.
  lowering_hint: Treat compute and apply as one side-channel contract; lowering only AmlaVecCompute or only ProcessAmlaNupdate is incomplete.
  source_evidence:
  - id: SE-MLA-NUPDATE-ATOMIC-TARGET
    role: Atomic-add path and 128-lane broadcast contract.
  - id: SE-MLA-SOFTMAX-SUM-GEN
    role: Last-loop generation of the aMlaSum normalization state.
  - id: SE-MLA-AMLASUM-UB-ONLY
    role: aMlaSum is retained in local UB state rather than a dedicated GM tail binding.
  confidence: high
- id: OC-FD-STABLE-MERGE
  canonical_name: flash_decode.merge.stable_lse_weighted_reduce
  aliases:
  - fd_stable_merge
  - split_kv_lse_reduce
  title: FlashDecode stable merge combines split-KV partials
  applies_to:
    variants:
    - flash_decode
    owners:
    - FiaBlockVecFlashDecode<FIAT>
    stages:
    - flash_decode.merge
  pattern_summary: FlashDecode computes merge weights by taking column max over lseMax, exponentiating shifted values, multiplying by lseSum, accumulating partial outputs, and normalizing before final copy-out.
  optimization_intent: Keep split-KV final output numerically stable while preserving the partial-output workspace contract.
  preconditions:
  - FLASH_DECODE path is active and split-KV partial outputs plus LSE scratch have been materialized.
  - Metadata arrays describing per-core FD ranges are available through fdParams.
  tunable_knobs:
  - splitKVFlag
  - headDimAlign
  - mBaseSize
  constraints:
  - C-FD-METADATA
  - C-FD-USED-VEC-BOUNDS
  risks:
  - R-FD-LSE-MERGE
  - R-SPLITKV-PARTIAL-COLLISION
  possible_dsl_fields:
  - path: flash_decode.merge.weight_formula
    meaning: Ordered max/sub/exp/mul/sum/div merge sequence.
  - path: flash_decode.fdparams.metadata_arrays
    meaning: Per-core metadata arrays that map split-KV partials into FD tasks.
  - path: flash_decode.merge.output_layouts
    meaning: Final output copy-out choices for BSH/BNSD/NBSD/TND/NTD layouts.
  lowering_hint: Lower the merge formula and metadata arrays as one rule set; the weight formula alone is insufficient without the metadata partition contract.
  source_evidence:
  - id: SE-FD-MERGE-WEIGHT-FORMULA
    role: Stable merge formula over lseMax/lseSum and accumOut.
  - id: SE-FD-METADATA-PARTITION
    role: Construction of fdParams from metadata arrays.
  confidence: high
- id: OC-WORKSPACE-NORMAL-RING
  canonical_name: workspace.normal_ring
  aliases:
  - normal_workspace_ring
  - mm1_vec1_mm2_vec2_contiguous_abi
  title: Normal workspace is a four-region contiguous ring
  applies_to:
    variants:
    - nonquant
    - gqa
    - mla
    owners:
    - FiaKernelNonQuant<FIAT>
    - FiaKernelNonQuantMla<FIAT, CubeBlockType, VecBlockType, FdBlockType>
    stages:
    - generic.mm1
    - gqa.mm1
    - gqa.vec1
    - gqa.mm2
    - gqa.vec2.output
    - mla.mm1
    - mla.vec1
    - mla.mm2
    - mla.vec2.output
  pattern_summary: Host formulas and kernel InitWorkspace agree on a contiguous ring ordered as mm1 -> vec1 -> mm2 -> vec2, with per-core per-preload-slot strides derived from mmResUbSize and bmm2ResUbSize.
  optimization_intent: Make workspace offsets stable so stage-local GM rings can overlap across preload slots without aliasing.
  preconditions:
  - Workspace has been initialized for the current kernel variant.
  - preLoadNum and element-width choices remain consistent between host tiling and kernel bindings.
  tunable_knobs:
  - preLoadNum
  - headDimAlign
  constraints:
  - C-WORKSPACE-CONTIGUOUS-ABI
  risks:
  - R-WORKSPACE-ABI-DRIFT
  possible_dsl_fields:
  - path: workspace.normal.regions[].base_offset_rule
    meaning: Contiguous region order for mm1, vec1, mm2, and vec2.
  - path: workspace.normal.regions[].slot_stride
    meaning: Per-preload-slot stride for each ring region.
  lowering_hint: Lower the normal workspace as one ordered ABI block; emitting independent anonymous buffers loses cross-stage offset validation.
  source_evidence:
  - id: SE-WORKSPACE-NORMAL-SIZE
    role: Host-side size formula for the four-region ring.
  - id: SE-WORKSPACE-NORMAL-ABI
    role: Kernel-side contiguous SetGlobalBuffer order.
  confidence: high
- id: OC-WORKSPACE-MLA-NUPDATE-BUDGET-STUB
  canonical_name: workspace.mla_nupdate_budget_stub
  aliases:
  - mla_nupdate_tail
  - mla_nupdate_budget_only_stub
  title: MLA nUpdate budget is represented through the normal.mm2 int32 alias
  applies_to:
    variants:
    - mla
    owners:
    - FiaTilingNonQuantMla
    - FiaKernelNonQuantMla<FIAT, CubeBlockType, VecBlockType, FdBlockType>
    stages:
    - mla.nupdate.compute
    - mla.nupdate.apply
    - mla.mm2.process
  pattern_summary: Host sizing reserves an MLA nUpdate-sized tail budget, but kernel binding scans expose no dedicated GM tail tensor; runtime correction writes through mm2ResInt32Gm, an int32 reinterpretation of the normal.mm2 workspace region.
  optimization_intent: Preserve the nUpdate budget as an ABI-visible stub while lowering the actual correction path through the observed normal.mm2 alias.
  preconditions:
  - MLA host sizing path is active.
  - Validation tooling distinguishes host-budget stubs from explicit kernel SetGlobalBuffer regions and alias-based runtime consumers.
  tunable_knobs:
  - mBaseSize
  - preLoadNum
  constraints:
  - C-WORKSPACE-MLA-FD
  - C-WORKSPACE-MLA-NUPDATE-STUB
  risks:
  - R-MLA-TAIL-BUDGET-MISMODELED
  - R-MLA-NUPDATE-TAIL-MISLOWERED
  - R-WORKSPACE-ABI-DRIFT
  possible_dsl_fields:
  - path: workspace.mla.tail_regions[region_id=mla.nupdate].binding_status
    meaning: The nUpdate tail is host-budget-only and must not be emitted as a standalone GM region.
  - path: workspace.normal.regions[region_id=normal.mm2].aliases[].name
    meaning: mm2ResInt32Gm is the runtime target for MLA nUpdate atomic correction.
  lowering_hint: Lower nUpdate as a budget stub plus normal.mm2 int32 alias rule; do not materialize a new GM tail without direct SetGlobalBuffer evidence.
  source_evidence:
  - id: SE-WORKSPACE-MLA-ABI
    role: Host formula adds the nUpdate budget bytes.
  - id: SE-WORKSPACE-MLA-INIT-ORDER
    role: Kernel InitWorkspace does not bind an extra nUpdate GM tensor before FD scratch.
  - id: SE-MLA-MM2-INT32-ALIAS
    role: nUpdate correction aliases normal.mm2 through mm2ResInt32Gm.
  confidence: medium
- id: OC-WORKSPACE-MLA-SOFTMAX-SUM-BUDGET-STUB
  canonical_name: workspace.mla_softmax_sum_budget_stub
  aliases:
  - mla_softmax_sum_tail
  - mla_amlasum_budget_only_stub
  title: MLA softmaxSum budget is bridged through local UB state
  applies_to:
    variants:
    - mla
    owners:
    - FiaTilingNonQuantMla
    - FiaBlockVecNonQuantMla<FIAT>
    stages:
    - mla.vec1
    - mla.vec2.output
  pattern_summary: Host sizing reserves an MLA softmaxSum tail budget, but kernel scans expose no dedicated GM binding; AmlaVecCompute materializes aMlaSumUb on the last S2 loop and DealBmm2ResBaseBlock consumes it through local UB broadcast.
  optimization_intent: Preserve the softmaxSum budget as an ABI-visible stub while modeling the observed Vec1-to-Vec2 normalization bridge through local UB state.
  preconditions:
  - MLA host sizing path is active.
  - Vec1 reaches the last S2 loop where aMlaSumUb is generated before Vec2 normalization consumes it.
  tunable_knobs:
  - mBaseSize
  - preLoadNum
  constraints:
  - C-WORKSPACE-MLA-FD
  - C-WORKSPACE-MLA-SOFTMAX-SUM-UB
  risks:
  - R-MLA-TAIL-BUDGET-MISMODELED
  - R-MLA-SOFTMAX-SUM-GM-INVENTED
  - R-WORKSPACE-ABI-DRIFT
  possible_dsl_fields:
  - path: workspace.mla.tail_regions[region_id=mla.softmax_sum].binding_status
    meaning: The softmaxSum tail is host-budget-only and must not be emitted as a standalone GM region.
  - path: workspace.mla.tail_regions[region_id=mla.softmax_sum].local_buffer_bridge
    meaning: AmlaVecCompute produces aMlaSumUb and DealBmm2ResBaseBlock consumes it from local UB state.
  lowering_hint: Lower softmaxSum as a budget stub plus local UB bridge; do not invent a GM producer/consumer path for aMlaSum without direct binding evidence.
  source_evidence:
  - id: SE-WORKSPACE-MLA-ABI
    role: Host formula adds the softmaxSum budget bytes.
  - id: SE-WORKSPACE-MLA-INIT-ORDER
    role: Kernel InitWorkspace does not bind an extra softmaxSum GM tensor before FD scratch.
  - id: SE-MLA-AMLASUM-UB-ONLY
    role: aMlaSum state is retained in local UB storage, not a dedicated GM tail.
  - id: SE-MLA-SOFTMAX-SUM-GEN
    role: Vec1 generates aMlaSumUb on the last S2 loop.
  - id: SE-MLA-SOFTMAX-SUM-CONSUME
    role: Vec2 consumes aMlaSumUb during final normalization.
  confidence: medium
- id: OC-WORKSPACE-FD-REGIONS
