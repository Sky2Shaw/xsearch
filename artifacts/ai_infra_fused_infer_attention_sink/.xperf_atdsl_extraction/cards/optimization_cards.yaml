  - path: workspace.flash_decode.lse_sum_max
    meaning: Half-and-half LSE sum/max super-region and offset split rule.
  lowering_hint: Keep accumOut and lseSum/lseMax in the same lowering contract because the merge kernel assumes fixed contiguous offsets between them.
  source_evidence:
