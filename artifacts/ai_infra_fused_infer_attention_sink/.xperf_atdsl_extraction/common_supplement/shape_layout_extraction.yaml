dsl_implications:
  - "A DSL shape model should represent layout as an ordered axis list and enforce rank equality before axis-level checks."
  - "H should be modeled as a derived dimension equal to N * D for expected-shape validation."
  - "NZ requires the packed shape {Bn, N, D / D0, Bs, D0}; D0 defaults to 16 in the compare parameter, and D can also be recovered from D1 * D0."
  - "Shape validation needs per-axis compare modes, defaulting to EQUAL when no override is supplied."
  - "IGNORE_INPUT is a valid compare function that always passes, even though its serial string path falls through to UNKNOWN."

