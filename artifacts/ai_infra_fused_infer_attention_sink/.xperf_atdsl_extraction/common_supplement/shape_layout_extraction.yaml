shape_compare_modes:
  enum_values:
    EQUAL: 0
    GREATER: 1
    GREATER_EQUAL: 2
    LESS: 3
    LESS_EQUAL: 4
    NOT_EQUAL: 5
    IGNORE_INPUT: 6
  functions:
    EQUAL: "a == b"
    GREATER: "a > b"
    GREATER_EQUAL: "a >= b"
    LESS: "a < b"
    LESS_EQUAL: "a <= b"
    NOT_EQUAL: "a != b"
    IGNORE_INPUT: "always true"
  default_compare_type: "EQUAL when an axis is absent from compareTypeMap"
  serialization:
    names: ["EQUAL", "GREATER", "GREATER_EQUAL", "LESS", "LESS_EQUAL", "NOT_EQUAL"]
    symbols: ["==", ">", ">=", "<", "<=", "!="]
    note: "IGNORE_INPUT participates in compareFuncMap but is not named in CompareTypeToSerialString; default branch returns UNKNOWN."
  evidence:
    - "inference/ascendc/src/ops-transformer/attention/common/op_host/fia_tiling_shape.h:23"
    - "inference/ascendc/src/ops-transformer/attention/common/op_host/fia_tiling_shape.h:30"
