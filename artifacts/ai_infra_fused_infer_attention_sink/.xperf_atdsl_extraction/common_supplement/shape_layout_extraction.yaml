validator_paths:
  axis_presence:
    - "CheckHasAxis first rejects zero-dimensional shapes."
    - "It resolves layout axes from FIA_LAYOUT_AXIS_MAP and requires shape dim count to equal layout axis count."
    - "For D requests it accepts direct D, derived D from H/N, or D1/D0; otherwise it requires the axis to exist in the layout."
  expected_shape_compare:
    - "CompareShape sets H, builds expected shape for the layout, resolves layout axes, and requires actual shape, expected shape, and layout axes to have the same rank."
    - "For each dimension, it chooses the axis-specific compare type, resolves the compare function, and fails if the actual dimension does not satisfy the expected dimension."
  expected_shape_families:
    standard_layouts:
      BSH: "{B, S, H}"
      BSND: "{B, S, N, D}"
      BNSD: "{B, N, S, D}"
      BnBsH: "{Bn, Bs, H}"
      BnNBsD: "{Bn, N, Bs, D}"
      BnBsND: "{Bn, Bs, N, D}"
      NZ: "{Bn, N, D / D0, Bs, D0}"
      TND: "{T, N, D}"
      NBSD: "{N, B, S, D}"
      NTD: "{N, T, D}"
    special_layouts:
      BNS1S2: "{B, N, S1, S2}"
      INS1S2: "{CONST, N, S1, S2}"
      BNS11: "{B, N, S1, CONST}"
      TN1: "{T, N, CONST}"
      BS2: "{B, S2}"
      S1S2: "{S1, S2}"
      BS1S2: "{B, S1, S2}"
      B1S1S2: "{B, CONST, S1, S2}"
      IS1S2: "{CONST, S1, S2}"
      I1S1S2: "{CONST, CONST, S1, S2}"
  evidence:
