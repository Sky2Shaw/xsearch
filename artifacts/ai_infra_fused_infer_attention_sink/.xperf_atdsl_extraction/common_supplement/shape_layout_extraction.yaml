derived_dimensions:
  h_relation:
    formula: "H = N * D"
    use_site: "CompareShape sets param.H before deriving expected shapes."
    evidence:
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/fia_tiling_shape.cpp:321"
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/fia_tiling_shape.cpp:323"
  d_derivation:
    - "If layout has D, GetD returns the D axis dimension."
    - "If layout has H and caller supplied N, GetD can derive H / N when N is nonzero and H is divisible by N."
    - "If layout has D1 and D0, GetD returns D1 * D0."
    - "CheckHasAxis(D) fails when H cannot derive D because N is missing, N is zero, or H is not a multiple of N."
  evidence:
    - "inference/ascendc/src/ops-transformer/attention/common/op_host/fia_tiling_shape.h:100"
