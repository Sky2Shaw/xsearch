  role: Host-side KV tensor-list metadata rewrite that retags packed int32 views as int4 before the main operator path consumes them.
  confidence: high
  source_evidence_ids:
    - SE-HOST-TENSOR-PREPROCESS
  code_behavior:
    summary: Returns early unless both tensor lists are present and their first entries still report DT_INT32, then rewrites each non-null key and value tensor in place by scaling the last view-shape dimension by 8 and changing the dtype to DT_INT4.
    key_steps:
      - Exits immediately when either tensor list pointer is null.
      - Uses element 0 of both lists as the gate for whether the int32-to-int4 metadata rewrite still needs to run.
      - Iterates every key-list element, skips null entries, multiplies the last view-shape dimension by INT4_NUMS_IN_INT32 when the view rank is at least 1, then calls SetViewShape and SetDataType(DT_INT4).
      - Repeats the same in-place metadata rewrite for every non-null value-list element.
  dataflow:
    inputs:
      - tensorListKey and tensorListValue as caller-owned aclTensorList handles
      - per-tensor view shape metadata and current dtype from each non-null element
    outputs:
      - in-place rewritten key and value tensor metadata with DT_INT4 dtype and expanded last-dimension view shape
    gm:
      reads: []
      writes: []
    ub:
      reads: []
      writes: []
    l1:
      reads: []
      writes: []
    l0:
      l0a: []
      l0b: []
      l0c: []
  control_flow:
    loops:
      - for each element in tensorListKey
      - for each element in tensorListValue
    branches:
      - null key-list early return
      - null value-list early return
      - first-key dtype gate
      - first-value dtype gate
      - per-element null skip
      - view-rank-at-least-1 guard before scaling the last dimension
  pipeline:
    stages:
      - host_api_boundary
      - input_metadata_preprocess
      - calls GetDataType, GetViewShape, SetViewShape, and SetDataType
    sync: []
  memory_behavior:
    buffers:
      - aclTensorList element descriptors
      - temporary op::Shape copies for each rewritten tensor view
    l1_residency: []
    l1_partition: []
  tiling_and_shape:
    fields:
      - INT4_NUMS_IN_INT32
    shape_assumptions:
      - The metadata rewrite only scales the last view dimension and leaves all other dimensions unchanged.
      - Elements with zero view rank keep their existing shape because the last-dimension multiply is guarded by GetDimNum() >= 1.
  workspace:
    layout: []
    offsets: []
  optimization_intent:
    - Normalize packed KV metadata once at the host/API boundary so downstream operator code can consume DT_INT4 views directly.
    - Avoid allocating replacement tensors by mutating only view-shape and dtype metadata in place.
  tunable_or_structural_fields:
    - name: INT4_NUMS_IN_INT32
      role: Fixed packing expansion factor used to convert the last view dimension from int32 packing units to logical int4 element count.
      source_evidence_ids:
        - SE-HOST-TENSOR-PREPROCESS
  constraints:
    - Keep the rewrite gated on both list pointers being non-null and both first elements still reporting DT_INT32.
    - Preserve list order and skip per-element mutation when an entry is null.
    - Keep the dtype retagging and last-dimension scaling coupled so the resulting view metadata stays internally consistent.
    - Non-null lists must have a valid element 0 because the gate dereferences the first key and value entries before iterating the lists.
  risks_if_changed:
    - Reapplying the shape multiply after a list is already converted would inflate the logical sequence dimension a second time.
    - Converting only one of the key/value lists would desynchronize paired KV metadata expected by downstream host setup.
    - Removing the per-element null guard would turn sparse/null list slots into host-side null dereferences.
  possible_dsl_sections:
    - operator.helpers
    - operator.input_tensor_views
  suggested_dsl_fields:
    - path: operator.helpers.tensor_preprocess.kv_int4_view_rewrite
      meaning: The host helper conditionally retags packed KV tensor-list entries from DT_INT32 to DT_INT4 and expands the last view dimension by a fixed factor of 8.
      source_evidence_ids:
        - SE-HOST-TENSOR-PREPROCESS
      confidence: high
    - path: operator.input_tensor_views.kv_rewrite_gate
      meaning: The rewrite only runs while the first key and value entries still expose DT_INT32 metadata.
      source_evidence_ids:
        - SE-HOST-TENSOR-PREPROCESS
      confidence: high
  lowering_hints:
    - Lower this as a host-side metadata adapter, not as a device-stage transform.
    - Keep the list-wide gate and the per-element rewrite together because the helper is defining an API-boundary contract for packed KV inputs.
  open_questions: []
