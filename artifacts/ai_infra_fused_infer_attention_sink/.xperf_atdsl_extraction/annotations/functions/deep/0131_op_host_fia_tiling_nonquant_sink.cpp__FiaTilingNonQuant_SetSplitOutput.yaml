      confidence: high
    - path: flash_decode.metadata_bridge.fd_params
      meaning: The host bridge copies fdRes arrays and scalar split metadata into tilingData.fdParams for kernel FlashDecode consumers.
      source_evidence_ids:
        - SE-SPLIT-CORE-OUTPUT-BRIDGE
      confidence: high
  lowering_hints:
    - Lower this as a host-side metadata bridge from external planning output into kernel-visible fdParams arrays.
    - Keep the scalar metadata writes in the same contract as the array copies because downstream kernels observe both together.
