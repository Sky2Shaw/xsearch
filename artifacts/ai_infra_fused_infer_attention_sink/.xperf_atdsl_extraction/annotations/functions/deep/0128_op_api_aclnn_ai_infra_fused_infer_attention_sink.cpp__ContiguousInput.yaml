  optimization_intent:
    - Normalize direct tensor inputs to contiguous storage before calling the fused L0 operator.
    - Centralize host-side null checks and failure handling for optional side inputs at one API-boundary helper.
  tunable_or_structural_fields: []
  constraints:
    - Preserve query as an unconditional contiguous conversion step.
    - Keep optional tensors behind null guards so absent inputs remain absent rather than materialized placeholders.
    - Keep this helper distinct from ProcessTensorContiguous because it intentionally uses l0op::Contiguous instead of CreateView-based stride preservation.
  risks_if_changed:
    - Replacing l0op::Contiguous with a stride-preserving view path would change the ABI seen by the downstream L0 operator for direct tensor inputs.
    - Removing a CHECK_RET would allow a failed materialization to propagate a null tensor into later host setup.
    - Treating query as optional would weaken the current contract that execution cannot proceed without a materialized query tensor.
