  role: Host-side direct-tensor contiguity normalizer that materializes required query and optional side inputs through l0op::Contiguous before L0 dispatch.
  confidence: high
  source_evidence_ids:
    - SE-HOST-CONTIGUOUS-INPUT
  code_behavior:
    summary: Always contiguousizes query, then conditionally contiguousizes attenMaskOptional, blockTableOptional, queryRopeOptional, keySinkOptional, keyRopeSinkOptional, and valueSinkOptional when their pointers are non-null, failing immediately if any l0op::Contiguous call returns null.
    key_steps:
      - Rebinds query to l0op::Contiguous(query, executor) with no null guard on the input query pointer.
      - Uses CHECK_RET after the query conversion, so a failed materialization aborts the helper with ACLNN_ERR_INNER_NULLPTR.
      - Visits each optional tensor independently and only calls l0op::Contiguous when the current pointer is non-null.
      - Rebinds each optional reference parameter in place to the contiguous tensor returned by l0op::Contiguous.
      - Returns ACLNN_SUCCESS only after all required conversions succeed.
  dataflow:
    inputs:
      - query as the mandatory attention input tensor
      - optional side tensors attenMaskOptional, blockTableOptional, queryRopeOptional, keySinkOptional, keyRopeSinkOptional, and valueSinkOptional
      - executor as the allocator/runtime used by l0op::Contiguous
    outputs:
      - in-place updated host references that now point at contiguous tensor handles for every processed input
