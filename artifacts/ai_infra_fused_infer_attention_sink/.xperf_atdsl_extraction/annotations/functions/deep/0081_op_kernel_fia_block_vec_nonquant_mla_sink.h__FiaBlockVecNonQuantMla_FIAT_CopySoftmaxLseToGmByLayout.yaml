function_annotation:
  function_name: CopySoftmaxLseToGmByLayout
  qualified_name: FiaBlockVecNonQuantMla<FIAT>::CopySoftmaxLseToGmByLayout
  canonical_name: FiaBlockVecNonQuantMla<FIAT>::CopySoftmaxLseToGmByLayout
  owner: FiaBlockVecNonQuantMla
  owner_qualified: FiaBlockVecNonQuantMla<FIAT>
  owner_template_args:
    - FIAT
  template_params:
    - template<typename FIAT>
  variant: mla
  stage: softmax.lse_export
  file: op_kernel/fia_block_vec_nonquant_mla_sink.h
  line_range:
    start: 747
    end: 771
  role: MLA Vec1 helper that exports final softmaxLse rows to GM with layout-specific offset formulas.
  confidence: high
  source_evidence_ids:
    - SE-MLA-LSE-LAYOUT-COPY
    - SE-SHAPE-LAYOUT-CONTRACT
  code_behavior:
    summary: Routes the same LSE source tensor to TND or BSH/BSND/BNSD GM layouts by choosing the appropriate base offset and copy helper.
    key_steps:
      - Returns immediately when vecDealM is zero for the current MLA M partition.
      - For TND, computes prefixBS1 from actualSeqLengthsGmQ and forms bN2Offset from qHeadNum and gSize.
      - For BSH and BSND, uses the BSND copier with a batch-head-sequence base offset.
      - For the remaining branch, uses the BNSD copier with qActSeqLensParser and the same batch-head-sequence base offset.
  dataflow:
    inputs:
      - lseSrc UB tensor from the MLA Vec1 final-softmax path
      - actualSeqLengthsGmQ or qActSeqLensParser for layout-aware offsets
      - info.bIdx, info.n2Idx, and mOffset
    outputs:
      - softmaxLseGm rows in the target output layout
    gm:
      reads:
        - actualSeqLengthsGmQ for TND prefix offsets
      writes:
        - softmaxLseGm through DataCopySoftmaxLseTND, DataCopySoftmaxLseBSND, or DataCopySoftmaxLseBNSD
    ub:
      reads:
        - lseSrc
      writes: []
    l1:
      reads: []
      writes: []
    l0:
      l0a: []
      l0b: []
      l0c: []
  control_flow:
    loops: []
    branches:
      - if vecDealM == 0
      - if LAYOUT_T == TND
      - else if LAYOUT_T == BSND or BSH
      - else
  pipeline:
    stages:
      - mla.vec1
      - softmax.lse_export
    sync: []
  memory_behavior:
    buffers:
      - lseSrc
      - softmaxLseGm
    l1_residency: []
    l1_partition: []
  tiling_and_shape:
    fields:
      - qHeadNum
      - gSize
      - qSeqSize
      - vecDealM
    shape_assumptions:
      - TND layout exports LSE by prefix-flattened token rows, while BSH, BSND, and BNSD export by batch-head-sequence coordinates.
      - The GM destination rank for LSE is T,N,1 for TND-family outputs and B,N,S1,1 for the dense layout family.
  workspace:
    layout:
      - softmaxLseGm is a final-output tensor, not a temporary workspace ring
    offsets:
      - TND bN2Offset = prefixBS1 * qHeadNum + n2Idx * gSize
      - BSH/BSND/BNSD bN2Offset = bIdx * qHeadNum * qSeqSize + n2Idx * gSize * qSeqSize
      - mOffset = info.gS1Idx + nBufferStartM + vecStartM in the calling Vec1 wrapper
  optimization_intent:
    - Normalize the softmaxLse export path as a reusable layout contract instead of scattering it across Vec1 wrapper prose.
  tunable_or_structural_fields:
    - name: outputLayout
      role: Layout family selector for final softmaxLse export.
      source_evidence_ids:
        - SE-MLA-LSE-LAYOUT-COPY
        - SE-SHAPE-LAYOUT-CONTRACT
  constraints:
    - TND exports must preserve prefixBS1-based offsets from actualSeqLengthsGmQ.
    - BSH and BSND intentionally share the BSND copy helper and must not be split into inconsistent offset rules.
    - vecDealM == 0 must remain a no-op branch.
  risks_if_changed:
    - Wrong layout branch selection will write softmaxLse rows to the wrong batch/head/sequence coordinates.
    - Dropping the TND prefixBS1 rule corrupts varlen exports for flattened-token layouts.
  possible_dsl_sections:
    - shape_layout.contract
    - softmax.online_state
    - pipeline.vector_stages
  suggested_dsl_fields:
    - path: shape_layout.softmax_lse_layouts.tnd_family
      meaning: TND-family softmaxLse export uses prefixBS1-derived offsets and a T,N,1 destination shape.
      source_evidence_ids:
        - SE-MLA-LSE-LAYOUT-COPY
        - SE-SHAPE-LAYOUT-CONTRACT
      confidence: high
    - path: shape_layout.softmax_lse_layouts.dense_family
      meaning: BSH, BSND, and BNSD softmaxLse exports use batch-head-sequence offsets and a B,N,S1,1 destination shape.
      source_evidence_ids:
        - SE-MLA-LSE-LAYOUT-COPY
        - SE-SHAPE-LAYOUT-CONTRACT
      confidence: high
    - path: shape_layout.varlen.q_prefix_offset_rule
      meaning: actualSeqLengthsGmQ provides the prefixBS1 term used to flatten TND-family LSE outputs.
      source_evidence_ids:
        - SE-MLA-LSE-LAYOUT-COPY
      confidence: high
  lowering_hints:
    - Lower this helper as the canonical MLA softmaxLse layout adapter instead of embedding layout branches ad hoc inside the Vec1 wrapper.
  open_questions: []
