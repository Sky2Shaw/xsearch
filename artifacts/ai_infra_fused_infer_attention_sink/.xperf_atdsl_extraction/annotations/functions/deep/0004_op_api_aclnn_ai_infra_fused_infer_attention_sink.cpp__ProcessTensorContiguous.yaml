  optimization_intent:
    - Preserve non-contiguous access metadata when the underlying operator can consume the original storage layout through a view.
    - Only materialize a contiguous tensor through the standard l0op helper when the input is already considered contiguous by the host API.
  tunable_or_structural_fields: []
  constraints:
    - Preserve null passthrough.
    - Keep the non-contiguous path tied to CreateView so storage shape, strides, and view offset remain intact.
    - Keep contiguity selection driven solely by IsContiguous(tensor).
  risks_if_changed:
    - Replacing the CreateView path with a plain contiguous conversion would discard stride and offset metadata that the helper is explicitly preserving.
    - Changing the contiguous-path dispatch would alter which tensor handle downstream setup receives for already contiguous inputs.
    - Removing the null fast path would push null pointers into CreateView or l0op::Contiguous.
