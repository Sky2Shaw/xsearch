  role: Host-side tensor contiguity adapter that either preserves non-contiguous view metadata through CreateView or materializes a contiguous tensor through l0op::Contiguous.
  confidence: high
  source_evidence_ids:
    - SE-HOST-PROCESS-TENSOR-CONTIGUOUS
  code_behavior:
    summary: Returns null for null input, routes non-contiguous tensors through CalcNoContiguous to preserve view/storage shape, strides, and view offset, and routes contiguous tensors through l0op::Contiguous.
    key_steps:
      - Returns nullptr immediately when the input tensor pointer is null.
      - Uses IsContiguous(tensor) as the only branch for selecting the non-contiguous or contiguous path.
      - On the non-contiguous path, delegates to CalcNoContiguous, which calls executor->CreateView with GetViewShape(), GetStorageShape(), GetViewStrides(), and GetViewOffset().
      - On the contiguous path, calls l0op::Contiguous(tensor, executor) and returns that result.
  dataflow:
    inputs:
      - tensor as a caller-provided aclTensor pointer
      - executor as the factory for CreateView and l0op::Contiguous results
    outputs:
      - nullptr, a metadata-preserving view, or a contiguous tensor handle depending on the input state
