function_annotation:
  function_name: ProcessMm2
  qualified_name: FiaBlockCubeNonQuantMla<FIAT>::ProcessMm2
  canonical_name: FiaBlockCubeNonQuantMla<FIAT>::ProcessMm2
  owner: FiaBlockCubeNonQuantMla
  owner_qualified: FiaBlockCubeNonQuantMla<FIAT>
  owner_template_args:
    - FIAT
  template_params:
    - template<typename FIAT>
  variant: mla
  stage: mm2
  file: op_kernel/fia_block_cube_nonquant_mla_sink.h
  line_range:
    start: 851
    end: 1077
  role: MLA cube MM2 body that reloads Vec1 output from the normal vec1 ring, streams value tiles into L1, waits the nUpdate barrier before the first fixpipe, and accumulates later S-inner loops through the mm2 int32 alias.
  confidence: high
  source_evidence_ids:
    - SE-MLA-MM2-VALUE-ALIAS-FIXPIPE
    - SE-MLA-NUPDATE-BARRIER
    - SE-MLA-MM2-INT32-ALIAS
  code_behavior:
    summary: Tiles the current MLA PV workload by N and K, reloads Vec1 output into L1 as operand A, stages value tiles into L1 as operand B, runs MatmulKPP, and fixpipes into the mm2 ring with atomic accumulation enabled on non-first S-inner loops.
    key_steps:
      - Splits the chunk by N_L1_SPLIT_SIZE over headDim, by 256-wide K_L1 tiles over actualSingleProcessSInnerSize, and by 128-wide K_L0 subtiles.
      - Loads value tiles into KV L1 buffers through copyKvGmToL1 or CopySingleMatrixNDToNZ when sink value tensors are active.
      - Reloads Vec1 output from vec1ResGm into the QP L1 buffer with CopyInMm2AToL1, using actualSingleProcessSInnerSizeAlign as the A stride.
      - Runs MatmulKPP over each mL1 / nL1 / k1 tile and waits syncV1NupdateC2 before the very first Fixpipe.
      - Enables SetAtomicAdd only when info.isFirstSInnerLoop is false, fixpipes into mm2ResGm / mm2ResInt32Gm, and restores SetAtomicNone immediately afterward.
  dataflow:
    inputs:
      - vec1ResGm partial output from the MLA Vec1 stage
      - valueGmTensor or valueSinkGm tiles for the current S2 range
      - nUpdate readiness signaled through syncV1NupdateC2
    outputs:
      - mm2ResGm or mm2ResInt32Gm for the current preload slot and n-buffer M chunk
    gm:
      reads:
        - vec1ResGm through CopyInMm2AToL1
        - valueGmTensor through copyKvGmToL1
        - valueSinkGm through CopySingleMatrixNDToNZ on sink rows
      writes:
        - mm2ResGm through Fixpipe on the first S-inner loop
        - mm2ResInt32Gm alias through Fixpipe under SetAtomicAdd on later loops
    ub:
      reads:
        - local fixpipe parameter temporaries
      writes: []
    l1:
      reads:
        - l1QPTensor as the Vec1-derived A operand
        - l1KVTensor as the value-derived B operand
      writes:
        - Vec1 output tiles copied by CopyInMm2AToL1
        - value tiles copied by copyKvGmToL1 or CopySingleMatrixNDToNZ
    l0:
      l0a:
        - Vec1-derived A tiles for MatmulKPP
      l0b:
        - value-derived B tiles for MatmulKPP
      l0c:
        - PV accumulation before the ND Fixpipe
  control_flow:
    loops:
      - for each nL1 tile over headDim
      - for each k1 tile over actualSingleProcessSInnerSize
      - for each mL1 tile in the current n-buffer chunk
    branches:
      - sink-value versus regular value branch
      - tail handling for nL1, k1, and mL1
      - first S-inner loop versus later-loop atomic accumulation branch
  pipeline:
    stages:
      - mm2
      - mla
      - pv_cube_with_nupdate_barrier
    sync:
      - WaitFlag / SetFlag around QP and KV L1 buffer ownership
      - CrossCoreWaitFlag<constInfo.syncV1NupdateC2> before the first Fixpipe
      - SetAtomicAdd / SetAtomicNone bracketing later-loop accumulation
  memory_behavior:
    buffers:
      - l1QP4Buffers or l1QPTensor
      - l1KV3Buffers or l1KVTensor
      - cL0TensorPingPong
      - mm2ResGm / mm2ResInt32Gm workspace ring
    l1_residency:
      - Vec1-derived A tiles stay resident across nL1 iterations of the same mL1 tile.
    l1_partition:
      - Value tiles are staged as 256-wide K_L1 blocks and further split into 128-wide K_L0 blocks.
      - QP buffers track the same mL1 order as MM1 through GetQPL1RealIdx.
  tiling_and_shape:
    fields:
      - M_L1_SPLIT_SIZE
      - N_L1_SPLIT_SIZE
      - headDim
      - actualSingleProcessSInnerSize
      - preLoadNum
    shape_assumptions:
      - N is block-aligned headDim and drives the mm2Res output stride.
      - K is actualSingleProcessSInnerSize and is lowered through 256-wide L1 tiles plus 128-wide L0 tiles.
      - Later-loop accumulation reuses the same mm2 ring offset as the first loop and therefore depends on the int32 alias contract.
  workspace:
    layout:
      - normal.vec1 as the upstream A ring
      - normal.mm2 as the downstream PV ring
      - mm2 int32 alias over normal.mm2 for later-loop atomic accumulation
    offsets:
      - value S2 coordinate = info.s2BatchOffset + (kL1 - kOffset) * 128 + k1 * 256
      - vec1Res offset = (info.loop % constInfo.preLoadNum) * constInfo.mmResUbSize + mSeqIdx * info.actualSingleProcessSInnerSizeAlign + nOffset
      - mm2 offset = (info.bn2IdxInCurCore % constInfo.preLoadNum) * constInfo.bmm2ResUbSize + (mSplitInfo.nBufferStartM + mL1 * M_L1_SPLIT_SIZE) * nSize + nL1 * N_L1_SPLIT_SIZE
  optimization_intent:
    - Reuse Vec1 output as a cube operand without materializing a separate MLA-only GM buffer.
    - Keep the nUpdate barrier attached to the very first Fixpipe so later-loop atomic accumulation is source-faithful.
    - Preserve the int32 alias contract instead of inventing a standalone MLA tail region.
  tunable_or_structural_fields:
    - name: preLoadNum
      role: Selects the active mm2 ring slot and the corresponding vec1 input slot.
      source_evidence_ids:
        - SE-MLA-MM2-VALUE-ALIAS-FIXPIPE
    - name: headDim
      role: Determines the logical N extent and the width of the int32 alias accumulation.
      source_evidence_ids:
        - SE-MLA-MM2-VALUE-ALIAS-FIXPIPE
  constraints:
    - syncV1NupdateC2 must be observed before the first MM2 fixpipe so MLA nUpdate has been applied.
    - Later-loop accumulation must enter and exit SetAtomicAdd / SetAtomicNone exactly around the Fixpipe.
    - The mm2 int32 alias must remain a reinterpretation of normal.mm2, not a detached workspace tail.
  risks_if_changed:
    - Changing the first-fixpipe barrier or atomic scope corrupts later S-inner accumulation.
    - Rebinding the alias away from normal.mm2 breaks the observed MLA correction path.
    - Altering K_L1 / K_L0 traversal changes which V rows align with a given Vec1 tile.
  possible_dsl_sections:
    - mla.nupdate
    - mla.shape_contract
    - pipeline.cube_stages
  suggested_dsl_fields:
    - path: mla.nupdate.mm2_sync
      meaning: ProcessMm2 waits syncV1NupdateC2 before the first Fixpipe of the chunk.
      source_evidence_ids:
        - SE-MLA-NUPDATE-BARRIER
        - SE-MLA-MM2-VALUE-ALIAS-FIXPIPE
      confidence: high
    - path: workspace.mla.tail_regions[].binding_status
      meaning: Later-loop accumulation targets the mm2 int32 alias rather than a dedicated MLA tail region.
      source_evidence_ids:
        - SE-MLA-MM2-INT32-ALIAS
        - SE-MLA-MM2-VALUE-ALIAS-FIXPIPE
      confidence: high
    - path: mla.shape_contract.mm2_k_partition
      meaning: MLA MM2 lowers K through 256-wide L1 tiles plus 128-wide L0 subtiles.
      source_evidence_ids:
        - SE-MLA-MM2-VALUE-ALIAS-FIXPIPE
      confidence: high
  lowering_hints:
    - Lower this as the MLA-specific PV cube body rather than a generic MM2 helper.
    - Keep the first-fixpipe barrier, int32 alias, and later-loop atomic accumulation in one rule set because the three behaviors form one correctness contract.
  open_questions: []
