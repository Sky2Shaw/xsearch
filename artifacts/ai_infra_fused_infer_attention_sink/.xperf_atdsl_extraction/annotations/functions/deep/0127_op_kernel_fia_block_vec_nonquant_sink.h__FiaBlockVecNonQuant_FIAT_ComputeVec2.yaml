function_annotation:
  function_name: ComputeVec2
  qualified_name: FiaBlockVecNonQuant<FIAT>::ComputeVec2
  canonical_name: FiaBlockVecNonQuant<FIAT>::ComputeVec2
  owner: FiaBlockVecNonQuant
  owner_qualified: FiaBlockVecNonQuant<FIAT>
