      l0b: []
      l0c: []
  control_flow:
    loops: []
    branches:
      - null key early return
      - null value early return
      - key dtype gate
      - value dtype gate
  pipeline:
    stages:
      - host_api_boundary
      - input_metadata_preprocess
      - calls GetDataType, GetViewShape, SetViewShape, and SetDataType
    sync: []
  memory_behavior:
    buffers:
      - aclTensor descriptors for prefix key and value
      - temporary op::Shape copies for the key and value views
    l1_residency: []
    l1_partition: []
  tiling_and_shape:
    fields:
      - INT4_NUMS_IN_INT32
    shape_assumptions:
      - The helper rewrites only the last view dimension and leaves the remaining dimensions unchanged.
      - The rewrite path assumes each prefix tensor has at least one view dimension because it indexes viewShape[viewShapeDim - 1] without an explicit rank guard.
  workspace:
    layout: []
    offsets: []
  optimization_intent:
    - Normalize packed prefix-KV metadata at the host/API boundary without allocating replacement tensors.
    - Keep prefix inputs on the same DT_INT4 metadata contract as the non-prefix KV rewrite path.
  tunable_or_structural_fields:
    - name: INT4_NUMS_IN_INT32
      role: Fixed packing expansion factor used to convert the last view dimension from int32 packing units to logical int4 element count.
      source_evidence_ids:
        - SE-HOST-PREFIX-TENSOR-PREPROCESS
  constraints:
    - Keep the rewrite gated on both tensors being non-null and both dtypes still reporting DT_INT32.
    - Preserve the coupled update of last-dimension view shape and dtype retagging on both prefix tensors.
    - The rewrite path requires at least one view dimension on both tensors because the code directly addresses the last dimension.
  risks_if_changed:
    - Re-running the multiply after a tensor is already retagged would overstate the logical prefix sequence width.
    - Converting only one side of the prefix KV pair would leave the host metadata inconsistent for downstream consumers.
    - Relaxing the implicit rank requirement without matching source changes could hide out-of-bounds view-shape accesses.
  possible_dsl_sections:
    - operator.helpers
    - operator.input_tensor_views
  suggested_dsl_fields:
    - path: operator.helpers.prefix_tensor_preprocess.kv_int4_view_rewrite
      meaning: Prefix KV tensors are conditionally retagged from DT_INT32 to DT_INT4 and have their last view dimension expanded by a fixed factor of 8.
      source_evidence_ids:
