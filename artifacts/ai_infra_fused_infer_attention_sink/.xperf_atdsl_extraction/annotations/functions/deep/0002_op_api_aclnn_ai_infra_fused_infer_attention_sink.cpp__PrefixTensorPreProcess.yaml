  role: Host-side prefix-KV metadata rewrite that retags packed int32 prefix tensors as int4 views before operator setup continues.
  confidence: high
  source_evidence_ids:
    - SE-HOST-PREFIX-TENSOR-PREPROCESS
  code_behavior:
    summary: Returns early unless both prefix tensors are present and still report DT_INT32, then rewrites each tensor in place by multiplying the last view-shape dimension by 8 and changing the dtype to DT_INT4.
    key_steps:
      - Exits immediately when either prefix tensor pointer is null.
      - Uses tensorKey->GetDataType() and tensorValue->GetDataType() as the gate for whether the metadata conversion still needs to run.
      - Rewrites the key tensor view metadata in place by reading GetViewShape(), scaling the last dimension by INT4_NUMS_IN_INT32, and setting DT_INT4.
      - Applies the same in-place view-shape and dtype rewrite to the value prefix tensor.
  dataflow:
    inputs:
      - tensorKey and tensorValue as caller-owned aclTensor handles
      - per-tensor view shape metadata and current dtype
    outputs:
      - in-place rewritten prefix key/value metadata with DT_INT4 dtype and expanded last-dimension view shape
    gm:
      reads: []
      writes: []
    ub:
      reads: []
      writes: []
    l1:
