workspace:
  base_offset_rule:
    type: enum
    searchable: false
    editable_policy: configurable
    path: workspace.normal.regions[].base_offset_rule
    source_cards:
    - OC-WORKSPACE-NORMAL-RING
    source_evidence:
    - SE-WORKSPACE-NORMAL-ABI
    - SE-WORKSPACE-NORMAL-SIZE
    meaning: Contiguous region order for mm1, vec1, mm2, and vec2.
    confidence: medium
    ir_layer: kernel
    schedule_points: []
    feature_sources:
    - feature:history.failure_category
    - feature:history.similar_shape_key
    - feature:mapping.core_thread_mapping
    - feature:mapping.intrinsic_match
    - feature:memory.scope_reuse
    - feature:memory.working_set
    - feature:structural.loop_extents
    - feature:structural.reduction_depth
    measurement_metrics:
    - bytes_global
    - bytes_shared
    - compile_time_ms
    - correctness
    - failure_code
    - latency_us
    - occupancy_estimate
    - throughput_ops
    replay_requirements:
    - environment_fingerprint
    - shape_signature
    - dsl_version
    - schedule_trace
    - validator_results
    - compile_result
    - measurement_result
    - failure_metadata
