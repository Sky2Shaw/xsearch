decode:
  record_conditions:
    type: string
    searchable: false
    editable_policy: fixed
    path: flash_decode.fd_metadata.record_conditions
    source_cards:
    - OC-COMMON-FD-METADATA-MERGE-BEHAVIOR
    source_evidence:
    - SE-COMMON-SPLIT-CORE-CPP
    - SE-COMMON-SPLIT-CORE-H
    meaning: Common conditions that decide whether a split row emits FD metadata.
    confidence: medium
    ir_layer: kernel
    schedule_points:
    - schedule:flash_decode.fd_metadata.record_conditions
    feature_sources:
    - feature:history.failure_category
    - feature:history.similar_shape_key
    - feature:mapping.core_thread_mapping
    - feature:mapping.intrinsic_match
    - feature:memory.scope_reuse
    - feature:memory.working_set
    - feature:structural.loop_extents
    - feature:structural.reduction_depth
    measurement_metrics:
    - bytes_global
    - bytes_shared
    - compile_time_ms
    - correctness
    - failure_code
    - latency_us
    - occupancy_estimate
    - throughput_ops
    replay_requirements:
    - environment_fingerprint
    - shape_signature
    - dsl_version
    - schedule_trace
    - validator_results
    - compile_result
    - measurement_result
    - failure_metadata
