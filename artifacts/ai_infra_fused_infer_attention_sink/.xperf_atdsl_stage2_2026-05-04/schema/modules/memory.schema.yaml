      K slices.
    confidence: medium
    ir_layer: kernel
    schedule_points:
    - schedule:memory.l1.gqa.q_snapshot_signature
    feature_sources:
    - feature:history.failure_category
    - feature:history.similar_shape_key
    - feature:mapping.core_thread_mapping
    - feature:mapping.intrinsic_match
    - feature:memory.scope_reuse
    - feature:memory.working_set
    - feature:structural.loop_extents
    - feature:structural.reduction_depth
    measurement_metrics:
    - bytes_global
    - bytes_shared
    - compile_time_ms
    - correctness
    - failure_code
    - latency_us
    - occupancy_estimate
    - throughput_ops
    replay_requirements:
    - environment_fingerprint
    - shape_signature
    - dsl_version
    - schedule_trace
    - validator_results
    - compile_result
    - measurement_result
    - failure_metadata
