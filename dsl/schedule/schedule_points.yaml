path_conventions:
  rule: Every schedule_point.dsl_path must resolve in an atdsl.instance and, when binding_required=true, must equal binding_ir.semantic_fields[semantic_field].dsl_path.
  list_selector: objects[v_tile] selects the list item whose name/id equals v_tile.
  v0_6_note: List selectors also support fields[semantic_id] and patterns[id] for schema-ingested contracts.
  v0_7_note: P0/P1 execution-closure IRs are referenced by runtime_ir/*.yaml and may be used by validators even when not mutated by source rewrite.
