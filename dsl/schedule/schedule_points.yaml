  - 128
  - 256
  policy: searchable
  validators:
  - workspace_contiguous_abi
  - sparse_policy_contract
  - ub_capacity_or_cost_precheck
  - risk_guard_attached
  - workspace_layout_abi_valid
  binding_required: true
  source_knob: s2BaseSize
  value_constraints:
  - candidate_must_be_int
  - candidate_must_be_in_declared_candidates_or_planner_generated
  test_selection:
    mode: by_changed_dsl_path
    test_contract_ir: runtime_ir/test_contract_ir.fia_sink.yaml
  knob_ir_link:
    knob_name: s2BaseSize
    domain_source: runtime_ir/knob_ir.fia_sink.yaml
    validator: knob_domain_valid
  flow_group: TILING_SPLIT_CORE
