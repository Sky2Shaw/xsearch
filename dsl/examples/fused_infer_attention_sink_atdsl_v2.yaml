version: 0.7-execution-closure
kind: atdsl.instance
name: fused_infer_attention_sink_atdsl_v2
semantic_ir:
  operator:
    family: fused_infer_attention
    canonical_name: ai_infra_fused_infer_attention_sink
  profiles:
  - flash_decode
  - gqa_decode
  - mla_decode
  - sparse_sink_attention
  interface:
    inputs:
    - query
    - key
    - value
    - atten_mask?
    - actual_seq_len?
    - block_table?
    - tilingData
    outputs:
    - attention_out
    - softmax_lse?
    workspace: required
    side_effects:
    - workspace_read_write
    - event_synchronization
  shape:
    axes:
    - B
    - S1
    - S2
    - N
    - G
    - D
    derived:
      head_dim_align:
        semantic_id: attention.shape.head_dim_align
        policy: fixed
  layout:
    contract_ref: shape_layout.contract
    canonical_axes:
    - axis: B
      meaning: batch index
    - axis: S1
      meaning: query sequence rows
    - axis: S2
      meaning: key/value sequence rows
    - axis: N
      meaning: query head count
    - axis: G
      meaning: per-head group span used by grouped-query layouts
    - axis: D
      meaning: value head dimension
    - axis: T
      meaning: flattened token rows for varlen TND-family layouts
    query_layout_families:
      dense_family:
        layouts:
        - BSH
        - BSND
        - BNSD
        - NSD
        source_evidence_ids:
        - SE-SHAPE-LAYOUT-CONTRACT
        - SE-TEST-INFER-SHAPE-LAYOUTS
        axis_mappings:
          BSH:
          - B
          - S1
          - N*D
          BSND:
          - B
          - S1
          - N
          - D
          BNSD:
          - B
          - N
          - S1
          - D
          NSD:
          - N
          - S1
          - D
      varlen_family:
        layouts:
        - TND
        - NTD
        source_evidence_ids:
        - SE-SHAPE-LAYOUT-CONTRACT
        - SE-TEST-INFER-SHAPE-LAYOUTS
        axis_mappings:
          TND:
          - T
          - N
          - D
          NTD:
          - N
          - T
          - D
    attention_out_layouts:
      layouts:
      - name: BSH
        output_shape:
        - B
        - S1
        - N*valueD
      - name: BSND
        output_shape:
        - B
        - S1
        - N
        - valueD
      - name: BNSD
        output_shape:
        - B
        - N
        - S1
        - valueD
      - name: NBSD
        output_shape:
        - N
        - B
        - S1
        - valueD
      - name: TND
        output_shape:
        - T
        - N
        - valueD
      - name: NTD
        output_shape:
        - N
        - T
        - valueD
      - name: NSD
        output_shape:
        - N
        - S1
        - valueD
      source_evidence_ids:
      - SE-SHAPE-LAYOUT-CONTRACT
      - SE-FD-OUTPUT-LAYOUTS
      - SE-TEST-INFER-SHAPE-LAYOUTS
    softmax_lse_layouts:
      tnd_family:
        layouts:
        - TND
        - NTD
        - TND_NTD
        - NTD_TND
        output_shape:
        - T
        - N
        - 1
        source_evidence_ids:
        - SE-SHAPE-LAYOUT-CONTRACT
        - SE-MLA-LSE-LAYOUT-COPY
        - SE-TEST-INFER-SHAPE-LAYOUTS
      dense_family:
        layouts:
        - BSH
        - BSND
        - BNSD
        output_shape:
        - B
        - N
        - S1
        - 1
        source_evidence_ids:
        - SE-SHAPE-LAYOUT-CONTRACT
        - SE-MLA-LSE-LAYOUT-COPY
        - SE-TEST-INFER-SHAPE-LAYOUTS
    varlen_rules:
    - name: tnd_query_prefix
      rule: actualSeqLengthsGmQ contributes prefixBS1 when TND-family kernels export softmaxLse or final attention rows.
      source_evidence_ids:
      - SE-SHAPE-LAYOUT-CONTRACT
      - SE-MLA-LSE-LAYOUT-COPY
    - name: query_value_dim_coupling
      rule: attentionOut keeps the query-side B/S1/N topology but replaces D with the value-side valueD.
      source_evidence_ids:
      - SE-SHAPE-LAYOUT-CONTRACT
    common_backed_semantics:
      supplement_sources:
      - common_supplement/shape_layout_extraction.yaml
      - common_supplement/common_dependency_inventory.yaml
      source_evidence_ids:
      - SE-COMMON-FIA-TILING-SHAPE-CPP
      - SE-COMMON-FIA-TILING-SHAPE-H
      - SE-COMMON-FIA-TILING-INFO-H
      common_axis_map:
        BSH:
        - B
        - S
        - H
        BSND:
        - B
        - S
        - N
        - D
        BNSD:
        - B
        - N
        - S
        - D
        NZ:
        - Bn
        - N
        - D1
        - Bs
        - D0
        TND:
        - T
        - N
        - D
        NBSD:
        - N
        - B
        - S
        - D
        NTD:
        - N
        - T
        - D
        BS2:
        - B
        - S2
        S1S2:
        - S1
        - S2
        BnBsH:
        - Bn
        - Bs
        - H
        BnNBsD:
        - Bn
        - N
        - Bs
        - D
        BnBsND:
        - Bn
        - Bs
        - N
        - D
        BNS1S2:
        - B
        - N
        - S1
        - S2
        INS1S2:
        - CONST
        - N
        - S1
        - S2
        BNS11:
        - B
        - N
        - S1
        - CONST
        TN1:
        - T
        - N
        - CONST
        BS1S2:
        - B
        - S1
        - S2
        B1S1S2:
        - B
        - CONST
        - S1
        - S2
        IS1S2:
        - CONST
        - S1
        - S2
        I1S1S2:
        - CONST
        - CONST
        - S1
        - S2
      derived_dimensions:
        H: N * D
        D_derivation:
        - direct D axis when present
        - H / N when H exists, N is nonzero, and H is divisible by N
        - D1 * D0 for NZ-style storage axes
      nz_layout_contract:
        axis_order:
        - Bn
        - N
        - D1
        - Bs
        - D0
        expected_shape:
        - Bn
        - N
        - D / D0
        - Bs
        - D0
        d0_default: 16
        d_from_storage_axes: D1 * D0
      shape_compare_modes:
        enum_values:
          EQUAL: 0
          GREATER: 1
          GREATER_EQUAL: 2
          LESS: 3
          LESS_EQUAL: 4
          NOT_EQUAL: 5
          IGNORE_INPUT: 6
        default_compare_type: EQUAL
        ignore_input_behavior: valid compare function that always passes, although serialization falls through to UNKNOWN.
      stage2_import_note: Stage-2 shape DSL should carry ordered axes, derived dimensions, NZ packing, and per-axis compare modes as first-class
        validation fields.
  numerical_contract:
    softmax: online
    lse_stable_merge: required_when_flash_decode_split_kv
    invalid_row_correction: required_when_sparse_or_mask_marks_invalid_rows
    precision_contract:
    - accumulate_in_fp32_where_required
    - do_not_reorder_fd_lse_weight_formula
  semantic_invariants:
  - same input/output semantics after schedule transforms
  - stable_lse_merge_preserved
  - workspace_region_identity_preserved
  - shape_layout_contract_preserved
kernel_ir:
  loop_nest:
    order: runinfo_ring_driven
    split_core_range:
      owner: split_core.range_contract
      producer_status: external_producer_with_verified_host_bridge
      input_contract:
        base_info_fields:
        - bSize
        - n2Size
        - gSize
        - s1Size
        - s2Size
        - actualLenQDims
        - actualLenKvDims
        - preToken
        - nextToken
        - isS1G
        - sparseMode
        - attenMaskFlag
        - sinkNumber
        - keySinkNumber
        - supportFD
        split_param_fields:
        - mBaseSize
        - s2BaseSize
        - gS1BaseSizeOfFd
        source_evidence_ids:
        - SE-SPLIT-CORE-INPUT-PARAMS
        - SE-SPLIT-CORE-INPUT-PARAMS-MLA
      output_contract:
        outer_split_params:
        - bN2End[]
        - gS1End[]
        - s2End[]
        fd_params:
        - bN2IdxOfFdHead[]
        - gS1IdxOfFdHead[]
        - s2SplitNumOfFdHead[]
        - s2SplitStartIdxOfCore[]
        - gS1SplitNumOfFdHead[]
        - gS1LastPartSizeOfFdHead[]
        - gS1IdxEndOfFdHead[]
        - gS1IdxEndOfFdHeadSplit[]
        source_evidence_ids:
        - SE-SPLIT-CORE-OUTPUT-BRIDGE
        - SE-SPLIT-CORE-OUTPUT-BRIDGE-MLA
      range_assignments:
        status: runtime_generated_by_split_core
        fields:
        - core_idx
        - bn2_range
        - gs1_range
        - s2_range
        - fd_task_count
  tiles:
    s2_base:
      semantic_id: attention.tiling.s2_base
      value: from_tiling
      policy: searchable
    m_base:
      semantic_id: attention.tiling.m_base
      value: from_tiling
      policy: searchable
    preload_slots:
      value: from_preLoadNum
      policy: fixed
    fd_g_s1_base_size:
      semantic_id: flash_decode.partition.g_s1_base
      value: from_tiling
      policy: configurable_guarded
  pipeline:
    kind: runinfo_three_stage_ring
    stage_graph:
      source_card: OC-RUNINFO-THREE-STAGE-RING
      owner_qualified_stages: true
    stages:
    - mm1_qk
    - vec1_softmax_lse
    - mm2_pv
    - vec2_store_or_fd_export
    - mla_nupdate?
    - fd_merge?
    event_policy:
      editable: false
      forbidden_transform: FT-NO-RUNINFO-STAGE-REORDER
    stage_aliases:
    - id: ALIAS-GQA-VEC1-SHARED
      alias_stage: gqa.vec1
      critical_path_stage: gqa.vec1
      dispatcher_owner: FiaKernelNonQuant<FIAT>
      dispatcher_stage: ComputeVec1
      shared_owner: FiaBlockVecNonQuant<FIAT>
      shared_stage: ComputeVec1
      canonical_name: FiaBlockVecNonQuant<FIAT>::ComputeVec1
      shared_stage_annotation: annotations/functions/deep/0126_op_kernel_fia_block_vec_nonquant_sink.h__FiaBlockVecNonQuant_FIAT_ComputeVec1.yaml
      inner_contract_annotation: annotations/functions/deep/0095_op_kernel_fia_block_vec_nonquant_sink.h__FiaBlockVecNonQuant_FIAT_ProcessVec1SingleBuf.yaml
      producer_stages:
      - gqa.mm1
      consumer_stages:
      - gqa.mm2
      - flash_decode.merge
      producer_consumer_link: FiaKernelNonQuant dispatches the GQA Vec1 slot into the shared vectorService ComputeVec1, which waits syncC1V1,
        runs ProcessVec1SingleBuf, and signals syncV1C2 for downstream MM2 or FD consumers.
      source_evidence_ids:
      - SE-GQA-SHARED-VECTOR-OWNER
      - SE-GQA-VEC1-DISPATCH
      - SE-SHARED-VEC1-SYNC
    - id: ALIAS-GQA-VEC2-SHARED
      alias_stage: gqa.vec2.output
      legacy_alias_stage: gqa.vec2
      critical_path_stage: gqa.vec2.output
      dispatcher_owner: FiaKernelNonQuant<FIAT>
      dispatcher_stage: ComputeVec2
      shared_owner: FiaBlockVecNonQuant<FIAT>
      shared_stage: ComputeVec2
      canonical_name: FiaBlockVecNonQuant<FIAT>::ComputeVec2
      shared_stage_annotation: annotations/functions/deep/0127_op_kernel_fia_block_vec_nonquant_sink.h__FiaBlockVecNonQuant_FIAT_ComputeVec2.yaml
      inner_contract_annotation: annotations/functions/deep/0099_op_kernel_fia_block_vec_nonquant_sink.h__FiaBlockVecNonQuant_FIAT_ProcessVec2SingleBuf.yaml
      producer_stages:
      - gqa.mm2
      consumer_stages:
      - output.final_attention
      - flash_decode.merge
      producer_consumer_link: FiaKernelNonQuant dispatches the GQA Vec2 slot into the shared vectorService ComputeVec2, which waits syncC2V2,
        runs ProcessVec2SingleBuf, and signals syncV2C2 after final output or split-KV partial export.
      source_evidence_ids:
      - SE-GQA-SHARED-VECTOR-OWNER
      - SE-GQA-VEC2-DISPATCH
      - SE-SHARED-VEC2-SYNC
  memory_plan:
    spaces:
    - GM
    - UB
    - L1
    - L0A
    - L0B
    - L0C
    l1_residency:
      source_card: OC-GQA-MM2-L1-V-REUSE
      objects:
      - name: v_tile
        memory: L1
        scope: across_g
        reuse_by:
        - mm2
        snapshot_signature:
        - vCoord
        eviction: explicit_event_release
        event: V_EVENT
    workspace:
      normal_ring:
        source_card: OC-WORKSPACE-NORMAL-RING
        abi_locked: true
        regions:
        - normal.mm1
        - normal.mm2
        - normal.softmax_lse
        - normal.tmp
        offset_model: contiguous_abi_locked
        binding_required: true
      flash_decode_regions:
        source_card: OC-WORKSPACE-FD-REGIONS
        regions:
        - fd_partial_o
        - fd_partial_max
        - fd_partial_sum
        region_contracts:
        - region_id: fd_partial_o
          semantic_id: workspace.fd.partial_o
          sized_by:
          - aicNum
          - mBaseSize
          - headDimAlign
          - split_task_count
        - region_id: fd_partial_max
          semantic_id: workspace.fd.partial_max
          sized_by:
          - aicNum
          - mBaseSize
          - fp32_block
        - region_id: fd_partial_sum
          semantic_id: workspace.fd.partial_sum
          sized_by:
          - aicNum
          - mBaseSize
          - fp32_block
        alias_policy: must_not_overlap_normal_or_mla_budget_tail
        offset_rules:
        - scalar.offset_rules.fd_task_offset
        - scalar.offset_rules.fd_partial_output_offset
      mla_tail_regions:
        source_cards:
        - OC-WORKSPACE-MLA-NUPDATE-BUDGET-STUB
        - OC-WORKSPACE-MLA-SOFTMAX-SUM-BUDGET-STUB
        binding_status_required: true
        tail_regions:
        - region_id: mla.nupdate
          optimization_card_id: OC-WORKSPACE-MLA-NUPDATE-BUDGET-STUB
          binding_status: host_budget_only_stub_with_normal_mm2_alias
          kernel_binding_evidence:
            source_evidence_ids:
            - SE-WORKSPACE-MLA-ABI
            - SE-WORKSPACE-MLA-INIT-ORDER
            - SE-MLA-MM2-INT32-ALIAS
          local_buffer_bridge:
            producer: AmlaVecCompute writes the row-wise int32 vector into outputBuff2
            consumer: ProcessAmlaNupdate broadcasts the vector and atomically adds it into mm2ResInt32Gm
          validation_note: Do not lower this region as a standalone GM tensor until direct SetGlobalBuffer evidence appears.
        - region_id: mla.softmax_sum
          optimization_card_id: OC-WORKSPACE-MLA-SOFTMAX-SUM-BUDGET-STUB
          binding_status: host_budget_only_stub_with_local_ub_bridge
          kernel_binding_evidence:
            source_evidence_ids:
            - SE-WORKSPACE-MLA-ABI
            - SE-WORKSPACE-MLA-INIT-ORDER
            - SE-MLA-AMLASUM-UB-ONLY
          local_buffer_bridge:
            producer: AmlaVecCompute materializes aMlaSumUb on the last S2 loop
            consumer: DealBmm2ResBaseBlock broadcasts aMlaSumUb and divides the reloaded MM2 rows before copy-out
          validation_note: Preserve this as a budget-only ABI field with explicit UB bridge metadata.
  flash_decode:
    route:
      split_kv_enabled:
        semantic_id: flash_decode.route.split_kv_enabled
        source_knob: splitKVFlag
        policy: configurable_guarded
        value: from_tiling
    metadata_bridge:
      owner: flash_decode.metadata_bridge
      source_card: OC-FD-METADATA-BRIDGE
    merge:
      method: stable_lse_merge
      source_card: OC-FD-STABLE-MERGE
      stages:
      - col_max
      - row_sub
      - exp
      - mul_lse_sum
      - col_add
      - div_sum
    fdparams:
      semantic_id: flash_decode.fdparams
      bridge_status: imported_from_stage1
      producer_boundary:
        split_core_inputs:
          functions:
          - FiaTilingNonQuant::CreateSplitInput
          - FiaTilingNonQuantMla::CreateSplitInput
          source_evidence_ids:
          - SE-SPLIT-CORE-INPUT-PARAMS
          - SE-SPLIT-CORE-INPUT-PARAMS-MLA
          packaged_fields:
          - mBaseSize
          - s2BaseSize
          - gS1BaseSizeOfFd
          - preToken
          - nextToken
          - isS1G
          - sparseMode
          - attenMaskFlag
          - sinkNumber
          - keySinkNumber
          - actualLenQDims
          - actualLenKvDims
        split_core_outputs:
          functions:
          - FiaTilingNonQuant::SetSplitOutput
          - FiaTilingNonQuantMla::SetSplitOutput
          source_evidence_ids:
          - SE-SPLIT-CORE-OUTPUT-BRIDGE
          - SE-SPLIT-CORE-OUTPUT-BRIDGE-MLA
          copied_arrays:
          - usedVecNumOfFd
          - bN2IdxOfFdHead[]
          - gS1IdxOfFdHead[]
          - s2SplitNumOfFdHead[]
          - s2SplitStartIdxOfCore[]
          - gS1SplitNumOfFdHead[]
          - gS1LastPartSizeOfFdHead[]
          - gS1IdxEndOfFdHead[]
          - gS1IdxEndOfFdHeadSplit[]
      kernel_consumers:
      - variant: nonquant_or_gqa
        function: FiaKernelNonQuant<FIAT>::FlashDecode
        source_evidence_ids:
        - SE-FD-METADATA-PARTITION
        consumed_fields:
        - usedVecNumOfFd
        - gS1BaseSizeOfFd
        - bN2IdxOfFdHead[]
        - gS1IdxOfFdHead[]
        - s2SplitNumOfFdHead[]
        - gS1SplitNumOfFdHead[]
        - gS1LastPartSizeOfFdHead[]
        - gS1IdxEndOfFdHead[]
        - gS1IdxEndOfFdHeadSplit[]
      - variant: mla
        function: FiaKernelNonQuantMla<FIAT,CubeBlockType,VecBlockType,FdBlockType>::FlashDecode
        source_evidence_ids:
        - SE-FD-METADATA-PARTITION-MLA
        consumed_fields:
        - usedVecNumOfFd
        - gS1BaseSizeOfFd
        - bN2IdxOfFdHead[]
        - gS1IdxOfFdHead[]
        - s2SplitNumOfFdHead[]
        - gS1SplitNumOfFdHead[]
        - gS1LastPartSizeOfFdHead[]
        - gS1IdxEndOfFdHead[]
        - gS1IdxEndOfFdHeadSplit[]
      fields:
      - semantic_id: flash_decode.fdparams.used_vec_num
        source_field: usedVecNumOfFd
        type: uint32
        contract: Bounds active AIV cores that may enter FD merge path.
      - semantic_id: flash_decode.fdparams.bn2_idx_of_fd_head
        source_field: bN2IdxOfFdHead[]
        type: uint32[]
        contract: Maps FD task to batch-head group.
      - semantic_id: flash_decode.fdparams.gs1_idx_of_fd_head
        source_field: gS1IdxOfFdHead[]
        type: uint32[]
        contract: Maps FD task to gS1 partition origin in mBaseSize units.
      - semantic_id: flash_decode.fdparams.s2_split_num_of_fd_head
        source_field: s2SplitNumOfFdHead[]
        type: uint32[]
        contract: Per-task number of split-KV partials; feeds fd_task_offset prefix sum.
      - semantic_id: flash_decode.fdparams.gs1_split_num_of_fd_head
        source_field: gS1SplitNumOfFdHead[]
        type: uint32[]
      - semantic_id: flash_decode.fdparams.gs1_last_part_size_of_fd_head
        source_field: gS1LastPartSizeOfFdHead[]
        type: uint32[]
      - semantic_id: flash_decode.fdparams.gs1_idx_end_of_fd_head
        source_field: gS1IdxEndOfFdHead[]
        type: uint32[]
      - semantic_id: flash_decode.fdparams.gs1_idx_end_of_fd_head_split
        source_field: gS1IdxEndOfFdHeadSplit[]
        type: uint32[]
      validators:
      - fd_metadata_bridge_valid
      - split_core_range_contract_valid
      - fd_used_vec_bounds
  sparse_policy:
    semantic_id: sparse.policy
    source_card: OC-COMMON-SPARSE-SINK-S2-RANGE
    mode:
      semantic_id: sparse.policy.mode
      enum_values:
      - LEFT_UP_CAUSAL
      - ALL_MASK
      - BAND
      - DEFAULT_MASK
    invalid_row_rule:
      semantic_id: sparse.policy.invalid_row_rule
      producer: FiaTilingNonQuant::IsExistRowInvalid
      consumers:
      - Vec1SinkSoftmaxProc
      - FlashDecode final LSE export
    fd_pre_next_token_rule:
      semantic_id: sparse.policy.fd_pre_next_token_rule
      source: FlashDecode::CalaPreNextTokens
      sink_adjustments: &id001
      - applies_when: sinkNumber > 0 and sparseMode == SPARSE_MODE_2 on the generic host path
        rule: nextToken is overwritten with sinkNumber before maskParams are finalized
        source_evidence_ids:
        - SE-SPARSE-MASK-PARAMS
        - SE-TEST-TILING-SINK-CONSTRAINTS
      - applies_when: sinkNumber > 0 in FlashDecode BAND or causal handling
        rule: nextTokensPerBatch is reduced by sinkNumber before invalid-row handling
        source_evidence_ids:
        - SE-FD-SPARSE-POLICY
        - SE-TEST-ST-EAGER-REFERENCE
    sink_adjustments: *id001
    s2_range_policy:
      semantic_id: sparse.policy.s2_range
      policy: configurable_guarded
    validators:
    - sparse_policy_contract
    - invalid_row_lse_correction
  compute:
    scalar_offset_rules:
      semantic_id: scalar.offset_rules
      source_card: OC-SCALAR-RING-OFFSET-HOIST
      patterns:
      - id: fd_task_offset
        formula: taskOffset = sum_{i < fdTaskId}(s2SplitNumOfFdHead[i]) * mBaseSize
        lowering_hint: Hoist the prefix sum outside the per-gS1 partition loop and reuse it for both LSE and accumOut addressing.
        source_evidence_ids:
        - SE-FD-TASK-OFFSET-SCALARS
      - id: fd_partial_output_offset
        formula: combineAccumOutOffset = startRow * headDim + splitKVIndex * mBaseSize * headDim
        lowering_hint: Preserve the split-KV-major ordering used by CopyAccumOutIn.
        source_evidence_ids:
        - SE-FD-WORKSPACE-OFFSETS
        - SE-FD-TASK-OFFSET-SCALARS
      - id: mla_nupdate_atomic_base
        formula: baseoffset = (bn2IdxInCurCore % preLoadNum) * bmm2ResUbSize + (nBufferStartM + vecStartM + loop * mSplitSize) * headDim
        lowering_hint: Keep the preload-slot modulus and headDim stride coupled to the atomic add target.
        source_evidence_ids:
        - SE-MLA-NUPDATE-ATOMIC-TARGET
      - id: mla_mm2_reload_slot
        formula: srcGmOffset = (bn2IdxInCurCore % preLoadNum) * bmm2ResUbSize + mStart * headDimAlign
        lowering_hint: Preserve the preload-slot ring and padded stride when Vec2 rereads normal.mm2.
        source_evidence_ids:
        - SE-MLA-VEC2-NORMALIZE-COPY
        - SE-KNOB-HEADDIM-ALIGN
      - id: mla_fd_partial_offset
        formula: offset = accumTmpOutNum * kvHeadNum * mBaseSize * headDim + tndCoreStartKVSplitPos * kvHeadNum * mBaseSize * headDim + wsMStart
          * actualColumnCount
        lowering_hint: Do not collapse the task-prefix, split-index, and row-offset terms; each reflects a different stage boundary.
        source_evidence_ids:
        - SE-MLA-VEC2-NORMALIZE-COPY
      validators:
      - scalar_offset_consistency
      - workspace_contiguous_abi
      - fd_lse_merge_valid
    mla_nupdate:
      semantic_id: mla.nupdate.numeric_contract
      source_cards:
      - OC-MLA-MM2-NUPDATE-BARRIER
      - OC-MLA-NUPDATE-SIDECHANNEL
      compute_formula:
        ordered_micro_steps:
        - derive nUpdateTmp from softmax state
