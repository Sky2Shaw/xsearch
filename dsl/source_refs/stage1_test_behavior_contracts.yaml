test_behavior_contracts:
  status: source_backed_test_contracts_recorded
  contracts:
    - id: TEST-SHAPE-LAYOUT-FAMILIES
      test_surface: unit_test_infershape
      file: tests/ut/op_host/test_ai_infra_fused_infer_attention_sink_infershape.cpp
      line_range:
        start: 31
        end: 345
      covered_contracts:
        - shape_layout.query_layout_families
        - shape_layout.attention_out_layouts
        - shape_layout.softmax_lse_layouts
      observed_behavior: Infer-shape UTs cover TND, BNSD, BSND_BNSD, BSH, and NTD cases, including softmax_lse shape {0} when softmax_lse_flag is false.
      source_evidence_ids:
        - SE-TEST-INFER-SHAPE-LAYOUTS
    - id: TEST-SPARSE-SINK-TILING-GUARDS
      test_surface: unit_test_tiling
      file: tests/ut/op_host/test_ai_infra_fused_infer_attention_sink_tiling.cpp
      line_range:
        start: 52
        end: 398
      covered_contracts:
        - sparse.policy.sink_adjustments
        - sparse.policy.validator_rules
        - operator.interface.sink_number_constraints
      observed_behavior: Tiling UTs reject negative, over-boundary, and odd sinkNumber values, and accept the TND sparse-mode sink path with an expected tiling key and workspace.
      source_evidence_ids:
        - SE-TEST-TILING-SINK-CONSTRAINTS
    - id: TEST-FD-WORKSPACE-TILING
      test_surface: unit_test_tiling
      file: tests/ut/op_host/test_ai_infra_fused_infer_attention_sink_tiling.cpp
      line_range:
        start: 468
        end: 1372
      covered_contracts:
        - workspace.flash_decode_regions
        - split_core.range_assignments
        - flash_decode.metadata_bridge
        - workspace.mla.tail_regions
      observed_behavior: Tiling UTs exercise FD, GQA max-workspace, MLA max-workspace, and MLA FD paths with expected workspace vectors and tiling keys.
      source_evidence_ids:
        - SE-TEST-TILING-FD-WORKSPACE
    - id: TEST-API-WORKSPACE-SMOKE
      test_surface: unit_test_op_api
      file: tests/ut/op_api/test_aclnn_ai_infra_fused_infer_attention_sink.cpp
      line_range:
        start: 39
        end: 147
      covered_contracts:
        - operator.interface.public_aclnn_entry
        - operator.optional_outputs.softmax_lse
        - operator.input_tensor_lists.kv_tensor_list
      observed_behavior: The op_api UT builds a TND sink case with KV tensor lists, metadata, block table, softmax_lse output enabled, and expects TestGetWorkspaceSize to return ACLNN_SUCCESS.
      source_evidence_ids:
        - SE-TEST-API-WORKSPACE-SMOKE
    - id: TEST-ST-EAGER-REFERENCE
      test_surface: system_test_npu
      file: tests/st/test_npu_fused_infer_attention_sink.py
      line_range:
        start: 61
        end: 92
      covered_contracts:
        - sparse.policy.fd_pre_next_token_rule
        - operator.execution.eager_reference_accuracy
        - flash_decode.metadata_bridge
      observed_behavior: The NPU eager ST builds metadata, runs npu_fused_infer_attention_sink with sparse_mode 4 and sink_number 128, and compares output against a Python softmax/matmul reference with 0.004 relative and absolute tolerances.
      source_evidence_ids:
        - SE-TEST-ST-EAGER-REFERENCE
    - id: TEST-ST-GRAPH-CAPTURE-MLA-GQA
      test_surface: system_test_npu_graph
      file: tests/st/test_npu_fused_infer_attention_sink.py
      line_range:
        start: 94
        end: 347
      covered_contracts:
        - operator.execution.graph_capture
        - mla.query_rope_key_rope_path
        - gqa.sink_tensor_path
        - flash_decode.metadata_bridge
      observed_behavior: Graph-capture STs build metadata on an auxiliary stream, wait from the AICore stream, replay the graph, and compare generic and MLA outputs against torch_npu reference attention; sink-tensor MLA/GQA cases exercise key_sink, key_rope_sink, and value_sink routing.
      source_evidence_ids:
        - SE-TEST-ST-GRAPH-CAPTURE
    - id: TEST-BENCHMARK-CACHED-REFERENCE
      test_surface: benchmark
      file: tests/benchmark/benchmark_fused_infer_attention_sink.py
      line_range:
        start: 58
        end: 116
      covered_contracts:
        - operator.execution.benchmark_reference_check
        - sparse.policy.sink_reference_mask
      observed_behavior: Benchmark uses the same TND sparse sink scenario, reuses cached CPU reference output when present, and asserts np.allclose with 0.004 tolerances before optional repeated NPU execution.
      source_evidence_ids:
        - SE-TEST-BENCHMARK-CACHED-REFERENCE
