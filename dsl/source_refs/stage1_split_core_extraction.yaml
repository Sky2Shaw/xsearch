artifact: split_core_extraction
scope: "Host common split-core semantics used by attention operators."
allowed_sources:
  - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.cpp"
  - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.h"

cost_model:
  block_cost_formula:
    expression: "6 * ceil(M / 16) + 10 * ceil(S2 / 64)"
    implementation_notes:
      - "M is aligned upward with (basicM + 16 - 1) >> 4."
      - "S2 is aligned upward with (basicS2 + 64 - 1) >> 6."
      - "The returned scalar combines M and S2 terms with coefficients 6 and 10."
    evidence:
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.cpp:86"
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.cpp:90"
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.cpp:91"
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.cpp:92"
  block_type_table:
    semantics:
      - "Cost table records normal/normal, tail/normal, normal/tail, and tail/tail block costs."
      - "Tail entries become zero when the corresponding tail size is zero."
    evidence:
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.cpp:95"
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.cpp:99"
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.cpp:100"
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.cpp:101"
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.cpp:102"
  tolerance:
    fa_tolerance_ratio: 2
    fd_tolerance_ratio: 2
    tolerance_predicate: "limit + tolerance >= value"
    evidence:
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.h:25"
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.h:26"
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.h:61"
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.h:64"

core_search:
  preprocessing:
    - "SplitCore first builds per-batch split metadata and exits the all-empty KV case with one used core."
    - "CalcCostInfo accumulates total cost and total block count from per-batch costs multiplied by n2Size."
  search_bounds:
    max_core: "min(requested coreNum, totalBlockNum)"
    min_core: "min(rounding expression sqrt(totalBlockNum + 0.25) + 0.5, maxCore)"
  selection:
    - "The search evaluates candidate core counts from minCore through maxCore."
    - "A candidate replaces the result when its maxCost is lower than the current best."
    - "The final usedCoreNum is clamped to at least one core."
  evidence:
    - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.cpp:739"
    - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.cpp:742"
    - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.cpp:750"
    - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.cpp:753"
    - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.cpp:754"
    - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.cpp:762"
    - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.cpp:764"
    - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.cpp:774"

sparse_and_sink_handling:
  sparse_modes:
    enum_values:
      DEFAULT_MASK: 0
      ALL_MASK: 1
      LEFT_UP_CAUSAL: 2
      RIGHT_DOWN_CAUSAL: 3
      BAND: 4
      SPARSE_BUTT: 5
    sentinel_modes:
      - "SPARSE_BUTT is a sentinel enum value, not a runtime sparse mode."
    evidence:
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.h:34"
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.h:35"
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.h:36"
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.h:37"
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.h:38"
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.h:39"
      - "inference/ascendc/src/ops-transformer/attention/common/op_host/split_core.h:40"
  s2_range:
    - "Without an attention mask, S2 covers all S2 base blocks."
    - "With a mask, S2 token bounds are derived from the S1G token range plus pre/next token offsets, clipped to valid S2 tokens, then converted to a right-open S2 block range."
    - "No valid token range returns an empty S2 range."
  band_cache_behavior:
    - "BAND mode shifts preToken by s1Size - s2Size."
    - "BAND mode shifts nextToken by s2Size - s1Size."
  key_sink_handling:
    - "BaseInfo carries both sinkNumber and keySinkNumber plus supportFD."
    - "When keySinkNumber and supportFD are set, split info and batch cache add keySinkNumber to the effective S2 size."
    - "Sink-aware handling chooses keySinkNumber when keySinkNumber and supportFD are set, otherwise sinkNumber."
    - "Sink block accounting applies only when the selected sinkNumber is positive and sparseMode is 4."
  sink_gap_cursor_update:
    - "UpdateCurS2IdxWithSinkNumber skips the masked gap between sink blocks and firstTokenWithSinkNumber when needed."
    - "AssignByBlock and ForceAssign use the sink-aware cursor update only for positive sinkNumber under sparseMode 4."
  evidence:
