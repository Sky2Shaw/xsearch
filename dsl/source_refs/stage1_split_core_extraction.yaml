assignment_phases:
  order:
    - "AssignByBatch"
    - "AssignByRow"
    - "AssignByBlock, only when supportFD is true"
    - "ForceAssign, only when supportFD is true and the current core received no block"
  cost_limit:
    - "Each core uses unassignedCost divided by remaining cores as its current cost limit."
    - "Batch and row phases allow FA tolerance by adding last-block-cost / FA_TOLERANCE_RATIO."
    - "Block phase allows FA tolerance by adding current-block-cost / FA_TOLERANCE_RATIO."
  outputs:
    - "Each core records bN2End, gS1End, s2End, and maxCost."
