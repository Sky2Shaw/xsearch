fd_metadata:
  base_fields:
    - "FlashDecodeResult records FD head indices, S2 split counts, G/S1 split counts, last part sizes, vector end indices, vector split indices, and per-core S2 split start index."
    - "SplitResult records numOfFdHead, maxS2SplitNum, usedVecNumOfFd, and fdRes."
  record_conditions:
    - "FD info is not recorded for core 0."
    - "FD info is not recorded when curKvSplitPart is <= 1."
    - "FD info is delayed when the row needing reduction has not been processed past the previous core endpoint."
  record_payload:
    - "RecordFDInfo stores previous-core bN2 and gS1 endpoints, S2 split count, G/S1 split count, G/S1 last part size, updates maxS2SplitNum, and increments numOfFdHead."
  fd_balancing:
    - "SplitFD totals FD load as s2SplitNumOfFdHead * gS1SplitNumOfFdHead."
    - "Max vector count is min(totalFDHeadSplit, usedCoreNum * vecCubeRatio)."
    - "A vector boundary is emitted when current FD KV split count exceeds remaining vector space multiplied by FD_TOLERANCE_RATIO."
