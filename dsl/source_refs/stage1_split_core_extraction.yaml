dsl_implications:
  - "A DSL model of split-core behavior needs explicit base block sizes for M/S1G and S2 because they drive block counts, tail blocks, and the cost table."
  - "The cost model is discrete and aligned; DSL formulas should use ceil-div by 16 for M and by 64 for S2, then coefficients 6 and 10."
  - "FA assignment uses a tolerance ratio of 2 at batch, row, and block granularity; FD balancing independently uses ratio 2."
  - "Sparse BAND and sink/key-sink behavior can alter effective S2 range, block count, cursor progression, and FD reduction metadata."
  - "supportFD gates block-level assignment, force assignment, FD metadata recording, and post-FA FD vector balancing."

