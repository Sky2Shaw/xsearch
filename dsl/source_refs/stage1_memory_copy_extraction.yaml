    query:
      helper: GetQueryGmFormat
      supported_layouts:
        - {layout: BSH, format: BSNGD}
        - {layout: BNSD, format: BNGSD}
        - {layout: TND, format: TNGD}
        - {layout: NTD, format: NGTD}
