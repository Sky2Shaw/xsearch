        - {name: BNSD, value: 6, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:35}
        - {name: TND, value: 7, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:36}
        - {name: NTD, value: 8, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:37}
        - {name: PA_BnBsND, value: 9, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:38}
        - {name: PA_BnNBsD, value: 10, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:39}
        - {name: PA_NZ, value: 11, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:40}
      auxiliary_formats:
        - {name: NGD, value: 12, role: post_quant, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:41}
        - {name: ND, value: 13, role: antiquant_no_page_attention, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:42}
