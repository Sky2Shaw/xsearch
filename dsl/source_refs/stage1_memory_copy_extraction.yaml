        - {name: TNGD, value: 3, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:32}
        - {name: NGTD, value: 4, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:33}
