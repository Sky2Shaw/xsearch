        - {name: PA_BnNBs, value: 17, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:46}
        - {name: BN2GS1S2, value: 18, role: pse, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:47}
