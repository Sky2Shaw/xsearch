    - {category: GM_KV_TND, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:866}
    - {category: GM_KV_PA_BNBD, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:925}
    - {category: GM_KV_PA_NZ, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:991}
    - {category: GM_POST_QUANT_NGD, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:1072}
    - {category: GM_ANTIQ_ND, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:1123}
    - {category: GM_ANTIQ_BS, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:1163}
    - {category: GM_ANTIQ_BNS, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:1203}
    - {category: GM_ANTIQ_BnBs, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:1253}
    - {category: GM_ANTIQ_BnNBs, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:1297}
    - {category: GM_PSE_BN2GS1S2, evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:1352}

copy_helpers:
  query_gm_to_l1:
    class: CopyQueryGmToL1
    default_l1_format: NZ
    supported_formats: [BSNGD, TNGD, BNGSD, NGTD]
    behavior:
      - BSNGD and TNGD use S1/G splitting.
      - BNGSD chooses GS1 processing when actual sequence lengths are present, otherwise continuous processing.
      - NGTD uses GS1 processing.
    evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:1505
  kv_gm_to_l1:
    class: CopyKvGmToL1
    default_l1_format: NZ
    continuous_or_tensor_list_formats: [BNSD, BSND, NTD, TND]
    page_attention_formats: [PA_BnBsND, PA_BnNBsD, PA_NZ]
    evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:1808
  k_krope_page_attention_gm_to_l1:
    class: CopyKKropePAGmToL1
    supported_formats: [PA_NZ, PA_BnNBsD, PA_BnBsND]
    behavior: Copies K and K-rope page-attention rows with the same block-table driven block index.
    evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:1880
  post_quant_gm_to_ub:
    class: CopyPostQuantGmToUB
    behavior: Computes post-quant per-channel offset and uses ND-to-ND padded copy into UB.
    evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:2103

nd_to_nz_lowering:
  l1_format_enum:
    value: NZ
    evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:1433
  single_matrix:
    helper: CopySingleMatrixNDToNZ
    params: [nValue, dValue, srcDValue, dstNzC0Stride]
    behavior: Builds Nd2NzParams with ndNum 1, row count nValue, column count dValue, source row stride srcDValue, dstNzNStride 1, and zero matrix strides.
    int4_behavior: For int4b_t, dValue and srcDValue are divided by HALF_SIZE_DIVISOR before DataCopy.
    evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:1454
  multi_matrix:
    helper: CopyMultiMatrixNDToNZ
    stride_limit: 65536
    behavior: Falls back to repeated single-matrix ND-to-NZ copies when srcNdMatrixStride exceeds ND_MATRIX_STRIDE_LIMIT.
    evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:1475
  nd_to_nd_copy:
    helper: CopySingleMatrixNDToND
    behavior: Uses DataCopyPad with explicit blockCount, blockLen, srcStride, dstStride, rightPadding, and zero padding.
    evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:2086

dsl_implications:
  - Layout selection is a compile-time choice over FIA_LAYOUT and page-attention state; a DSL schema should represent the query/KV layout and page-attention mode before deriving GmFormat.
  - Offset semantics are category-based, so format categories are the stable DSL grouping for stride and offset rules.
  - L1 query/KV copies lower GM ND-like layouts to NZ tiles; ND-to-NZ row count, D extent, source stride, and destination NZ C0 stride are explicit scheduling parameters.
  - Page-attention KV copies may be physically PA_NZ or ND-like page layouts; PA_NZ uses DataCopyParams directly, while other page layouts route through ND-to-NZ lowering.
  - Anti-quant, post-quant, and PSE formats share the same common enum and category dispatch, so they should not be modeled as unrelated ad hoc layouts.

