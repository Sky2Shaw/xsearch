    name: FormatCategory
    evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:516
    values:
      - GM_Q_OUT_BNGSD
      - GM_Q_OUT_TND
      - GM_KV_BNSD
      - GM_KV_TND
      - GM_KV_PA_BNBD
      - GM_KV_PA_NZ
      - GM_POST_QUANT_NGD
      - GM_ANTIQ_ND
      - GM_ANTIQ_BS
      - GM_ANTIQ_BNS
      - GM_ANTIQ_BnBs
      - GM_ANTIQ_BnNBs
      - GM_PSE_BN2GS1S2

layout_params:
  mapping_rule:
    description: GmLayoutParams maps each GmFormat specialization to exactly one FormatCategory.
    evidence: inference/ascendc/src/ops-transformer/attention/common/op_kernel/memory_copy.h:533
  mappings:
    GM_Q_OUT_BNGSD: [BSNGD, BNGSD, NGBSD]
    GM_Q_OUT_TND: [TNGD, NGTD]
    GM_KV_BNSD: [BSND, BNSD]
    GM_KV_TND: [TND, NTD]
    GM_KV_PA_BNBD: [PA_BnBsND, PA_BnNBsD]
    GM_KV_PA_NZ: [PA_NZ]
    GM_POST_QUANT_NGD: [NGD]
    GM_ANTIQ_ND: [ND]
    GM_ANTIQ_BS: [BS2]
    GM_ANTIQ_BNS: [BNS2]
    GM_ANTIQ_BnBs: [PA_BnBs]
    GM_ANTIQ_BnNBs: [PA_BnNBs]
    GM_PSE_BN2GS1S2: [BN2GS1S2]

offset_calculators:
