validator_seed:
  status: ready_for_stage2_ingestion
  source: constraints/constraints.yaml + risks/risks.yaml normalized after review
  count: 25
  notes:
  - Predicates are intentionally draft-level. Stage-2 should convert each predicate_draft into executable validator code or
    schema constraints.
  - Use source_evidence_ids to preserve traceability when implementing validators.
  - The module field is the proposed ATDSL owner for each validator.
  validators:
  - id: v-template-identity
    constraint_id: C-TEMPLATE-IDENTITY
    module: pipeline.stage_graph
    severity: hard
    inputs:
    - pipeline.stage_graph.stages[].canonical_name
    - pipeline.stage_graph.stages[].owner
    - pipeline.stage_graph.stage_aliases
    predicate_draft: same_named_stage implies same(canonical_name, owner, owner_qualified, template_identity) unless represented
      by explicit stage_alias
    error_message: Same-name stage functions must preserve canonical_name, owner, owner_qualified, and template identity.
    source_evidence_ids: []
    related_forbidden_transform_ids:
    - FT-NO-MM2-OWNER-COLLAPSE
    related_risk_ids:
    - R-MM2-OWNER-COLLAPSE
    stage2_status: predicate_seed_ready
    original_constraint: Same-name stage functions must preserve canonical_name, owner, owner_qualified, and template identity.
  - id: v-workspace-contiguous-abi
    constraint_id: C-WORKSPACE-CONTIGUOUS-ABI
    module: workspace.layout
    severity: hard
    inputs:
    - host.workspace_size_formula
    - kernel.init_workspace_binding
    - workspace.regions
    predicate_draft: region_order(host)==region_order(kernel) and region_size(host,r)==region_stride(kernel,r)
    error_message: Host and kernel must preserve the contiguous normal workspace order mm1 -> vec1 -> mm2 -> vec2 and append
      FD regions only with synchronized ABI updates.
    source_evidence_ids:
    - SE-WORKSPACE-NORMAL-SIZE
    - SE-WORKSPACE-NORMAL-ABI
    - SE-WORKSPACE-FD-SIZE-NONQUANT
    - SE-WORKSPACE-FD-SIZE-MLA
    related_forbidden_transform_ids:
    - FT-NO-WORKSPACE-REGION-REORDER-WITHOUT-ABI-UPDATE
    related_risk_ids:
    - R-WORKSPACE-ABI-DRIFT
    stage2_status: predicate_seed_ready
    original_constraint: Host and kernel must preserve the contiguous normal workspace order mm1 -> vec1 -> mm2 -> vec2 and
      append FD regions only with synchronized ABI updates.
  - id: v-gqa-mm2-sync
    constraint_id: C-GQA-MM2-SYNC
    module: memory.l1_residency
    severity: hard
    inputs:
    - pipeline.events
    - memory.l1_residency.objects[v_tile]
    - gqa.mm2
    predicate_draft: gqa.mm2 waits syncV1C2 and sets syncC2V2 and releases V_EVENT only after last consumer
    error_message: GQA MM2 must wait syncV1C2, preserve the V reuse/release guard, and set syncC2V2 around PV compute.
    source_evidence_ids:
    - SE-GQA-V-L1-RELEASE
    related_forbidden_transform_ids:
    - FT-NO-MM2-OWNER-COLLAPSE
    - FT-NO-ELIDE-GQA-V-L1-RELEASE
    related_risk_ids:
    - R-GQA-V-L1-LIFETIME
    stage2_status: predicate_seed_ready
    original_constraint: GQA MM2 must wait syncV1C2, preserve the V reuse/release guard, and set syncC2V2 around PV compute.
  - id: v-mla-mm2-nupdate
    constraint_id: C-MLA-MM2-NUPDATE
    module: mla.nupdate
    severity: hard
    inputs:
    - pipeline.events
    - mla.nupdate.atomic_target
    - mla.mm2
    predicate_draft: mla.mm2 first fixpipe waits syncV1NupdateC2 before consuming corrected data
    error_message: MLA MM2 must wait syncV1NupdateC2 before the first fixpipe that consumes corrected data.
    source_evidence_ids:
    - SE-MLA-NUPDATE-BARRIER
    related_forbidden_transform_ids:
    - FT-NO-REORDER-MLA-NUPDATE-BARRIER
    related_risk_ids:
    - R-MLA-MM2-ATOMIC
    - R-MLA-NUPDATE-NUMERIC
    stage2_status: predicate_seed_ready
    original_constraint: MLA MM2 must wait syncV1NupdateC2 before the first fixpipe that consumes corrected data.
  - id: v-mla-nupdate-first-loop
    constraint_id: C-MLA-NUPDATE-FIRST-LOOP
    module: mla.nupdate
    severity: hard
    inputs:
    - mla.nupdate.loop_index
    - mla.nupdate.m_partition
    predicate_draft: ProcessAmlaNupdate is skipped on first S-inner loop and only runs for non_empty_m partitions on later
      loops
    error_message: ProcessAmlaNupdate must skip the first S-inner loop and only apply correction on later loops with non-empty
      M partitions.
    source_evidence_ids:
    - SE-MLA-NUPDATE-ATOMIC-TARGET
    related_forbidden_transform_ids:
    - FT-NO-REORDER-MLA-NUPDATE-BARRIER
    related_risk_ids:
    - R-MLA-NUPDATE-NUMERIC
    stage2_status: predicate_seed_ready
    original_constraint: ProcessAmlaNupdate must skip the first S-inner loop and only apply correction on later loops with
      non-empty M partitions.
  - id: v-event-order-runinfo
    constraint_id: C-EVENT-ORDER-RUNINFO
    module: pipeline.scheduler
    severity: hard
    inputs:
    - pipeline.scheduler.runinfo_slots
    - pipeline.stage_graph
    - pipeline.events
    predicate_draft: ExecuteTask preserves current MM1, older Vec1/MM2, previous Vec2 slot ordering; slot invalidation happens
      only after all consumers finish
    error_message: ExecuteTask must preserve current-slot MM1, older-slot Vec1/MM2, and previous-slot Vec2 ordering, and may
      invalidate a slot only after Vec2 completes.
    source_evidence_ids:
    - SE-RUNINFO-THREE-STAGE-RING-NONQUANT
    - SE-RUNINFO-THREE-STAGE-RING-MLA
    related_forbidden_transform_ids:
    - FT-NO-RUNINFO-STAGE-REORDER
    related_risk_ids:
    - R-RUNINFO-STAGE-REORDER-DEADLOCK
    stage2_status: predicate_seed_ready
    original_constraint: ExecuteTask must preserve current-slot MM1, older-slot Vec1/MM2, and previous-slot Vec2 ordering,
      and may invalidate a slot only after Vec2 completes.
  - id: v-vev-ub-alignment
    constraint_id: C-VEC-UB-ALIGNMENT
    module: memory.ub_alignment
    severity: hard
    inputs:
    - shape_layout.derived.head_dim_align
    - vector.mSplitSize
    - memory.copy
    predicate_draft: mSplitSize and headDimAlign keep 32B-safe UB accesses and copy-out strides
    error_message: Vec1 and Vec2 must keep 32B-safe mSplitSize rounding and headDimAlign-based workspace stride so UB accesses
      and copy-out padding remain valid.
    source_evidence_ids:
    - SE-VEC1-UB-ALIGNMENT
    - SE-VEC2-UB-ALIGNMENT
    - SE-KNOB-HEADDIM-ALIGN
    related_forbidden_transform_ids:
    - FT-NO-VEC-TILE-ALIGNMENT-DRIFT
    related_risk_ids:
    - R-UB-ALIGNMENT-DRIFT
    stage2_status: predicate_seed_ready
    original_constraint: Vec1 and Vec2 must keep 32B-safe mSplitSize rounding and headDimAlign-based workspace stride so UB
      accesses and copy-out padding remain valid.
  - id: v-invalid-row-lse-correction
    constraint_id: C-INVALID-ROW-LSE-CORRECTION
    module: sparse.policy
    severity: hard
    inputs:
    - sparse.policy.invalid_row_rule
    - compute.softmax_lse.export
    predicate_draft: invalid rows trigger AdjustSoftMaxRes before final softmaxLse export on last S2 loop
    error_message: When sparse or mask rules produce invalid rows, AdjustSoftMaxRes must run before final softmaxLse export
      on the last S2 loop.
    source_evidence_ids:
    - SE-VEC1-SINK-SOFTMAX
    related_forbidden_transform_ids:
    - FT-NO-INVALID-ROW-CORRECTION-BYPASS
    related_risk_ids:
    - R-INVALID-ROW-SEMANTIC-DRIFT
    - R-COMMON-INVALID-ROW-HANDLING-LOST
    stage2_status: predicate_seed_ready
    original_constraint: When sparse or mask rules produce invalid rows, AdjustSoftMaxRes must run before final softmaxLse
      export on the last S2 loop.
  - id: v-vec2-partial-ring-separation
    constraint_id: C-VEC2-PARTIAL-RING-SEPARATION
    module: workspace.layout
    severity: hard
    inputs:
    - workspace.regions.vec2ResGm
    - pipeline.scheduler.preload_slots
    predicate_draft: Vec2 reads previous preload slot and writes current slot; current and previous vec2ResGm offsets are
      disjoint
    error_message: Vec2 must read the previous preload-slot partial and write the current slot; current and previous vec2ResGm
      slots must remain distinct.
    source_evidence_ids:
    - SE-SHARED-VEC2-CONTRACT
    - SE-KNOB-PRELOAD-NUM
    related_forbidden_transform_ids:
    - FT-NO-VEC2-RING-SLOT-COLLAPSE
    related_risk_ids:
    - R-SPLITKV-PARTIAL-COLLISION
    stage2_status: predicate_seed_ready
    original_constraint: Vec2 must read the previous preload-slot partial and write the current slot; current and previous
      vec2ResGm slots must remain distinct.
  - id: v-fd-metadata
    constraint_id: C-FD-METADATA
    module: flash_decode.metadata_bridge
    severity: hard
    inputs:
    - flash_decode.metadata_bridge.fdparams
    - kernel.flash_decode.consumer
    predicate_draft: all FD consumer fields are produced by host bridge with matching array length and ordering
    error_message: FlashDecode requires fdParams metadata arrays that map per-core split-KV ranges plus usedVecNumOfFd bounds.
    source_evidence_ids:
    - SE-FD-METADATA-PARTITION
    related_forbidden_transform_ids:
    - FT-NO-REORDER-FD-MERGE-WEIGHT-FORMULA
    - FT-NO-FD-METADATA-PARTITION-LOSS
    related_risk_ids:
    - R-FD-METADATA-DESYNC
    - R-COMMON-FD-METADATA-MISMATCH
    stage2_status: predicate_seed_ready
    original_constraint: FlashDecode requires fdParams metadata arrays that map per-core split-KV ranges plus usedVecNumOfFd
      bounds.
  - id: v-fd-used-vev-bounds
    constraint_id: C-FD-USED-VEC-BOUNDS
    module: flash_decode.metadata_bridge
    severity: hard
    inputs:
    - fdparams.usedVecNumOfFd
    - fdparams.arrays
    predicate_draft: 0 <= usedVecNumOfFd <= len(fdRes arrays) and active AIV consumers are bounded by usedVecNumOfFd
    error_message: Host SetSplitOutput and kernel FlashDecode readers must agree on usedVecNumOfFd and fdRes array lengths
      and ordering.
    source_evidence_ids:
    - SE-SPLIT-CORE-OUTPUT-BRIDGE
    - SE-FD-METADATA-PARTITION
    related_forbidden_transform_ids:
    - FT-NO-FD-METADATA-PARTITION-LOSS
    related_risk_ids:
    - R-FD-METADATA-DESYNC
    stage2_status: predicate_seed_ready
    original_constraint: Host SetSplitOutput and kernel FlashDecode readers must agree on usedVecNumOfFd and fdRes array lengths
      and ordering.
  - id: v-workspace-mla-fd
    constraint_id: C-WORKSPACE-MLA-FD
    module: workspace.mla_tail
    severity: hard
    inputs:
    - host.workspace_size_formula
    - kernel.workspace_binding
    - workspace.mla.tail_regions
    predicate_draft: MLA extra nUpdate/softmaxSum bytes remain budget-only unless explicit kernel GM binding evidence exists
    error_message: MLA host sizing reserves extra nUpdate and softmaxSum bytes, but current kernel bindings expose nUpdate
      through normal.mm2 int32 aliasing and no dedicated aMlaSum GM tail.
    source_evidence_ids:
    - SE-WORKSPACE-MLA-ABI
    - SE-WORKSPACE-MLA-INIT-ORDER
    - SE-MLA-MM2-INT32-ALIAS
    - SE-MLA-AMLASUM-UB-ONLY
    related_forbidden_transform_ids:
    - FT-NO-LOWER-MLA-BUDGET-TAIL-AS-BOUND-GM
    related_risk_ids:
    - R-MLA-TAIL-BUDGET-MISMODELED
    stage2_status: predicate_seed_ready
    original_constraint: MLA host sizing reserves extra nUpdate and softmaxSum bytes, but current kernel bindings expose nUpdate
      through normal.mm2 int32 aliasing and no dedicated aMlaSum GM tail.
  - id: v-workspace-mla-nupdate-stub
    constraint_id: C-WORKSPACE-MLA-NUPDATE-STUB
    module: workspace.mla_tail
    severity: hard
    inputs:
    - workspace.mla.tail_regions.nupdate
    - mla.nupdate.atomic_target
    predicate_draft: nUpdate tail region binding_status in {host_budget_only_stub, alias} and aliases normal.mm2 int32 path
    error_message: MLA nUpdate budget bytes must be modeled as a host-budget-only stub whose observed runtime consumer is
      the normal.mm2 mm2ResInt32Gm alias, not a standalone GM tail.
    source_evidence_ids:
    - SE-WORKSPACE-MLA-ABI
    - SE-WORKSPACE-MLA-INIT-ORDER
    - SE-MLA-MM2-INT32-ALIAS
    - SE-MLA-NUPDATE-ATOMIC-TARGET
    related_forbidden_transform_ids:
    - FT-NO-LOWER-MLA-BUDGET-TAIL-AS-BOUND-GM
    related_risk_ids:
    - R-MLA-NUPDATE-TAIL-MISLOWERED
    stage2_status: predicate_seed_ready
    original_constraint: MLA nUpdate budget bytes must be modeled as a host-budget-only stub whose observed runtime consumer
      is the normal.mm2 mm2ResInt32Gm alias, not a standalone GM tail.
  - id: v-workspace-mla-softmax-sum-ub
    constraint_id: C-WORKSPACE-MLA-SOFTMAX-SUM-UB
    module: workspace.mla_tail
    severity: hard
    inputs:
    - workspace.mla.tail_regions.softmax_sum
    - mla.softmax_sum.local_buffer_bridge
    predicate_draft: softmaxSum tail region binding_status==local_ub_state or host_budget_only_stub and has no standalone
      GM producer/consumer
    error_message: MLA softmaxSum budget bytes must be modeled as a host-budget-only stub whose observed producer and consumer
      communicate through aMlaSumUb local UB state.
    source_evidence_ids:
    - SE-WORKSPACE-MLA-ABI
    - SE-WORKSPACE-MLA-INIT-ORDER
    - SE-MLA-AMLASUM-UB-ONLY
    - SE-MLA-SOFTMAX-SUM-GEN
    - SE-MLA-SOFTMAX-SUM-CONSUME
    related_forbidden_transform_ids:
    - FT-NO-LOWER-MLA-BUDGET-TAIL-AS-BOUND-GM
    related_risk_ids:
    - R-MLA-SOFTMAX-SUM-GM-INVENTED
    stage2_status: predicate_seed_ready
    original_constraint: MLA softmaxSum budget bytes must be modeled as a host-budget-only stub whose observed producer and
      consumer communicate through aMlaSumUb local UB state.
  - id: v-shape-layout-contract
    constraint_id: C-SHAPE-LAYOUT-CONTRACT
    module: shape_layout.contract
    severity: hard
    inputs:
    - shape_layout.query_layout_families
    - shape_layout.attention_out_layouts
    - shape_layout.softmax_lse_layouts
    predicate_draft: host infer-shape and kernel exporters use the same canonical layout-family mapping and offset rules
    error_message: Host infer-shape, MLA softmaxLse export, and FlashDecode final copy-out must preserve the same canonical
      layout-family mapping for query axes, attentionOut shapes, and softmaxLse ranks.
    source_evidence_ids:
    - SE-SHAPE-LAYOUT-CONTRACT
    - SE-MLA-LSE-LAYOUT-COPY
    - SE-FD-OUTPUT-LAYOUTS
    - SE-TEST-INFER-SHAPE-LAYOUTS
    related_forbidden_transform_ids: []
    related_risk_ids:
    - R-SHAPE-LAYOUT-CONTRACT-DRIFT
    stage2_status: predicate_seed_ready
    original_constraint: Host infer-shape, MLA softmaxLse export, and FlashDecode final copy-out must preserve the same canonical
      layout-family mapping for query axes, attentionOut shapes, and softmaxLse ranks.
  - id: v-sparse-policy-contract
    constraint_id: C-SPARSE-POLICY-CONTRACT
    module: sparse.policy
    severity: hard
    inputs:
    - sparse.policy.mode
    - sparse.policy.preToken
    - sparse.policy.nextToken
    - sparse.policy.sink_adjustments
    predicate_draft: host maskParams packing equals kernel sparse/invalid-row interpretation for mode, preToken, nextToken
      and sink rules
    error_message: Host maskParams packing and kernel sparse branches must preserve sparseMode, preToken, nextToken, sink
      adjustments, and isRowInvalid semantics.
    source_evidence_ids:
    - SE-SPARSE-MASK-PARAMS
    - SE-SPARSE-LEFTUP-INVALID-ROW
    - SE-FD-SPARSE-POLICY
    - SE-VEC1-SINK-SOFTMAX
    - SE-TEST-TILING-SINK-CONSTRAINTS
    - SE-TEST-ST-EAGER-REFERENCE
    related_forbidden_transform_ids:
    - FT-NO-INVALID-ROW-CORRECTION-BYPASS
    related_risk_ids:
    - R-SPARSE-POLICY-DESYNC
    stage2_status: predicate_seed_ready
    original_constraint: Host maskParams packing and kernel sparse branches must preserve sparseMode, preToken, nextToken,
      sink adjustments, and isRowInvalid semantics.
  - id: v-split-core-fd-bridge
    constraint_id: C-SPLIT-CORE-FD-BRIDGE
    module: flash_decode.metadata_bridge
    severity: hard
    inputs:
    - split_core.input_contract
    - split_core.output_bridge
    - flash_decode.metadata_bridge
    predicate_draft: split_core input fields, SetSplitOutput bridge, and FlashDecode fdparams consumers preserve mBaseSize/s2BaseSize/gS1BaseSizeOfFd
      semantics
    error_message: split_core input params, host SetSplitOutput, and kernel FlashDecode consumers must preserve mBaseSize,
      s2BaseSize, gS1BaseSizeOfFd, usedVecNumOfFd, and fdRes array ordering.
    source_evidence_ids:
    - SE-SPLIT-CORE-INPUT-PARAMS
    - SE-SPLIT-CORE-INPUT-PARAMS-MLA
    - SE-SPLIT-CORE-OUTPUT-BRIDGE
    - SE-SPLIT-CORE-OUTPUT-BRIDGE-MLA
    - SE-FD-METADATA-PARTITION
    - SE-FD-METADATA-PARTITION-MLA
    related_forbidden_transform_ids:
    - FT-NO-FD-METADATA-PARTITION-LOSS
    related_risk_ids:
    - R-SPLIT-CORE-RANGE-DESYNC
    - R-COMMON-FD-METADATA-MISMATCH
    stage2_status: predicate_seed_ready
    original_constraint: split_core input params, host SetSplitOutput, and kernel FlashDecode consumers must preserve mBaseSize,
      s2BaseSize, gS1BaseSizeOfFd, usedVecNumOfFd, and fdRes array ordering.
  - id: v-split-core-range-order
    constraint_id: C-SPLIT-CORE-RANGE-ORDER
    module: split_core.range_assignment
    severity: hard
    inputs:
    - split_core.range_assignments
    - flash_decode.metadata_bridge.fdparams
    predicate_draft: producer output order == host copied order == kernel FD consumer order for bn2/gs1/s2 ranges
    error_message: split_core producer output, host bridge copies, and kernel FlashDecode consumers must preserve fdRes array
      ordering and per-core BN2/GS1/S2 range semantics.
    source_evidence_ids:
    - SE-SPLIT-CORE-INPUT-PARAMS
    - SE-SPLIT-CORE-INPUT-PARAMS-MLA
    - SE-SPLIT-CORE-OUTPUT-BRIDGE
    - SE-SPLIT-CORE-OUTPUT-BRIDGE-MLA
    - SE-FD-METADATA-PARTITION
    - SE-FD-METADATA-PARTITION-MLA
    related_forbidden_transform_ids:
    - FT-NO-FD-METADATA-PARTITION-LOSS
    related_risk_ids:
    - R-SPLIT-CORE-RANGE-DESYNC
    stage2_status: predicate_seed_ready
    original_constraint: split_core producer output, host bridge copies, and kernel FlashDecode consumers must preserve fdRes
      array ordering and per-core BN2/GS1/S2 range semantics.
  - id: v-scalar-offset-consistency
    constraint_id: C-SCALAR-OFFSET-CONSISTENCY
    module: scalar.offset_rules
    severity: hard
    inputs:
    - scalar.offset_rules
    - workspace.layout
    - shape_layout.derived.head_dim_align
    predicate_draft: FD taskOffset, partial output offsets, preload slot reload bases, and atomic MM2 bases use the same task/split/row/headDimAlign
      strides
    error_message: FD taskOffset prefix sums, preload-slot reload bases, atomic MM2 bases, and headDimAlign padded strides
      must stay consistent across MLA Vec2, MLA nUpdate, and FlashDecode.
    source_evidence_ids:
    - SE-FD-TASK-OFFSET-SCALARS
    - SE-MLA-NUPDATE-ATOMIC-TARGET
    - SE-MLA-VEC2-NORMALIZE-COPY
    - SE-KNOB-HEADDIM-ALIGN
    related_forbidden_transform_ids:
    - FT-NO-WORKSPACE-REGION-REORDER-WITHOUT-ABI-UPDATE
    - FT-NO-VEC2-RING-SLOT-COLLAPSE
    related_risk_ids:
    - R-WORKSPACE-ABI-DRIFT
    - R-FD-LSE-MERGE
    stage2_status: predicate_seed_ready
    original_constraint: FD taskOffset prefix sums, preload-slot reload bases, atomic MM2 bases, and headDimAlign padded strides
      must stay consistent across MLA Vec2, MLA nUpdate, and FlashDecode.
  - id: v-common-split-core-cost-range
    constraint_id: C-COMMON-SPLIT-CORE-COST-RANGE
    module: split_core.planner_contract
    severity: hard
    inputs:
    - split_core.cost_model
    - split_core.core_search_bounds
    - split_core.assignment_phases
    predicate_draft: Stage-2 preserves common split-core cost/tolerance/core-search/sparse-sink/key-sink/assignment semantics
    error_message: Stage-2 split-core lowering must preserve the common discrete cost model, FA/FD tolerance ratios, sparse/sink/key-sink
      S2 range shaping, supportFD-gated assignment phases, and FD metadata generation.
    source_evidence_ids:
    - SE-COMMON-SPLIT-CORE-CPP
    - SE-COMMON-SPLIT-CORE-H
    related_forbidden_transform_ids:
    - FT-NO-FD-METADATA-PARTITION-LOSS
    related_risk_ids:
    - R-COMMON-SPLIT-CORE-MODEL-OMITTED
    stage2_status: predicate_seed_ready
    original_constraint: Stage-2 split-core lowering must preserve the common discrete cost model, FA/FD tolerance ratios,
      sparse/sink/key-sink S2 range shaping, supportFD-gated assignment phases, and FD metadata generation.
  - id: v-common-shape-layout-validation
    constraint_id: C-COMMON-SHAPE-LAYOUT-VALIDATION
    module: shape_layout.contract
    severity: hard
    inputs:
    - shape_layout.axis_map
    - shape_layout.derived_dims
    - shape_layout.nz_packing
    predicate_draft: common axis maps, H=N*D/D derivation, NZ packing, and compare modes are validated before lowering
    error_message: Shape validation must use the common ordered layout axis map, derived H=N*D and D derivation rules, NZ
      {Bn,N,D/D0,Bs,D0} packing with D0=16, and per-axis compare modes including IGNORE_INPUT.
    source_evidence_ids:
    - SE-COMMON-FIA-TILING-SHAPE-CPP
    - SE-COMMON-FIA-TILING-SHAPE-H
    - SE-COMMON-FIA-TILING-INFO-H
    related_forbidden_transform_ids: []
    related_risk_ids:
    - R-COMMON-SHAPE-LAYOUT-VALIDATION-OMITTED
    stage2_status: predicate_seed_ready
    original_constraint: Shape validation must use the common ordered layout axis map, derived H=N*D and D derivation rules,
      NZ {Bn,N,D/D0,Bs,D0} packing with D0=16, and per-axis compare modes including IGNORE_INPUT.
  - id: v-common-gm-format-offset-copy
    constraint_id: C-COMMON-GM-FORMAT-OFFSET-COPY
    module: memory.gm_copy
    severity: hard
    inputs:
    - memory.gm_format
    - memory.offset_calculator
    - memory.copy
    predicate_draft: GM copy lowering derives GmFormat from layout/page-attention state and preserves FormatCategory-specific
      offset/copy rules
    error_message: GM copy lowering must derive GmFormat from layout and page-attention state, group offsets by FormatCategory,
      and preserve ND-to-NZ row count, D extent, source stride, destination NZ C0 stride, int4 divisor, and large-stride fallback
      behavior.
    source_evidence_ids:
    - SE-COMMON-MEMORY-COPY-H
    related_forbidden_transform_ids:
    - FT-NO-WORKSPACE-REGION-REORDER-WITHOUT-ABI-UPDATE
    related_risk_ids:
    - R-COMMON-GM-OFFSET-COPY-MISLOWERED
    stage2_status: predicate_seed_ready
    original_constraint: GM copy lowering must derive GmFormat from layout and page-attention state, group offsets by FormatCategory,
      and preserve ND-to-NZ row count, D extent, source stride, destination NZ C0 stride, int4 divisor, and large-stride fallback
      behavior.
  - id: v-common-vector-repeat-and-invalid-rows
    constraint_id: C-COMMON-VECTOR-REPEAT-AND-INVALID-ROWS
    module: compute.vector_common
    severity: hard
    inputs:
    - compute.vector.repeat_stride
    - compute.invalid_row_helpers
    - pipeline.events.PIPE_V
    predicate_draft: vector lowering preserves repeat-stride thresholds, MAX_VALID_LENGTH split reductions, PIPE_V barriers,
      and invalid-row helpers
    error_message: Vector lowering must preserve repeat-stride thresholds, MAX_VALID_LENGTH split reductions with PIPE_V barriers,
      safe active-token clamping from actual sequence lengths, and sparse-mode-specific invalid-row handling.
    source_evidence_ids:
    - SE-COMMON-VECTOR-COMMON-H
    related_forbidden_transform_ids:
    - FT-NO-INVALID-ROW-CORRECTION-BYPASS
    related_risk_ids:
    - R-COMMON-INVALID-ROW-HANDLING-LOST
    stage2_status: predicate_seed_ready
