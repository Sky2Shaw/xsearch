  evidence: reports/critical_path_annotations.yaml
  confidence: high
  producer_location: op_kernel/fia_kernel_nonquant_sink.h::ComputeVec1 / ComputeVec2
  consumer_location: dsl/shared_stage_aliases.yaml and shared Vec deep annotations
  missing_stage2_fields:
  - pipeline.stage_aliases[].alias_stage
  - pipeline.stage_aliases[].shared_owner
  - pipeline.stage_aliases[].producer_stages
  - pipeline.stage_aliases[].consumer_stages
  temporary_schema_stub:
    artifact: dsl/shared_stage_aliases.yaml
    status: ready_for_ingestion
- path: mla.nupdate.numeric_contract
