version: 0.9-card-driven-execution
kind: atdsl.optimization_card_catalog
card_design_policy:
  one_card_one_pattern: true
  flow_group_required: true
  card_type_required: true
  tiling_split_core_cards_required: true
  direct_source_rewrite_allowed_only_when: card_type in [optimization_pattern, planner_generated_candidate] and binding reviewed and lowering
    mode permits source_rewrite
  card_to_dsl_mapping_required: true
  schedule_point_link_required_for_executable_cards: true
  guard_cards_must_attach_verifier_and_test_contracts: true
flow_groups:
- id: HOST_API
  order: 0
  description: API preprocessing, optional outputs, shape/layout metadata guards.
- id: TILING_SPLIT_CORE
  order: 1
  description: Host tiling, split-core cost/search, sparse range assignment, FD partition metadata.
- id: C1
  order: 2
  description: Cube stage 1 / MM1 score production and L1 packing/residency.
- id: V1
  order: 3
  description: Vector stage 1 / softmax, sink semantics, invalid-row and LSE state.
- id: C2
  order: 4
  description: Cube stage 2 / MM2 value accumulation and MLA nUpdate barriers.
- id: V2
  order: 5
  description: Vector stage 2 / output, normalization, layout-aware copyout.
- id: FLASH_DECODE
  order: 6
  description: FD metadata, task mapping, stable merge, LSE weighted reduction.
- id: WORKSPACE
  order: 7
  description: Concrete workspace ABI, normal/MLA/FD regions, alias and budget guards.
- id: PIPELINE
  order: 8
  description: RunInfo / stage ring scheduler and event ordering.
- id: SCALAR
  order: 9
  description: Offset formula, preload-ring indexing, hoist candidates requiring review.
- id: COMMON_MEMORY_COPY
  order: 10
  description: GM format, offset calculator, ND-to-NZ and copy helper contracts.
- id: COMMON_RUNTIME
  order: 11
  description: Buffer manager, event policy, hard-event legality.
optimization_cards:
- id: OC-GQA-MM2-L1-V-REUSE
  canonical_name: gqa.mm2.v_l1_snapshot_reuse
  aliases:
  - gqa_v_l1_reuse
  - vL1Snapshot_reuse
  title: GQA MM2 reuses V L1 tiles across M slices
  applies_to:
    variants:
    - gqa
    owners:
    - FiaBlockCubeNonQuantGqa<FIAT,Config>
    stages:
    - gqa.mm2
  pattern_summary: ComputeMm2 caches V tiles in vL1Snapshot while streaming P from the shared Vec1 workspace ring, and only releases V_EVENT when
    full-load reuse is impossible or the M-slice tail is reached.
  optimization_intent: Reduce V reload traffic without violating the V_EVENT lifetime contract.
  preconditions:
  - GQA cube MM2 is consuming Vec1-generated P tiles.
  - V reuse is keyed by batch/head/S2 coordinate and canFullLoadV remains true for the current KL1 slice set.
  tunable_knobs:
  - s2BaseSize
  - preLoadNum
  constraints:
  - C-GQA-MM2-SYNC
  risks:
  - R-GQA-V-L1-LIFETIME
  possible_dsl_fields:
  - path: memory.l1.gqa.v_snapshot_signature
    meaning: Coordinate key and reuse scope for V L1 caching across M slices.
  - path: pipeline.stage_graph.edges[].sync_signal
    meaning: syncV1C2 and syncC2V2 ordering around the GQA MM2 producer/consumer boundary.
  lowering_hint: Lower as an owner-qualified GQA MM2 policy; do not fold it into the generic MM2 stage or drop the reuse/release guard.
  source_evidence:
  - id: SE-GQA-V-L1-RELEASE
    role: V snapshot reuse and release condition inside GQA ComputeMm2.
  confidence: high
  flow_group: C2
  card_type: optimization_pattern
  pipeline_position: C2.GQA.MM2
  granularity: stage_card
  agent_usage:
  - stage2_strategy_seed
  related_cards:
  - OC-GQA-MM1-Q-L1-SNAPSHOT-REUSE
- id: OC-MLA-MM2-NUPDATE-BARRIER
  canonical_name: mla.mm2.first_fixpipe_wait_nupdate
  aliases:
  - mla_mm2_nupdate_barrier
  - syncV1NupdateC2_guard
  title: MLA MM2 waits for nUpdate before first fixpipe
  applies_to:
    variants:
    - mla
    owners:
    - FiaBlockCubeNonQuantMla<FIAT>
    stages:
    - mla.mm2
    - mla.mm2.process
  pattern_summary: MLA MM2 delays the first fixpipe until syncV1NupdateC2 is observed, so the Vec1-side atomic correction into mm2ResInt32Gm is
    visible before MM2 output is committed.
  optimization_intent: Preserve correctness of MLA online-softmax correction while keeping MM2 and Vec1 overlapped.
  preconditions:
  - MLA path is active and the current tile reaches the first complete K-slice for the first nL1 and mL1 block.
  - ProcessAmlaNupdate has a non-empty M partition and the current S-inner loop is not the first one.
  tunable_knobs:
  - nBufferMBaseSize
  - preLoadNum
  constraints:
  - C-MLA-MM2-NUPDATE
  - C-MLA-NUPDATE-FIRST-LOOP
  risks:
  - R-MLA-NUPDATE-NUMERIC
  - R-MLA-MM2-ATOMIC
  possible_dsl_fields:
  - path: mla.nupdate.mm2_sync
    meaning: Explicit wait edge from Vec1-side nUpdate apply to the first MM2 fixpipe.
  - path: mla.nupdate.atomic_target
    meaning: MM2 int32 alias location that receives the broadcast correction.
  lowering_hint: Keep the wait, atomic add, and first-fixpipe condition in one lowering rule; splitting them loses the correctness fence.
  source_evidence:
  - id: SE-MLA-NUPDATE-BARRIER
    role: MM2 wait condition before the first fixpipe.
  - id: SE-MLA-NUPDATE-ATOMIC-TARGET
    role: Vec1-side atomic add target and row-group broadcast behavior.
  confidence: high
  flow_group: C2
  card_type: correctness_guard
  pipeline_position: C2.MLA.MM2
  granularity: stage_card
  agent_usage:
  - stage2_strategy_seed
  related_cards:
  - OC-MLA-MM1-ROPE-NOPE-L1-PACKING
- id: OC-MLA-NUPDATE-SIDECHANNEL
  canonical_name: mla.vec1.nupdate_side_channel
  aliases:
  - mla_nupdate
  - mla_softmax_row_correction
  title: MLA vector stage emits row-wise nUpdate side channel
  applies_to:
    variants:
    - mla
    owners:
    - FiaBlockVecNonQuantMla<FIAT>
    stages:
    - mla.vec1
    - mla.nupdate.compute
    - mla.nupdate.apply
  pattern_summary: AmlaVecCompute derives row-wise nUpdate and aMlaSum from online softmax state, then ProcessAmlaNupdate broadcasts 128-lane
    int32 corrections and atomically injects them into the MM2 int32 alias.
  optimization_intent: Preserve MLA-specific numeric correction without materializing a separate GM reduction pass.
  preconditions:
  - MLA Vec1 path is active.
  - ProcessAmlaNupdate runs only after the first S-inner loop and only when vecDealM is non-zero.
  - headDim is consumed in 128-lane groups for the int32 broadcast/add path.
  tunable_knobs:
  - nBufferMBaseSize
  - preLoadNum
  constraints:
  - C-MLA-NUPDATE-FIRST-LOOP
  - C-MLA-MM2-NUPDATE
  risks:
  - R-MLA-NUPDATE-NUMERIC
  possible_dsl_fields:
  - path: mla.nupdate.compute_formula
    meaning: Ordered n/cof/eps/clamp/scale sequence used to derive the correction term.
  - path: mla.nupdate.broadcast_group
    meaning: 128-lane int32 broadcast granularity for the atomic apply path.
  - path: mla.nupdate.atomic_target
    meaning: The correction is applied through mm2ResInt32Gm, not through a dedicated MLA-only GM tail buffer.
  lowering_hint: Treat compute and apply as one side-channel contract; lowering only AmlaVecCompute or only ProcessAmlaNupdate is incomplete.
  source_evidence:
  - id: SE-MLA-NUPDATE-ATOMIC-TARGET
    role: Atomic-add path and 128-lane broadcast contract.
  - id: SE-MLA-SOFTMAX-SUM-GEN
    role: Last-loop generation of the aMlaSum normalization state.
  - id: SE-MLA-AMLASUM-UB-ONLY
    role: aMlaSum is retained in local UB state rather than a dedicated GM tail binding.
  confidence: high
  flow_group: V1
  card_type: numeric_side_channel
  pipeline_position: V1.MLA.nUpdate
  granularity: stage_card
  agent_usage:
  - stage2_strategy_seed
  related_cards: []
- id: OC-FD-STABLE-MERGE
  canonical_name: flash_decode.merge.stable_lse_weighted_reduce
  aliases:
  - fd_stable_merge
  - split_kv_lse_reduce
  title: FlashDecode stable merge combines split-KV partials
  applies_to:
    variants:
    - flash_decode
    owners:
    - FiaBlockVecFlashDecode<FIAT>
    stages:
    - flash_decode.merge
  pattern_summary: FlashDecode computes merge weights by taking column max over lseMax, exponentiating shifted values, multiplying by lseSum,
    accumulating partial outputs, and normalizing before final copy-out.
  optimization_intent: Keep split-KV final output numerically stable while preserving the partial-output workspace contract.
  preconditions:
  - FLASH_DECODE path is active and split-KV partial outputs plus LSE scratch have been materialized.
  - Metadata arrays describing per-core FD ranges are available through fdParams.
  tunable_knobs:
  - splitKVFlag
  - headDimAlign
  - mBaseSize
  constraints:
  - C-FD-METADATA
  - C-FD-USED-VEC-BOUNDS
  risks:
  - R-FD-LSE-MERGE
  - R-SPLITKV-PARTIAL-COLLISION
  possible_dsl_fields:
  - path: flash_decode.merge.weight_formula
    meaning: Ordered max/sub/exp/mul/sum/div merge sequence.
  - path: flash_decode.fdparams.metadata_arrays
    meaning: Per-core metadata arrays that map split-KV partials into FD tasks.
  - path: flash_decode.merge.output_layouts
    meaning: Final output copy-out choices for BSH/BNSD/NBSD/TND/NTD layouts.
  lowering_hint: Lower the merge formula and metadata arrays as one rule set; the weight formula alone is insufficient without the metadata partition
    contract.
  source_evidence:
  - id: SE-FD-MERGE-WEIGHT-FORMULA
    role: Stable merge formula over lseMax/lseSum and accumOut.
  - id: SE-FD-METADATA-PARTITION
    role: Construction of fdParams from metadata arrays.
  confidence: high
  flow_group: FLASH_DECODE
  card_type: numeric_merge
  pipeline_position: FD.merge
  granularity: stage_card
  agent_usage:
  - stage2_strategy_seed
  related_cards:
  - OC-FD-BLOCKIDX-TASK-MAPPING
- id: OC-WORKSPACE-NORMAL-RING
  canonical_name: workspace.normal_ring
  aliases:
  - normal_workspace_ring
  - mm1_vec1_mm2_vec2_contiguous_abi
  title: Normal workspace is a four-region contiguous ring
  applies_to:
    variants:
    - nonquant
    - gqa
    - mla
    owners:
    - FiaKernelNonQuant<FIAT>
    - FiaKernelNonQuantMla<FIAT, CubeBlockType, VecBlockType, FdBlockType>
    stages:
    - generic.mm1
    - gqa.mm1
    - gqa.vec1
    - gqa.mm2
    - gqa.vec2.output
    - mla.mm1
    - mla.vec1
    - mla.mm2
    - mla.vec2.output
  pattern_summary: Host formulas and kernel InitWorkspace agree on a contiguous ring ordered as mm1 -> vec1 -> mm2 -> vec2, with per-core per-preload-slot
    strides derived from mmResUbSize and bmm2ResUbSize.
  optimization_intent: Make workspace offsets stable so stage-local GM rings can overlap across preload slots without aliasing.
  preconditions:
  - Workspace has been initialized for the current kernel variant.
  - preLoadNum and element-width choices remain consistent between host tiling and kernel bindings.
  tunable_knobs:
  - preLoadNum
  - headDimAlign
  constraints:
  - C-WORKSPACE-CONTIGUOUS-ABI
  risks:
  - R-WORKSPACE-ABI-DRIFT
  possible_dsl_fields:
  - path: workspace.normal.regions[].base_offset_rule
    meaning: Contiguous region order for mm1, vec1, mm2, and vec2.
  - path: workspace.normal.regions[].slot_stride
    meaning: Per-preload-slot stride for each ring region.
  lowering_hint: Lower the normal workspace as one ordered ABI block; emitting independent anonymous buffers loses cross-stage offset validation.
  source_evidence:
  - id: SE-WORKSPACE-NORMAL-SIZE
    role: Host-side size formula for the four-region ring.
  - id: SE-WORKSPACE-NORMAL-ABI
    role: Kernel-side contiguous SetGlobalBuffer order.
  confidence: high
  flow_group: WORKSPACE
  card_type: workspace_abi
  pipeline_position: Workspace.normal_ring
  granularity: contract_card
  agent_usage:
  - stage2_strategy_seed
  related_cards: []
- id: OC-WORKSPACE-MLA-NUPDATE-BUDGET-STUB
  canonical_name: workspace.mla_nupdate_budget_stub
  aliases:
  - mla_nupdate_tail
  - mla_nupdate_budget_only_stub
  title: MLA nUpdate budget is represented through the normal.mm2 int32 alias
  applies_to:
    variants:
    - mla
    owners:
    - FiaTilingNonQuantMla
    - FiaKernelNonQuantMla<FIAT, CubeBlockType, VecBlockType, FdBlockType>
    stages:
    - mla.nupdate.compute
    - mla.nupdate.apply
    - mla.mm2.process
  pattern_summary: Host sizing reserves an MLA nUpdate-sized tail budget, but kernel binding scans expose no dedicated GM tail tensor; runtime
    correction writes through mm2ResInt32Gm, an int32 reinterpretation of the normal.mm2 workspace region.
  optimization_intent: Preserve the nUpdate budget as an ABI-visible stub while lowering the actual correction path through the observed normal.mm2
    alias.
  preconditions:
  - MLA host sizing path is active.
  - Validation tooling distinguishes host-budget stubs from explicit kernel SetGlobalBuffer regions and alias-based runtime consumers.
  tunable_knobs:
  - mBaseSize
  - preLoadNum
  constraints:
  - C-WORKSPACE-MLA-FD
  - C-WORKSPACE-MLA-NUPDATE-STUB
  risks:
  - R-MLA-TAIL-BUDGET-MISMODELED
  - R-MLA-NUPDATE-TAIL-MISLOWERED
  - R-WORKSPACE-ABI-DRIFT
  possible_dsl_fields:
  - path: workspace.mla.tail_regions[region_id=mla.nupdate].binding_status
    meaning: The nUpdate tail is host-budget-only and must not be emitted as a standalone GM region.
  - path: workspace.normal.regions[region_id=normal.mm2].aliases[].name
    meaning: mm2ResInt32Gm is the runtime target for MLA nUpdate atomic correction.
  lowering_hint: Lower nUpdate as a budget stub plus normal.mm2 int32 alias rule; do not materialize a new GM tail without direct SetGlobalBuffer
    evidence.
  source_evidence:
  - id: SE-WORKSPACE-MLA-ABI
    role: Host formula adds the nUpdate budget bytes.
  - id: SE-WORKSPACE-MLA-INIT-ORDER
    role: Kernel InitWorkspace does not bind an extra nUpdate GM tensor before FD scratch.
  - id: SE-MLA-MM2-INT32-ALIAS
    role: nUpdate correction aliases normal.mm2 through mm2ResInt32Gm.
  confidence: medium
  flow_group: WORKSPACE
  card_type: workspace_budget
  pipeline_position: Workspace.MLA.nUpdate_stub
  granularity: contract_card
  agent_usage:
  - stage2_strategy_seed
  related_cards: []
- id: OC-WORKSPACE-MLA-SOFTMAX-SUM-BUDGET-STUB
  canonical_name: workspace.mla_softmax_sum_budget_stub
  aliases:
  - mla_softmax_sum_tail
  - mla_amlasum_budget_only_stub
  title: MLA softmaxSum budget is bridged through local UB state
  applies_to:
    variants:
    - mla
    owners:
    - FiaTilingNonQuantMla
    - FiaBlockVecNonQuantMla<FIAT>
    stages:
    - mla.vec1
    - mla.vec2.output
  pattern_summary: Host sizing reserves an MLA softmaxSum tail budget, but kernel scans expose no dedicated GM binding; AmlaVecCompute materializes
    aMlaSumUb on the last S2 loop and DealBmm2ResBaseBlock consumes it through local UB broadcast.
  optimization_intent: Preserve the softmaxSum budget as an ABI-visible stub while modeling the observed Vec1-to-Vec2 normalization bridge through
    local UB state.
  preconditions:
  - MLA host sizing path is active.
  - Vec1 reaches the last S2 loop where aMlaSumUb is generated before Vec2 normalization consumes it.
  tunable_knobs:
  - mBaseSize
  - preLoadNum
  constraints:
  - C-WORKSPACE-MLA-FD
  - C-WORKSPACE-MLA-SOFTMAX-SUM-UB
  risks:
  - R-MLA-TAIL-BUDGET-MISMODELED
  - R-MLA-SOFTMAX-SUM-GM-INVENTED
  - R-WORKSPACE-ABI-DRIFT
  possible_dsl_fields:
  - path: workspace.mla.tail_regions[region_id=mla.softmax_sum].binding_status
    meaning: The softmaxSum tail is host-budget-only and must not be emitted as a standalone GM region.
  - path: workspace.mla.tail_regions[region_id=mla.softmax_sum].local_buffer_bridge
    meaning: AmlaVecCompute produces aMlaSumUb and DealBmm2ResBaseBlock consumes it from local UB state.
  lowering_hint: Lower softmaxSum as a budget stub plus local UB bridge; do not invent a GM producer/consumer path for aMlaSum without direct
    binding evidence.
  source_evidence:
  - id: SE-WORKSPACE-MLA-ABI
    role: Host formula adds the softmaxSum budget bytes.
  - id: SE-WORKSPACE-MLA-INIT-ORDER
    role: Kernel InitWorkspace does not bind an extra softmaxSum GM tensor before FD scratch.
  - id: SE-MLA-AMLASUM-UB-ONLY
    role: aMlaSum state is retained in local UB storage, not a dedicated GM tail.
  - id: SE-MLA-SOFTMAX-SUM-GEN
    role: Vec1 generates aMlaSumUb on the last S2 loop.
  - id: SE-MLA-SOFTMAX-SUM-CONSUME
    role: Vec2 consumes aMlaSumUb during final normalization.
  confidence: medium
  flow_group: WORKSPACE
  card_type: workspace_budget
  pipeline_position: Workspace.MLA.softmax_sum_stub
  granularity: contract_card
  agent_usage:
  - stage2_strategy_seed
  related_cards: []
- id: OC-WORKSPACE-FD-REGIONS
  canonical_name: workspace.flash_decode_regions
  aliases:
  - fd_workspace_regions
  - accumOut_lseSum_lseMax_abi
  title: FlashDecode workspace adds accumOut and split LSE regions
  applies_to:
    variants:
    - flash_decode
    owners:
    - FiaTilingNonQuant
    - FiaTilingNonQuantMla
    - FiaKernelNonQuant<FIAT>
    - FiaKernelNonQuantMla<FIAT, CubeBlockType, VecBlockType, FdBlockType>
    stages:
    - gqa.vec2.output
    - mla.vec2.output
    - flash_decode.merge
  pattern_summary: FlashDecode appends accumOut plus a split lseSum/lseMax super-region after the normal workspace, with offset rules shared by
    generic and MLA kernels.
  optimization_intent: Preserve stable split-KV partial export and merge offsets across host sizing and kernel readers.
  preconditions:
  - FLASH_DECODE path is active and splitKVFlag routes the operator into FD workspace sizing.
  - headDimAlign and per-task FD parameter counts remain consistent between host and kernel.
  tunable_knobs:
  - splitKVFlag
  - headDimAlign
  - mBaseSize
  - preLoadNum
  constraints:
  - C-WORKSPACE-CONTIGUOUS-ABI
  - C-FD-USED-VEC-BOUNDS
  risks:
  - R-FD-LSE-MERGE
  - R-WORKSPACE-ABI-DRIFT
  possible_dsl_fields:
  - path: workspace.flash_decode.accum_out
    meaning: Partial-output workspace region sized by FD task count and headDimAlign.
  - path: workspace.flash_decode.lse_sum_max
    meaning: Half-and-half LSE sum/max super-region and offset split rule.
  lowering_hint: Keep accumOut and lseSum/lseMax in the same lowering contract because the merge kernel assumes fixed contiguous offsets between
    them.
  source_evidence:
  - id: SE-WORKSPACE-FD-SIZE-NONQUANT
    role: Generic host-side FD workspace formula.
  - id: SE-WORKSPACE-FD-SIZE-MLA
    role: MLA host-side FD workspace formula.
  - id: SE-FD-WORKSPACE-OFFSETS
    role: Kernel-side split-LSE offset contract.
  confidence: high
  flow_group: WORKSPACE
  card_type: workspace_abi
  pipeline_position: Workspace.flash_decode_regions
  granularity: contract_card
  agent_usage:
  - stage2_strategy_seed
  related_cards: []
- id: OC-RUNINFO-THREE-STAGE-RING
  canonical_name: pipeline.runinfo_three_stage_ring
  aliases:
  - runinfo_ring
  - mm1_vec1_mm2_vec2_overlap
  title: RunInfo ring overlaps MM1, Vec1/MM2, and Vec2
  applies_to:
    variants:
    - nonquant
    - gqa
    - mla
    owners:
    - FiaKernelNonQuant<FIAT>
    - FiaKernelNonQuantMla<FIAT, CubeBlockType, VecBlockType, FdBlockType>
    stages:
    - gqa.mm1
    - gqa.vec1
    - gqa.mm2
    - gqa.vec2.output
    - mla.mm1
    - mla.vec1
    - mla.mm2
    - mla.vec2.output
  pattern_summary: ExecuteTask uses a three-entry RunInfo cache where the current slot drives MM1, the older slot drives Vec1 and MM2, and the
    previous slot drives Vec2 before being invalidated.
  optimization_intent: Overlap AIC/AIV stages across loops while keeping stage ordering and ring-slot ownership explicit.
  preconditions:
  - FIA_PRELOAD_TASK_CACHE_SIZE remains at least three slots.
  - preLoadNum and workspace ring depth are compatible with the scheduler overlap pattern.
  tunable_knobs:
  - preLoadNum
  - s2BaseSize
  constraints:
  - C-EVENT-ORDER-RUNINFO
  risks:
  - R-RUNINFO-STAGE-REORDER-DEADLOCK
  - R-SPLITKV-PARTIAL-COLLISION
  possible_dsl_fields:
  - path: pipeline.scheduler.runinfo_ring
    meaning: Mapping from loop-relative cache slot to stage responsibility.
  - path: pipeline.scheduler.invalid_after_vec2
    meaning: Slot invalidation happens after Vec2 finishes, not after MM2.
  lowering_hint: Emit the scheduler overlap as explicit slot roles instead of prose; stage graph builders need concrete loop-relative edges.
  source_evidence:
  - id: SE-RUNINFO-THREE-STAGE-RING-NONQUANT
    role: Nonquant/GQA ExecuteTask overlap pattern.
  - id: SE-RUNINFO-THREE-STAGE-RING-MLA
    role: MLA ExecuteTask overlap pattern.
  confidence: high
  flow_group: PIPELINE
  card_type: pipeline_scheduler
  pipeline_position: Pipeline.RunInfo.C1V1C2V2
  granularity: flow_card
  agent_usage:
  - stage2_strategy_seed
  related_cards: []
- id: OC-FD-METADATA-BRIDGE
  canonical_name: flash_decode.metadata_host_kernel_bridge
  aliases:
  - fd_metadata_bridge
  - split_core_fd_bridge
  title: FlashDecode metadata uses an explicit host-to-kernel bridge
  applies_to:
    variants:
    - flash_decode
    owners:
    - FiaTilingNonQuant
    - FiaTilingNonQuantMla
    - FiaKernelNonQuant<FIAT>
    - FiaKernelNonQuantMla<FIAT, CubeBlockType, VecBlockType, FdBlockType>
    stages:
    - flash_decode.merge
  pattern_summary: Host CreateSplitInput packages split-core inputs, SetSplitOutput copies fdRes arrays into tilingData, and both generic and
    MLA FlashDecode wrappers rebuild matching local arrays before the FD service runs.
  optimization_intent: Preserve the producer/consumer bridge contract even when the split-core planner implementation stays outside the extraction
    boundary.
  preconditions:
  - splitKVFlag routes the operator into FlashDecode workspace sizing and metadata generation.
  - usedVecNumOfFd and fdRes array ordering remain consistent across host and kernel.
  tunable_knobs:
  - mBaseSize
  - gS1BaseSizeOfFd
  - splitKVFlag
  constraints:
  - C-FD-METADATA
  - C-FD-USED-VEC-BOUNDS
  - C-SPLIT-CORE-FD-BRIDGE
  risks:
  - R-FD-METADATA-DESYNC
  - R-WORKSPACE-ABI-DRIFT
  possible_dsl_fields:
  - path: flash_decode.fdparams.used_vec_num
    meaning: Bound on active AIV cores that may enter the FD merge path.
  - path: flash_decode.fdparams.metadata_arrays
    meaning: Host-copied AIC/AIV arrays reconstructed by the kernel before the merge service runs.
  - path: split_core.range_assignments.bridge_status
    meaning: External planner implementation with verified host input/output surfaces.
  lowering_hint: Lower the split-core input package, fdRes copy bridge, and kernel consumer arrays as one schema family; the merge formula alone
    is incomplete.
  source_evidence:
  - id: SE-SPLIT-CORE-INPUT-PARAMS
    role: Host split-core input package.
  - id: SE-SPLIT-CORE-OUTPUT-BRIDGE
    role: Host fdRes bridge into tilingData.
  - id: SE-FD-METADATA-PARTITION
    role: Generic kernel consumer reconstruction.
  - id: SE-FD-METADATA-PARTITION-MLA
    role: MLA kernel consumer reconstruction.
  confidence: high
  flow_group: FLASH_DECODE
  card_type: host_kernel_bridge
  pipeline_position: FD.metadata_bridge
  granularity: bridge_card
  agent_usage:
