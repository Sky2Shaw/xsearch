version: 0.7-execution-closure
kind: atdsl.patch_plan.schema
purpose: Concrete, reviewable plan emitted before generating a source patch.
required_fields:
- patch_plan_id
- base_dsl_hash
- source_commit
- transforms
- rewrite_units
- validators
- rollback
rewrite_unit_schema:
  id: unique rewrite id
  schedule_point: schedule point id
  semantic_id: semantic field id
  dsl_path: canonical DSL path
  binding_role: role consumed from reviewed binding
  target_file: source file path relative to repo root
  anchor: AST/text anchor generated by binding stage
  rewrite_kind: replace_expr|replace_bool_expr|update_struct_field|update_tiling_assignment|update_workspace_region_formula|insert_no_alias_assert
  old_value: expected old value or symbolic value
  new_value: candidate value
  safety_guards: validators and forbidden transforms checked before emitting diff
rollback:
  strategy: git_reverse_patch
  must_emit_original_snippet: true
  must_emit_generated_by_comment: true
v0_6_required_fields:
- patch_plan_id
- source_root
- transforms
- rewrite_units
- contract_guards
- rollback
- status
contract_guard_schema:
  id: string
  schedule_point: string
  semantic_id: string
  verifier: string
  failure_class: string
  source_evidence: list[string]
required_sections:
- required_tests
- risk_guards
- dataflow_guards
- lifetime_guards
- knob_domain_checks
execution_closure_fields:
  required_tests: Tests selected from test_contract_ir for changed DSL paths.
  risk_guards: Risks from risk_ir associated with touched semantic fields or verifier IDs.
  dataflow_guards: Dataflow graph nodes/edges that must remain valid after patch.
  lifetime_guards: Memory resources whose live ranges must be preserved.
  knob_domain_checks: Knob domain/coupled-constraint checks from knob_ir.
