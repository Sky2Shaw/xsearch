version: 0.7-execution-closure
kind: atdsl.learning_ir
learned_patterns:
- id: LP-FIA-STAGE-TEMPLATE-IDENTITY
  operator_family: AiInfraFusedInferAttentionSink
  pattern: Critical stage functions and alias-aware shared vector stages must retain canonical_name, owner, owner_qualified, owner_template_args,
    template_params, variant, and stage.
  code_evidence:
  - reports/function_index.yaml
  - reports/critical_path_annotations.yaml
  - dsl/shared_stage_aliases.yaml
  dsl_field_path: pipeline.stage_graph.stages[].canonical_name
  optimization_intent: Prevent GQA/MLA/generic same-name stages from being merged and preserve shared-vector alias identity for GQA Vec1/Vec2.
  confidence: high
- id: LP-FIA-GQA-MM2-V-REUSE
  operator_family: AiInfraFusedInferAttentionSink
  pattern: GQA MM2 caches V L1 tiles with a coordinate signature while streaming P from Vec1 output.
  code_evidence:
  - op_kernel/fia_block_cube_nonquant_gqa_sink.h:1138-1222
  dsl_field_path: memory.l1_residency.gqa.v_snapshot
  optimization_intent: Reduce V reload traffic and preserve event lifetime.
  confidence: high
- id: LP-FIA-MLA-NUPDATE
  operator_family: AiInfraFusedInferAttentionSink
  pattern: MLA vector softmax emits row-wise nUpdate and applies it through an int32 atomic side channel before MM2 fixpipe.
  code_evidence:
  - op_kernel/fia_block_vec_nonquant_mla_sink.h:470-561
  - op_kernel/fia_block_vec_nonquant_mla_sink.h:657-717
  - op_kernel/fia_block_cube_nonquant_mla_sink.h:1034-1057
  dsl_field_path: mla.nupdate
  optimization_intent: Preserve online softmax correction across split S2 loops.
  confidence: high
- id: LP-FIA-FD-STABLE-MERGE
  operator_family: AiInfraFusedInferAttentionSink
  pattern: FlashDecode merges split-KV partial outputs using max/sum-normalized LSE weights.
  code_evidence:
  - op_kernel/fia_block_vec_flashdecode_sink.h:258-290
  - op_kernel/fia_block_vec_flashdecode_sink.h:437-556
  dsl_field_path: flash_decode.merge
  optimization_intent: Keep split-KV final output numerically stable.
  confidence: high
- id: LP-FIA-GQA-SHARED-VEC-ALIAS
  operator_family: AiInfraFusedInferAttentionSink
  pattern: GQA Vec1 and Vec2 are explicit alias stages owned by the shared FiaBlockVecNonQuant<FIAT> vector service rather than synthetic GQA-local
    vector owners.
  code_evidence:
  - reports/critical_path_annotations.yaml
  - dsl/shared_stage_aliases.yaml
  dsl_field_path: pipeline.stage_graph.stage_aliases
  optimization_intent: Allow automation to rebuild the GQA vector path without fabricating owners that do not exist in code.
  confidence: high
- id: LP-FIA-RUNINFO-THREE-STAGE-RING
  operator_family: AiInfraFusedInferAttentionSink
  pattern: Scheduler overlap uses a three-slot RunInfo ring where current drives MM1, older drives Vec1/MM2, and previous drives Vec2 before invalidation.
  code_evidence:
  - op_kernel/fia_kernel_nonquant_sink.h:882-909
  - op_kernel/fia_kernel_nonquant_mla_sink.h:836-862
  dsl_field_path: pipeline.scheduler.runinfo_ring
  optimization_intent: Preserve AIC/AIV overlap as an explicit Stage-2 scheduler policy.
  confidence: high
- id: LP-FIA-MLA-BUDGET-TAIL-STUB
  operator_family: AiInfraFusedInferAttentionSink
  pattern: MLA host sizing reserves extra nUpdate and softmaxSum bytes, but current kernel evidence exposes MM2 int32 aliasing and local UB aMlaSum
    rather than standalone GM tail bindings.
  code_evidence:
  - op_host/fia_tiling_nonquant_mla_sink.cpp:491-508
  - op_kernel/fia_kernel_nonquant_mla_sink.h:415-443
  - op_kernel/fia_block_vec_nonquant_mla_sink.h:266-279
  - op_kernel/fia_block_vec_nonquant_mla_sink.h:657-717
  dsl_field_path: workspace.mla.tail_regions[].binding_status
  optimization_intent: Separate budget-only ABI stubs from explicit workspace regions in Stage-2.
  confidence: medium
- id: LP-FIA-FD-METADATA-BRIDGE
  operator_family: AiInfraFusedInferAttentionSink
  pattern: split_core input params, host SetSplitOutput, and kernel FlashDecode wrappers form an explicit producer/consumer bridge for fdParams
    even though the planner implementation stays external.
  code_evidence:
  - dsl/flash_decode_metadata_bridge.yaml
  - reports/split_core_range_contract.yaml
  - op_host/fia_tiling_nonquant_sink.cpp:307-360
  - op_kernel/fia_kernel_nonquant_sink.h:731-761
  - op_kernel/fia_kernel_nonquant_mla_sink.h:650-691
  dsl_field_path: flash_decode.metadata_bridge
  optimization_intent: Preserve cross-boundary FD metadata semantics without pretending the external planner lives inside the kernel extraction.
  confidence: high
- id: LP-FIA-SHAPE-LAYOUT-CONTRACT
  operator_family: AiInfraFusedInferAttentionSink
  pattern: Query, attentionOut, and softmaxLse layouts normalize into a small set of canonical shape families with explicit varlen prefix rules.
  code_evidence:
  - dsl/shape_layout_contract.yaml
  - op_host/ai_infra_fused_infer_attention_sink_infershape.cpp:120-296
  - op_kernel/fia_block_vec_nonquant_mla_sink.h:751-774
  - op_kernel/fia_block_vec_flashdecode_sink.h:292-349
  dsl_field_path: shape_layout.contract
  optimization_intent: Let Stage-2 schema and validators consume shape/layout behavior as fields rather than scattered helper knowledge.
  confidence: high
- id: LP-FIA-SPARSE-POLICY
  operator_family: AiInfraFusedInferAttentionSink
  pattern: sparseMode, token windows, sink adjustments, and invalid-row handling form a host-to-kernel policy surface that must be kept coherent
    across tiling and vector stages.
  code_evidence:
  - dsl/sparse_policy.yaml
  - op_host/fia_tiling_nonquant_sink.cpp:461-475
  - op_host/fia_tiling_nonquant_sink.cpp:591-639
  - op_kernel/fia_block_vec_flashdecode_sink.h:390-438
  dsl_field_path: sparse.policy
  optimization_intent: Preserve semantic correctness of masked and sink-aware rows while keeping policy choices searchable and validateable.
  confidence: high
- id: LP-FIA-SCALAR-OFFSET-RULES
  operator_family: AiInfraFusedInferAttentionSink
  pattern: FD taskOffset, MLA preload-slot bases, and headDimAlign padded strides are reusable scalar formulas rather than incidental helper math.
  code_evidence:
  - dsl/scalar_offset_contract.yaml
  - op_kernel/fia_block_vec_flashdecode_sink.h:438-491
  - op_kernel/fia_block_vec_nonquant_mla_sink.h:657-717
  - op_kernel/fia_block_vec_nonquant_mla_sink.h:1120-1163
  dsl_field_path: scalar.offset_rules
  optimization_intent: Preserve correctness-visible address generation while exposing hoist and div/mod structure to Stage-2 lowering.
  confidence: high
negative_lessons:
- id: NL-FIA-DO-NOT-FLATTEN-COMPUTEMM2
  operator_family: AiInfraFusedInferAttentionSink
  lesson: Do not collapse ComputeMm2 by bare name; GQA, MLA, and generic nonquant bodies have different synchronization, L1, and nUpdate semantics.
  evidence: reports/function_index.yaml
  avoid_when: Indexing, aggregation, or DSL stage graph generation.
- id: NL-FIA-DO-NOT-SKIP-MLA-NUPDATE
  operator_family: AiInfraFusedInferAttentionSink
  lesson: MLA Vec1 is incomplete without AmlaVecCompute and ProcessAmlaNupdate.
  evidence: op_kernel/fia_block_vec_nonquant_mla_sink.h:470-717
  avoid_when: Extracting MLA vector stages.
- id: NL-FIA-DO-NOT-INVENT-GQA-LOCAL-VEC-OWNERS
  operator_family: AiInfraFusedInferAttentionSink
  lesson: GQA Vec1 and Vec2 are shared-vector alias stages; inventing fake GQA-local vector owners hides the real producer and consumer contracts.
  evidence: dsl/shared_stage_aliases.yaml
  avoid_when: Critical-path aggregation and Stage-2 stage-graph generation.
- id: NL-FIA-DO-NOT-TREAT-MLA-TAIL-AS-BOUND-GM
  operator_family: AiInfraFusedInferAttentionSink
  lesson: MLA host-budget tail bytes are not sufficient evidence for standalone GM producer and consumer bindings.
  evidence: auxiliary/workspace_cross_reference.yaml
  avoid_when: Workspace-layout lowering and validator authoring.
- id: NL-FIA-DO-NOT-BURY-STRUCTURE-IN-PROSE
  operator_family: AiInfraFusedInferAttentionSink
  lesson: When stage DAGs, memory lifetime, or dataflow are already recoverable from deep annotations, emit normalized graph artifacts instead
    of forcing downstream tooling to parse prose.
  evidence: auxiliary/pipeline_graphs.yaml
  avoid_when: Stage-1 artifact finalization for automation-oriented consumers.
- id: NL-FIA-DO-NOT-TREAT-FD-METADATA-AS-CONSUMER-ONLY
  operator_family: AiInfraFusedInferAttentionSink
  lesson: FlashDecode metadata is incomplete unless the split-core input package, SetSplitOutput bridge, and kernel consumer reconstruction are
    all represented together.
  evidence: dsl/flash_decode_metadata_bridge.yaml
  avoid_when: FlashDecode bridge extraction and Stage-2 metadata schema design.
- id: NL-FIA-DO-NOT-SCATTER-LAYOUT-FAMILIES
  operator_family: AiInfraFusedInferAttentionSink
  lesson: Shape and layout facts should live in one contract artifact; leaving them split across infer-shape, copy helpers, and FD output code
    forces Stage-2 to reconcile the same enum family repeatedly.
  evidence: dsl/shape_layout_contract.yaml
  avoid_when: Stage-1 schema-prep normalization.
- id: NL-FIA-DO-NOT-HIDE-OFFSET-MATH-IN-PROSE
  operator_family: AiInfraFusedInferAttentionSink
  lesson: Prefix sums, preload-slot bases, and padded-stride formulas are correctness-visible address rules and must be emitted as structured
    fields.
  evidence: dsl/scalar_offset_contract.yaml
  avoid_when: FD merge and MLA Vec2/nUpdate extraction.
search_policy:
  use_learned_patterns_as_priors: true
  use_negative_lessons_as_pruning_rules: true
