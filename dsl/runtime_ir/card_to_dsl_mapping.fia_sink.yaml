version: 0.9-card-driven-execution
kind: atdsl.card_to_dsl_mapping
purpose: Make every optimization card executable by binding it to DSL paths, schedule points, verifiers, tests, risk/dataflow/lifetime guards,
  and lowering policy.
mapping_policy:
  all_cards_must_have_mapping: true
  schedule_points_must_exist: true
  contract_guard_cards_must_not_emit_source_diff: true
  planner_cards_generate_candidates_before_transform_trace: true
  source_rewrite_requires_reviewed_binding: true
mappings:
- card_id: OC-GQA-MM2-L1-V-REUSE
  flow_group: C2
  card_type: optimization_pattern
  pipeline_position: C2.GQA.MM2
  dsl_paths:
  - kernel_ir.memory_plan.l1_residency.objects[v_tile]
  - lifetime_ir.items.gqa.v_l1_snapshot
  - dataflow_ir.graphs[dataflow.gqa.shared_vec]
  schedule_points:
  - sp_l1_v_residency_scope
  verifier_ids:
  - verify_v_l1_snapshot_lifetime
  - verify_syncV1C2_order
  lowering_policy: guarded_patch_requires_review
  required_tests: &id001
  - TEST-ST-GRAPH-CAPTURE-MLA-GQA
  - TEST-BENCHMARK-CACHED-REFERENCE
  risk_guard_policy: attach_related_risks_from runtime_ir/risk_ir.fia_sink.yaml
  dataflow_guards:
  - dataflow_ir.graphs[dataflow.gqa.shared_vec]
  lifetime_guards:
  - lifetime_ir.items.* related to card dsl_paths
  knob_checks: []
  candidate_generation: null
  agent_selection_hint:
    use_when_profile_stage_matches: C2
    use_when_evidence_mentions:
    - id: SE-GQA-V-L1-RELEASE
      role: V snapshot reuse and release condition inside GQA ComputeMm2.
    do_not_use_for_direct_patch_when: lowering_policy is contract_guard_only without an explicit paired source_rewrite schedule point
