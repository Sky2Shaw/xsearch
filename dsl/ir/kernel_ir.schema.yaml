version: 0.7-execution-closure
kind: atdsl.kernel_ir.schema
purpose: Represent schedulable execution structure for Ascend attention kernels.
loop_nest:
  profile_specific: true
  fields:
    order:
      type: enum
      values:
      - s_outer_m_inner
      - kv_outer_g_inner
      - g_outer_kv_inner
      - runinfo_ring_driven
      policy: configurable_guarded
    split_core_range:
      semantic_id: attention.core_mapping.split_core_range
      owner: split_core.range_contract
    fd_partition:
      semantic_id: flash_decode.partition
      owner: flash_decode.metadata_bridge
  split_core_range_assignments:
    semantic_id: split_core.range_assignments
    owner: split_core.range_contract
    fields:
    - core_idx
    - bn2_range
    - gs1_range
    - s2_range
    - fd_task_count
    producer: external split_core.h via FiaTilingNonQuant::CreateSplitInput/SetSplitOutput
    consumer: FD metadata arrays and loop partitioning
tiles:
  s2_base:
    semantic_id: attention.tiling.s2_base
    source_knob: s2BaseSize
    policy: searchable
    candidates:
    - 64
    - 128
    - 256
  m_base:
    semantic_id: attention.tiling.m_base
    source_knob: mBaseSize
    policy: searchable
    candidates:
    - 32
    - 64
    - 128
  nbuffer_m_base_size:
    semantic_id: mla.nbuffer.m_base_size
    source_knob: nBufferMBaseSize
    policy: fixed
  preload_slots:
    semantic_id: pipeline.scheduler.preload_slots
    source_knob: preLoadNum
    policy: fixed
  fd_g_s1_base_size:
    semantic_id: flash_decode.partition.g_s1_base
    source_knob: gS1BaseSizeOfFd
    policy: configurable_guarded
pipeline:
  kind: runinfo_three_stage_ring
  stage_graph:
    source_card: OC-RUNINFO-THREE-STAGE-RING
    owner_qualified_stages: true
  stages:
  - mm1_qk
  - vec1_softmax_lse
  - mm2_pv
  - vec2_store_or_fd_export
  - mla_nupdate?
  - fd_merge?
  event_policy:
    editable: false
    forbidden_transform: FT-NO-RUNINFO-STAGE-REORDER
  stage_aliases:
    purpose: Keep dispatcher-stage aliases separate from canonical shared vector service owners.
    schema:
      id: string
      alias_stage: string
      shared_owner: string
      canonical_name: string
      producer_stages: list[string]
      consumer_stages: list[string]
      source_evidence_ids: list[string]
    imported_from: source_refs/stage1_shared_stage_aliases.yaml
    required_for_profiles:
    - gqa_decode
    - flash_decode
memory_plan:
  spaces:
  - GM
  - UB
  - L1
  - L0A
  - L0B
  - L0C
  l1_residency:
    source_card: OC-GQA-MM2-L1-V-REUSE
    objects:
    - name: v_tile
      memory: L1
      scope: across_g
      reuse_by:
      - mm2
      snapshot_signature:
      - vCoord
      eviction: explicit_event_release
      event: V_EVENT
  workspace:
    normal_ring:
      source_card: OC-WORKSPACE-NORMAL-RING
      abi_locked: true
      regions:
      - normal.mm1
      - normal.mm2
      - normal.softmax_lse
      - normal.tmp
      offset_model: contiguous_abi_locked
      binding_required: true
    flash_decode_regions:
      source_card: OC-WORKSPACE-FD-REGIONS
      regions:
      - fd_partial_o
      - fd_partial_max
      - fd_partial_sum
      region_contracts:
      - region_id: fd_partial_o
        semantic_id: workspace.fd.partial_o
        sized_by:
        - aicNum
        - mBaseSize
        - headDimAlign
        - split_task_count
      - region_id: fd_partial_max
        semantic_id: workspace.fd.partial_max
        sized_by:
        - aicNum
        - mBaseSize
        - fp32_block
      - region_id: fd_partial_sum
        semantic_id: workspace.fd.partial_sum
        sized_by:
        - aicNum
        - mBaseSize
        - fp32_block
      alias_policy: must_not_overlap_normal_or_mla_budget_tail
      offset_rules:
      - scalar.offset_rules.fd_task_offset
      - scalar.offset_rules.fd_partial_output_offset
    mla_tail_regions:
      source_cards:
      - OC-WORKSPACE-MLA-NUPDATE-BUDGET-STUB
      - OC-WORKSPACE-MLA-SOFTMAX-SUM-BUDGET-STUB
      binding_status_required: true
      tail_regions:
      - region_id: mla.nupdate
        optimization_card_id: OC-WORKSPACE-MLA-NUPDATE-BUDGET-STUB
        binding_status: host_budget_only_stub_with_normal_mm2_alias
        kernel_binding_evidence:
          source_evidence_ids:
          - SE-WORKSPACE-MLA-ABI
          - SE-WORKSPACE-MLA-INIT-ORDER
          - SE-MLA-MM2-INT32-ALIAS
        local_buffer_bridge:
          producer: AmlaVecCompute writes the row-wise int32 vector into outputBuff2
          consumer: ProcessAmlaNupdate broadcasts the vector and atomically adds it into mm2ResInt32Gm
        validation_note: Do not lower this region as a standalone GM tensor until direct SetGlobalBuffer evidence appears.
      - region_id: mla.softmax_sum
        optimization_card_id: OC-WORKSPACE-MLA-SOFTMAX-SUM-BUDGET-STUB
        binding_status: host_budget_only_stub_with_local_ub_bridge
        kernel_binding_evidence:
          source_evidence_ids:
          - SE-WORKSPACE-MLA-ABI
          - SE-WORKSPACE-MLA-INIT-ORDER
          - SE-MLA-AMLASUM-UB-ONLY
        local_buffer_bridge:
          producer: AmlaVecCompute materializes aMlaSumUb on the last S2 loop
          consumer: DealBmm2ResBaseBlock broadcasts aMlaSumUb and divides the reloaded MM2 rows before copy-out
        validation_note: Preserve this as a budget-only ABI field with explicit UB bridge metadata.
flash_decode:
  route:
    split_kv_enabled:
      semantic_id: flash_decode.route.split_kv_enabled
      source_knob: splitKVFlag
      policy: configurable_guarded
  metadata_bridge:
    owner: flash_decode.metadata_bridge
    source_card: OC-FD-METADATA-BRIDGE
  merge:
    method: stable_lse_merge
    source_card: OC-FD-STABLE-MERGE
    stages:
    - col_max
    - row_sub
    - exp
    - mul_lse_sum
    - col_add
    - div_sum
  fdparams:
    semantic_id: flash_decode.fdparams
    bridge_status: imported_from_stage1
    producer_boundary:
      split_core_inputs:
        functions:
        - FiaTilingNonQuant::CreateSplitInput
        - FiaTilingNonQuantMla::CreateSplitInput
        source_evidence_ids:
        - SE-SPLIT-CORE-INPUT-PARAMS
        - SE-SPLIT-CORE-INPUT-PARAMS-MLA
        packaged_fields:
        - mBaseSize
        - s2BaseSize
        - gS1BaseSizeOfFd
        - preToken
        - nextToken
        - isS1G
        - sparseMode
        - attenMaskFlag
        - sinkNumber
        - keySinkNumber
        - actualLenQDims
        - actualLenKvDims
      split_core_outputs:
        functions:
        - FiaTilingNonQuant::SetSplitOutput
        - FiaTilingNonQuantMla::SetSplitOutput
        source_evidence_ids:
        - SE-SPLIT-CORE-OUTPUT-BRIDGE
        - SE-SPLIT-CORE-OUTPUT-BRIDGE-MLA
        copied_arrays:
        - usedVecNumOfFd
        - bN2IdxOfFdHead[]
        - gS1IdxOfFdHead[]
        - s2SplitNumOfFdHead[]
        - s2SplitStartIdxOfCore[]
        - gS1SplitNumOfFdHead[]
        - gS1LastPartSizeOfFdHead[]
        - gS1IdxEndOfFdHead[]
        - gS1IdxEndOfFdHeadSplit[]
    kernel_consumers:
    - variant: nonquant_or_gqa
      function: FiaKernelNonQuant<FIAT>::FlashDecode
      source_evidence_ids:
      - SE-FD-METADATA-PARTITION
      consumed_fields:
      - usedVecNumOfFd
      - gS1BaseSizeOfFd
      - bN2IdxOfFdHead[]
      - gS1IdxOfFdHead[]
      - s2SplitNumOfFdHead[]
      - gS1SplitNumOfFdHead[]
      - gS1LastPartSizeOfFdHead[]
      - gS1IdxEndOfFdHead[]
      - gS1IdxEndOfFdHeadSplit[]
    - variant: mla
      function: FiaKernelNonQuantMla<FIAT,CubeBlockType,VecBlockType,FdBlockType>::FlashDecode
      source_evidence_ids:
      - SE-FD-METADATA-PARTITION-MLA
      consumed_fields:
      - usedVecNumOfFd
      - gS1BaseSizeOfFd
      - bN2IdxOfFdHead[]
      - gS1IdxOfFdHead[]
      - s2SplitNumOfFdHead[]
      - gS1SplitNumOfFdHead[]
      - gS1LastPartSizeOfFdHead[]
      - gS1IdxEndOfFdHead[]
      - gS1IdxEndOfFdHeadSplit[]
    fields:
    - semantic_id: flash_decode.fdparams.used_vec_num
      source_field: usedVecNumOfFd
      type: uint32
      contract: Bounds active AIV cores that may enter FD merge path.
    - semantic_id: flash_decode.fdparams.bn2_idx_of_fd_head
      source_field: bN2IdxOfFdHead[]
      type: uint32[]
      contract: Maps FD task to batch-head group.
    - semantic_id: flash_decode.fdparams.gs1_idx_of_fd_head
      source_field: gS1IdxOfFdHead[]
      type: uint32[]
      contract: Maps FD task to gS1 partition origin in mBaseSize units.
    - semantic_id: flash_decode.fdparams.s2_split_num_of_fd_head
      source_field: s2SplitNumOfFdHead[]
      type: uint32[]
      contract: Per-task number of split-KV partials; feeds fd_task_offset prefix sum.
    - semantic_id: flash_decode.fdparams.gs1_split_num_of_fd_head
      source_field: gS1SplitNumOfFdHead[]
      type: uint32[]
    - semantic_id: flash_decode.fdparams.gs1_last_part_size_of_fd_head
      source_field: gS1LastPartSizeOfFdHead[]
      type: uint32[]
    - semantic_id: flash_decode.fdparams.gs1_idx_end_of_fd_head
      source_field: gS1IdxEndOfFdHead[]
      type: uint32[]
    - semantic_id: flash_decode.fdparams.gs1_idx_end_of_fd_head_split
      source_field: gS1IdxEndOfFdHeadSplit[]
      type: uint32[]
    validators:
    - fd_metadata_bridge_valid
    - split_core_range_contract_valid
    - fd_used_vec_bounds
sparse_policy:
  semantic_id: sparse.policy
  source_card: OC-COMMON-SPARSE-SINK-S2-RANGE
  mode:
    semantic_id: sparse.policy.mode
    enum_values:
    - LEFT_UP_CAUSAL
    - ALL_MASK
    - BAND
    - DEFAULT_MASK
  invalid_row_rule:
    semantic_id: sparse.policy.invalid_row_rule
    producer: FiaTilingNonQuant::IsExistRowInvalid
    consumers:
    - Vec1SinkSoftmaxProc
    - FlashDecode final LSE export
  fd_pre_next_token_rule:
    semantic_id: sparse.policy.fd_pre_next_token_rule
    source: FlashDecode::CalaPreNextTokens
    sink_adjustments: &id001
    - applies_when: sinkNumber > 0 and sparseMode == SPARSE_MODE_2 on the generic host path
      rule: nextToken is overwritten with sinkNumber before maskParams are finalized
      source_evidence_ids:
      - SE-SPARSE-MASK-PARAMS
      - SE-TEST-TILING-SINK-CONSTRAINTS
    - applies_when: sinkNumber > 0 in FlashDecode BAND or causal handling
      rule: nextTokensPerBatch is reduced by sinkNumber before invalid-row handling
      source_evidence_ids:
      - SE-FD-SPARSE-POLICY
      - SE-TEST-ST-EAGER-REFERENCE
  sink_adjustments: *id001
  s2_range_policy:
    semantic_id: sparse.policy.s2_range
    policy: configurable_guarded
  validators:
  - sparse_policy_contract
  - invalid_row_lse_correction
compute:
  scalar_offset_rules:
    semantic_id: scalar.offset_rules
    source_card: OC-SCALAR-RING-OFFSET-HOIST
    patterns:
    - id: fd_task_offset
      formula: taskOffset = sum_{i < fdTaskId}(s2SplitNumOfFdHead[i]) * mBaseSize
      lowering_hint: Hoist the prefix sum outside the per-gS1 partition loop and reuse it for both LSE and accumOut addressing.
      source_evidence_ids:
      - SE-FD-TASK-OFFSET-SCALARS
    - id: fd_partial_output_offset
      formula: combineAccumOutOffset = startRow * headDim + splitKVIndex * mBaseSize * headDim
      lowering_hint: Preserve the split-KV-major ordering used by CopyAccumOutIn.
      source_evidence_ids:
      - SE-FD-WORKSPACE-OFFSETS
      - SE-FD-TASK-OFFSET-SCALARS
    - id: mla_nupdate_atomic_base
      formula: baseoffset = (bn2IdxInCurCore % preLoadNum) * bmm2ResUbSize + (nBufferStartM + vecStartM + loop * mSplitSize) * headDim
      lowering_hint: Keep the preload-slot modulus and headDim stride coupled to the atomic add target.
      source_evidence_ids:
      - SE-MLA-NUPDATE-ATOMIC-TARGET
    - id: mla_mm2_reload_slot
      formula: srcGmOffset = (bn2IdxInCurCore % preLoadNum) * bmm2ResUbSize + mStart * headDimAlign
      lowering_hint: Preserve the preload-slot ring and padded stride when Vec2 rereads normal.mm2.
      source_evidence_ids:
      - SE-MLA-VEC2-NORMALIZE-COPY
      - SE-KNOB-HEADDIM-ALIGN
    - id: mla_fd_partial_offset
      formula: offset = accumTmpOutNum * kvHeadNum * mBaseSize * headDim + tndCoreStartKVSplitPos * kvHeadNum * mBaseSize * headDim + wsMStart
        * actualColumnCount
      lowering_hint: Do not collapse the task-prefix, split-index, and row-offset terms; each reflects a different stage boundary.
      source_evidence_ids:
      - SE-MLA-VEC2-NORMALIZE-COPY
    validators:
    - scalar_offset_consistency
    - workspace_contiguous_abi
    - fd_lse_merge_valid
  mla_nupdate:
    semantic_id: mla.nupdate.numeric_contract
    source_cards:
    - OC-MLA-MM2-NUPDATE-BARRIER
    - OC-MLA-NUPDATE-SIDECHANNEL
    compute_formula:
      ordered_micro_steps:
      - derive nUpdateTmp from softmax state
      - materialize aMlaSumUb on final S2 loop
      - broadcast nUpdate correction per row
      - atomic-add correction into mm2ResInt32Gm
      - MM2 waits on syncV1NupdateC2 before first fixpipe
      do_not_reorder:
      - atomic_add_before_mm2_fixpipe
      - aMlaSumUb_producer_before_vec2_broadcast
    broadcast_group: row_grouped_by_m_split_and_head_dim
    atomic_target: mm2ResInt32Gm via preload-slot baseoffset
    mm2_sync: syncV1NupdateC2
    forbidden_transform: FT-NO-REORDER-MLA-NUPDATE-MICRO_STEPS
